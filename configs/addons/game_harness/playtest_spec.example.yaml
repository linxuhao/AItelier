# playtest_spec.yaml — the authored TDD oracle for the Godot playtest gate.
#
# Lives at the PROJECT ROOT. Authored across two DPE steps:
#   * ARCHITECT declares the observable surface: `scene`, `actions`, `surface`
#     (which nodes/vars an assertion may reference) + scenario skeletons.
#   * PM fills each scenario's `assert` thresholds against that surface.
# The `godot_playtest` gate runs ONE isolated headless pass per scenario, drives
# its input `timeline`, and at each `assert` frame evaluates each assertion
# against the live node (as `self`) via Godot's Expression class.
#
# INPUT — a timeline entry presses keys with EXACTLY one of these two keys:
#   - { at: 0, press: flap }                    # one action on that frame
#   - { at: 7, actions: [move_right, skill_1] } # several on the same frame
# Any other key (`keys:`, `input:`, a typo) is a HARD failure reporting
# "unknown key" — the gate no longer skips what it cannot read. Don't confuse
# the TOP-LEVEL `actions:` (the list of action names the game uses) with a
# timeline entry's `actions:` (what to press this frame); both are legal.
#
# `assert` is a MAP of `Node.attr.path: expected`:
#   * scalar (true/false/number)        → equality  (paused: true → paused == true)
#   * string with a comparison operator → GDScript expression, verbatim
#   * "changed" / "unchanged"           → DIFFERENTIAL: compare against this
#     attr's value on frame 0 of this scenario. `actual` reports both
#     {baseline, current}. USE THIS for anything a keypress is supposed to move.
#   * node name is the key up to the 1st dot (scene sub-paths use '/', e.g.
#     "HUD/PausedLabel.visible").
#
# WHY differential matters: presence assertions ("visible == true",
# "grid_pos != null") score full marks on a game that ignores every keypress.
# That is not hypothetical — a shipped build passed every assertion while the
# player never moved, no enemy ever acted, and no damage was ever dealt.
#
# Hard failures include crashes, failure to load/run, malformed contracts,
# incomplete measurements, and the existing L0 input_dead check. L0 compares
# complete final state with an isolated no-input control for the same scene
# and budgets. Identical state hard-fails; a difference does not prove that
# each input was accepted. `pressed` is the normalized-timeline predicate,
# not an injection count or acceptance evidence.
# Assertion outcomes themselves stay ADVISORY — a wrong or flaky assertion is a
# prominent signal the verifier weighs, never a stalled build.
#
# Optional SCENARIO-ONLY declaration (requires cooperating application code):
#   input_observation: {node: Bird, property: input_acceptance}
# The declaration has exactly these two keys. `node` resolves a live Node;
# `property` is a single property identifier, not an expression or nested path.
# The application owns a Dictionary property initially containing:
#   {"version": 1, "decisions": []}
# Eligible timeline action presses carry event metadata `aitelier_input`:
#   {"version": 1, "run_id": "...", "seq": 1}
# At the actual action boundary, append one decision retaining that token:
#   {"run_id": token["run_id"], "seq": token["seq"], "decision": "accepted"}
# Use "accepted" only after a domain commit or entry into a committed queue.
# An explicit busy refusal may append "rejected". Handler entry, polling state,
# Viewport handled flags and digest differences are not acceptance evidence.
# Deferred code must retain the token and append before the terminal read.
#
# The probe reads this property once at its existing finish boundary. It adds
# no acknowledgement wait: frames remain max(last timeline frame + 30, floor).
# Missing decisions stay unknown; late decisions cannot change this report.
# Only returned timeline action presses have supported semantic acceptance.
# Three presses plus their automatic releases mean runtime_injected=3 and
# runtime_events_injected=6. Mouse, release and legacy acceptance is unsupported.
# Runtime receipts and the witness use the existing tagged observer separately:
# depth 8, 4096 raw nodes, and 65536 actual compact tagged UTF-8 bytes each.
# Refusal discards the receipt corpus but dispatch and runtime counters continue.
# Required incomplete observation hard-fails after dispatch; explicit measured
# rejection reports partial/false without changing authored assertion policy.
# Without a declaration there is no collection, metadata or witness read:
# acceptance is unobserved with null counts and acceptance_pass=null.
# A valid no-input declaration is not_applicable with acceptance_pass=null.
# The Dictionary witness remains outside L0; witness-only changes cannot pass L0.
#
# Absent → the gate falls back to the legacy canned smoke test (auto-press
# ui_accept, one end snapshot). This example targets a Flappy-Bird-style game.

scene: res://main.tscn          # optional — defaults to project.godot's main scene
frames: 300                     # optional global frame budget per scenario

# ARCHITECT: input actions the game uses (also defined in project.godot [input]).
actions: [flap]

# ARCHITECT: the observable surface — nodes + script vars an assertion may touch.
# This is the contract the implementer must match (exact node & var names).
# Include what proves PROGRESS (score, health, state), not just `visible`.
surface:
  Bird: [velocity, position, alive]
  ScoreLabel: [score]
  GameManager: [state]

scenarios:
  # PM authors the `assert` maps; ARCHITECT provided name + timeline shape.
  - name: gravity pulls the bird down when idle
    timeline:
      - at: 40
        assert:
          Bird.velocity.y: "velocity.y > 0"

  - name: a flap gives the bird upward velocity
    # Enable only after Bird implements the action-boundary contract above:
    # input_observation: {node: Bird, property: input_acceptance}
    timeline:
      - { at: 0, press: flap }
      - at: 8
        assert:
          Bird.velocity.y: "velocity.y < 0"
          Bird.position: changed        # differential: it actually MOVED

  - name: passing a pipe increments the score
    timeline:
      - at: 180
        assert:
          ScoreLabel.score: "score >= 1"

  # REQUIRED: at least one scenario drives the game all the way to a terminal
  # outcome. A suite that only checks intermediate state verifies that the game
  # boots, not that it can be played.
  - name: flying into a pipe ends the run
    timeline:
      - at: 260
        assert:
          Bird.alive: false
          GameManager.state: changed
