# configs/code_review.yaml
# One-shot adversarial diff review, callable by the coding-mode butler.
#
# The butler passes the change (task summary + git diff) as seed_text; this
# config is butler-driven (scheduler_owned: false), so start_config_run drives
# it inline via _run_pipeline_until_checkpoint and the verdict comes back
# synchronously inside the tool result — no completion hook needed.
#
# The verdict uses a tier-1 format spec: the model authors one tool argument
# per field, so backslashes in feedback (regexes, code) can never produce an
# unparseable verdict file.

name: "code_review"
description: "Adversarial review of a code diff → structured verdict"

x-aitelier:
  label: "Code Review"
  scheduler_owned: false          # driven inline by the butler
  seed_file: "review_request.md"
  output_step: "review"
  # This config PRODUCES no code, so it is handed no repository of its own.
  # Left at the default `code`, every run was stamped repo_type="new" and
  # git-init'd a throwaway repo under ~/.AItelier/projects/<run_id>; since the
  # dashboard groups by repo_path, each review then showed up as its own
  # standalone repository (25 of them before this was declared).
  #
  # `none` bounds what this config OWNS, not what it can read: a run launched
  # with `against_project` keeps the caller's repo_path and the repository
  # context source below resolves against it. Emitting no code and reading a
  # real repo are separate axes, and this is the one that says "emits none".
  repo_mode: none
  input_hint: >-
    seed_text = a one-line task summary followed by the VERBATIM `git diff`
    output — the raw diff hunks, NOT a description or summary of the changes
    (the reviewer rejects a request with no actual diff). Driven inline: the
    verdict (passed / feedback / findings) returns in the tool result.
    Add against_project=<project_id> to ALSO hand the reviewer the codebase:
    it can then check whether callers were updated and whether a test covers
    the change, neither of which a diff can show. Without it the review is
    diff-only and says so in its feedback.

begin: "review"

end_conditions:
  combinator: or
  conditions:
    - type: node_reached
      node: "review"
      result: "completed"
      require_completed: true

steps:
  - id: "review"
    step_type: "agent"
    agent_config: "diff_reviewer"
    context:
      - source: { config: "code_review", output: "review_request.md" }
      # Optional codebase access, which is what makes ONE config serve both
      # usages. With `against_project` the run is handed a real `repo_path`
      # (kept even under `repo_mode: none`) and this resolves to a `repo` read
      # layer; without it `code_root` is None, skillflow returns no roots rather
      # than failing, and the reviewer falls back to judging the diff alone.
      #
      # It closes a real blind spot: the template asks for "callers not updated"
      # and "no test covers this", neither of which a diff can answer — a diff
      # shows changed lines, never who calls them or what else tests them.
      # `mode: tool` and not `both`: a whole repository must never be inlined
      # into the prompt.
      - source: { from: "repository", mode: "tool" }
    output:
      mode: "content"
      fixed:
        verdict: { file: "review_verdict.json", format: '{"passed": bool, "feedback": str, "findings": [str, ...]}' }
    validation:
      - files: ["review_verdict.json"]
        tool: "json_schema"
        inline_schema:
          type: object
          required: [passed, feedback, findings]
          properties:
            passed: { type: boolean }
            feedback: { type: string }
            findings:
              type: array
              items: { type: string }
    transitions:
      - to: null
