name: run_tests
description: >
  Run the project's unit tests (pytest) over the current run worktree and write
  test_report.json {passed, returncode, summary, failures[], collection_errors[],
  skipped?, import_error?, no_tests_collected?, node?, repo_gate?, new_failures[],
  passed_relative, baseline_failures[], baseline_state}. `passed` is ABSOLUTE (did the whole
  suite pass). `new_failures[]` holds only the failures that are NOT in the
  known-red baseline and `passed_relative` is true when that list is empty —
  so a round can be graded on what IT broke instead of on a red the repo
  already carried. The baseline is a JSON file in the durable `state_dir` the
  `stateful` capability injects, under a per-repository subdirectory of it (one
  config runs against many repos). DECLARE `capability: stateful` on the step:
  without it no baseline is taken, `baseline_state` reports "unavailable" and
  `passed_relative` can never be true — an unmeasured baseline is not an empty
  one, and a report that said otherwise released a red run past the hold. It is
  seeded on the first run that finds none, and afterwards only shrinks, and only
  for a key this run can PROVE it executed (pytest's junit record of the tests
  it ran; the repo gate's own case list). A known-red test that was not
  collected stays known-red. `node` (npm
  install/build/test checks) is present when the repo holds a node project and
  a failing check also flips `passed`. `repo_gate` is present when the repo
  ships an executable `run_tests.sh` at its root — that script IS the repo's
  own declared gate (a Godot game's engine gate, say) and a failure flips
  `passed` too. A failing repository gate can participate in known-red only by
  emitting one complete line per failed case as
  `AITELIER_REPO_GATE_CASE={"case_id":"stable/id","status":"failed","detail":"..."}`.
  Missing, duplicate, malformed, ambiguous, or truncated case identities make
  `passed_relative` false and do not seed or change the baseline. pytest alone
  cannot see a product it does not build: on
  2026-09-10 a branch that regressed a game from 354/354 scripts parsing to 9
  parse errors reported 1788 passed, 0 failed here. A graph whose OWN steps
  already run the engine gate sets `repo_gate: false` in tool_params so the
  same gate is not paid for twice (dpe_game's run_tests steps do; coding_impl
  does not). Always succeeds as a step; the test
  outcome is captured in the report for the verifier to act on. A suite that
  collected NOTHING is reported as passed:false + no_tests_collected:true — a
  gate that checked nothing has not passed. If no test runner can be provisioned
  at all the gate records a distinct, non-passing infrastructure_unavailable
  outcome. Reports are artifacts, not source files; a code
  agent can read its report with read(source="self", path="test_report.json").
  A gate that did NOT run can say so with one whole line:
  `AITELIER_REPO_GATE_UNMEASURED={"state":"unmeasured|not_run|blocked","reason":"..."}`.
  `state` must be one of those three; `failed` / `red` never qualify, so one
  line cannot turn a red into an absence. UNMEASURED has exactly three
  sources: that declaration; the harness's own observation that it killed the
  gate or could not start it (a timeout, a runner error); and the admission
  relay's record that the engine did not answer the gate's LAST request
  (refused admission with a 409, unreachable, abandoned or undelivered)
  together with an exit code other than 0 and 1. An exit code is never a
  source by itself: the game repo's own gate uses 2 for `incomplete`, which
  includes contract files the implementer wrote wrong — "no authored
  scenarios found ... an empty one is not a pass" — and those are MEASURED
  failures with a non-empty `failures[]`; exit 1 is a red whatever the relay
  saw, and a non-0/1 exit after an answered request stays a measured failure.
  None of the three sources applies when the gate's retained report names a
  failure: any finding there makes the run `measured_fail`, whatever the exit
  code and whatever the relay recorded (`repo_gate.retained_findings` is their
  count). The declaration is read from the gate's WHOLE output BEFORE the
  2000-byte tail is retained, so it survives a real gate's log.
  The engine is reached through an admission relay
  (`aitelier/gate_admission.py`): the gate's `GODOT_BUILDER_URL` points at it,
  it asks the harness render queue to hold the request for up to
  `AITELIER_REPO_GATE_RENDER_WAIT_SECONDS` (default 1500) behind a live owner,
  it keeps the gate's socket alive with interim `100 Continue` responses until
  the harness admits the request, so the gate's own client timeout counts from
  admission, and it records what the engine said to every request
  (`repo_gate.admission.state` names the fate of the last one). Each run has a
  ticket (`repo_gate.ticket`) and its own `GATE_REPORT_DIR`
  (`$AITELIER_HOME/gate-reports/<ticket>`, with `admission.json`); failure
  identities are read from the gate's per-stage findings there, so they do
  not depend on the size of its stdout, and each is built from report fields
  that do not change between runs (a failing assertion is its scenario, name
  and frame, never its observed value).
  A gate that produced NO VERDICT is an ABSENCE only when nothing else in
  the report failed: beside any other entry in `failures[]` (a pytest red,
  a pytest timeout, a node check red, an unavailable node gate) the report
  goes back to `implement` like any other red. An absence does not loop
  back to `implement`: it is stated on the report (with
  `evidence_state: "not_run"`), with
  `repo_gate_unmeasured: true` and `repo_gate_absent: true` (plus
  `repo_gate.measured: "unmeasured"` and `repo_gate.attempts`, the number of
  runs the reading cost), and `configs/coding_impl.yaml` routes
  `repo_gate_absent` to the loop-external `test_gate_absent` gate. The edge is
  a FLAG match on this tool's own RETURN (`repo_gate_absent` is in the result
  dict, which the engine merges into the step's flags), NOT a `from_file`
  read: `from_file` resolves against the evaluating step's own output dir, so
  on the `test_evidence` validator (which writes nothing) the reader raised
  `FileNotFoundError` and the edge could never match, and moving it onto
  `test` still crashes the resolver on a report that parses to a list.
  Waiting for the gate and bounding how long a run
  may spend absent is the SCHEDULER's job (`core/gate_deferral.py`), not this
  step's: while an absence is live the run is not advanced and spends no
  implement cycle; when the wait runs out the run advances along the only edge
  out of `test_gate_absent`, back to `test`, which re-acquires the verdict
  alone; and past the episode's wall-clock ceiling, or once that edge has no
  traversal left under its `max_loop`, the run ends with
  `gate did not run: no verdict was measured` — never with a message that
  blames the code. ONE step makes ONE gate run (`REPO_GATE_UNMEASURED_ATTEMPTS
  = 1`): the re-acquisition that used to happen in-step held the scheduler for
  3 x 5400 s + 2 x 60 s, so the waiting is the poller's instead. Only a
  `measured_pass` licenses pruning that gate's known-red cases.
parameters:
  project_root:
    type: string
    description: "Path to the project repo (auto-injected by the engine)"
    required: false
  evidence_cycle_start:
    type: boolean
    description: "Create a new per-verification-cycle id; only the first gate sets this."
    required: false
  evidence_cycle_from:
    type: string
    description: "Step whose test_report.json carries the cycle id to inherit."
    required: false
  fail_fast_gates:
    type: string
    description: "JSON [[step,file],...] upstream reports; a confirmed failure writes upstream_failed and unresolved evidence writes upstream_unresolved, without invoking runners."
    required: false
  out_dir:
    type: string
    description: "Directory to write test_report.json (set to $STEP_DIR)"
  state_dir:
    type: string
    description: "Durable per-pipeline state dir, INJECTED by the `stateful`
      capability — holds the known-red baseline. Never pass a path by hand."
    required: false

# Its result carries passed/error, so a graph step running it MUST route the
# failure branch — read by forge_registry_check (fallible_tools_unrouted).
x-fallible: true

# Reports/metadata are artifacts even when invoked by a code-producing agent.
output:
  target: artifact
