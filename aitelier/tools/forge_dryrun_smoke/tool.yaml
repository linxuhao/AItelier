name: forge_dryrun_smoke
description: >
  Gate (c) of pipeline_forge validation. Boots a generated skillflow graph once in
  an ephemeral in-memory engine with a stub (no-LLM) StepRunner: agent steps
  return canned verdicts and every `step_type: tool` node is REPLACED by a stub
  agent returning the success flag — tool I/O never runs. Gates keep their
  transitions, so graph shape, reachability and termination are exercised; the
  tools those nodes name are only import-checked (load_fn). Asserts the graph
  loads, every tool/role constructs (no ImportError), a path reaches the
  loop-external `done` terminal, and it terminates within the step bound. A pass
  does NOT prove any tool works at runtime — only a real drive does. Returns
  {passed, status, steps_run, unresolved_tools, trail, error_reason,
  error} — on failure `error` quotes skillflow's own reason (e.g. "No matching
  transition from 'X' with flags {...}"), which names what to fix.
parameters:
  graph_path:
    type: string
    description: "Path to the generated graph YAML to smoke-test."
    required: true
  max_steps:
    type: integer
    description: "Hard bound on driven steps (default 200)."
    required: false
  verdict:
    type: boolean
    description: "Canned review verdict: true = happy path (default), false = adversarial."
    required: false
  out_dir:
    type: string
    description: "Step dir ($STEP_DIR) to write gate_error.md into on failure, so the
      maker can read it as context (the feedback: edge does not survive a backward
      loop-back). Removed on pass."
    required: false

# Its result carries passed/error, so a graph step running it MUST route the
# failure branch — read by forge_registry_check (fallible_tools_unrouted).
x-fallible: true
