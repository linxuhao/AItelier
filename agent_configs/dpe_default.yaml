task_implementer:
  model: "deepseek/deepseek-v4-flash"
  temperature: 0.2
  template: "task_implementer.md"
  # No "write": create/edit are derived from the step's output.mode (write).
  # Surgical create/edit prevents whole-file rewrites silently dropping unread code.
  tools: ["list_tree", "test_write", "read_test_written", "delete_file"]
  max_output_tokens: 32768
  max_tool_turns: 15
  native_tool_calling: true
  fallback_to_json_mode: true
  thinking:
    enable: true

