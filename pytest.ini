# pytest.ini
[pytest]
testpaths = tests
asyncio_mode = auto
# Real-network integration tests (live SearXNG / pypi / httpbin) are
# non-deterministic — deselected by default so the suite is reproducible.
# Run them explicitly with:  pytest -m network
# Docker-dependent suites (deployment scope, gate preparation, repo-gate tables)
# need the docker binary and a clean frozen Source. A disposable test container
# has neither, so they are deselected by default exactly like the network tests:
# run them explicitly with  pytest -m docker  where that environment exists.
addopts = -m "not network and not docker"
markers =
    network: test hits live external services (real URLs / SearXNG); opt-in.
    docker: needs the docker binary and a frozen clean Source; opt-in.
filterwarnings =
    # 忽略来自 litellm 内部针对 event loop 的弃用警告
    ignore:There is no current event loop:DeprecationWarning:litellm.*
