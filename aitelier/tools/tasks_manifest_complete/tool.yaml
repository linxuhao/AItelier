name: tasks_manifest_complete
description: >
  Validate the complete artifact candidate: every task in tasks_manifest.json
  has a card, and every card appears in execution_order. Report missing or
  unlisted card IDs so the agent can repair the affected files and manifest.
  Fail when all manifest IDs were already dispatched by this run's task loop;
  a new repair task requires a new ID. Return passed, error and affected IDs.

parameters:
  workspace_root:
    type: string
    description: "Directory holding tasks_manifest.json and tasks/ — the complete candidate injected by StepValidator."
    required: false
  step_dir:
    type: string
    description: "Fallback when workspace_root is not injected (ordinary tool-step use)."
    required: false
  out_dir:
    type: string
    description: "Fallback when neither workspace_root nor step_dir is set."
    required: false
