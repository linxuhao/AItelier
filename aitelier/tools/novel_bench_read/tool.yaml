name: novel_bench_read
description: >-
  Read required review materials via review/current_prose.md, review/review_context.md,
  or review/proposed_ledgers.md (bounded pages, follow next_start), or an exact frozen baseline novel/ file for the current writing-bench run.
  Does not read live source, author drafts, secrets, or another project. Returns
  source hash, explicit range and completeness; use next_start for the rest.
  Index summaries are previews; summary.md contains the complete recap.
parameters:
  path:
    type: string
    required: true
    description: "Relative novel/ path from the baseline context catalog."
  start:
    type: integer
    required: false
    description: "Character offset, default 0."
  length:
    type: integer
    required: false
    description: "Character budget; baseline maximum 20000. Review pages are bounded below native projection size; follow next_start."
output:
  target: artifact
