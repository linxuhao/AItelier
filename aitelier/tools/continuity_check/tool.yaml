name: continuity_check
description: >
  Cheap MECHANICAL hard gate between humanize and the Red review — only checks
  that need no reading comprehension. Hard violations (passed:false): prose
  missing, word count BELOW the pacing lower bound (the upper bound is advisory
  only), meta markers ([说明]/TODO) in prose, known-AI-ism density over
  threshold, and humanize fidelity vs the approved draft — title line unchanged,
  length within ±10 %, paragraph count within ±15 %. Over-length and ending
  shape are advisories. RAISES (no passed:false) when the draft itself is
  missing: a broken precondition, not a bad chapter. A pass proves nothing
  semantic — dead characters, OOC, power, timeline, hook strength are the Red
  reviewer's job, not string matching. On failure the returned `error` is
  feedback-injected into the draft step's retry; the full report
  (continuity_report.json) is written for the reviewer.
parameters:
  project_root:
    type: string
    description: "Project code repo root (auto-injected). Novel tree lives here."
    required: false
  workspace_root:
    type: string
    description: "Fallback root (auto-injected); used only when project_root is empty (tests)."
    required: false
  out_dir:
    type: string
    description: "This step's output dir (set to $STEP_DIR) — receives continuity_report.json"
    required: false
  prose_step_dir:
    type: string
    description: "Dir containing chapter_final.md (defaults to novel_chapter/humanize under the root)"
    required: false

# Its result carries passed/error, so a graph step running it MUST route the
# failure branch — read by forge_registry_check (fallible_tools_unrouted).
x-fallible: true
