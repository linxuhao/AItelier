# configs/addons/game_harness.yaml — Godot game-harness addon overlay.
#
# Injected into the engine-agnostic DPE base (dpe_default.yaml) at registration
# time via skillflow.compose (see api/dependencies.py). Keeps game/engine
# concerns OUT of the base pipeline: to target a different engine (a web
# harness, a mobile harness) you write a sibling addon and swap the base's
# `overlays:` list — you never fork the DPE graph.
#
# What it adds: a deterministic Godot gate after the test gate that
#   1. parse-checks every GDScript + scene in the repo (import), then
#   2. if that passed, headless-play-tests the main scene, capturing runtime
#      errors (with res:// file+line) AND a live snapshot of scene-tree state,
#   3. then LOOKS at the frames step 2 rendered and fails when the game is
#      unreadable even though every behaviour assertion passed.
# All three land in compile_report.json / playtest_report.json /
# vision_report.json, folded into 5_review so parse, runtime and readability
# failures loop back through the goal-loop. No-ops (passes) for non-Godot
# projects, so applying it unconditionally is safe.

name: "game_harness"
# Base binding: this addon targets dpe_default_v2's anchors, so it is specific to
# that base (not generic). `alias` names the blessed base+THIS-addon combo, which
# core/addon_registry.py registers at boot as a runnable config. Multi-addon runs
# (run(base, [game_harness, ...])) get an emergent name instead.
base: "dpe_default_v2"
alias: "dpe_game"
description: "Godot compile + headless play-test gate for game projects."
whenToUse: "Building a Godot game — adds the parse gate + runtime play-test that captures errors and live scene state."

overlay:
  # ── STEPS + TOOLS ──────────────────────────────────────────────────────────
  # 1. Mechanical (tool) channel: scaffold a Godot .gitignore into the repo right
  #    after it's created — guaranteed, doesn't depend on the LLM. Asset lives at
  #    configs/addons/game_harness/assets/dot_gitignore.
  - insert_after: "@post_repo_setup"
    steps:
      - id: "gh_scaffold"
        step_type: "tool"
        tool_name: "scaffold"
        timeout_seconds: 60
        tool_params:
          addon: "game_harness"

  # 2. Splice the Godot compile + headless play-test gate onto the edge out of
  #    the test gate.
  - insert_after: "@post_verify_tests"
    steps:
      - id: "5_compile"
        step_type: "tool"
        tool_name: "godot_compile"
        timeout_seconds: 300
        tool_params:
          out_dir: "$STEP_DIR"
        # No transitions: a step LIST wires sequentially, so this falls through
        # to 5_vision below, and 5_vision inherits 5_test's original target.

      # 2b. THE READABILITY GATE. 5_compile asserts STATE; this asserts that
      #     a player can SEE the state. jinyong-turn, 2026-08-22: scenario
      #     `two_phase_skill_unlock_and_hp_gate` passed 20/20 asserting
      #     `SkillButton5..8.disabled == true/false` — and in the frames that
      #     same run rendered, all eight buttons were pixel-identical across
      #     three rounds and two actor changes, no tile grid was visible in a
      #     tactical GRID game, five name labels were truncated to ellipses,
      #     and the health bars were unrecognisable as health bars. Every
      #     assertion was green. The play-test gate structurally cannot catch
      #     this: it reads the scene tree, not the pixels. So this step reads
      #     5_compile's OWN captures[] + frames/*.png — no extra playthrough,
      #     no extra render — and puts them in front of a vision model.
      #     The checklist is the game's own design record
      #     (design/30_presentation.md § 可读性硬要求), which also fixes the
      #     split: GEOMETRY (does the health bar follow its actor, do two rects
      #     intersect) stays in playtest_spec.yaml where numbers judge numbers,
      #     because the model scores a measured 0/2 on single-frame spatial
      #     questions; only RECOGNISABILITY and CROSS-FRAME DIFFERENTIAL
      #     questions come here, where it scores 3/3 and tracked a changing
      #     actor across four frames correctly. Frames go one scenario per
      #     call, chronologically, batched to the model's context — never
      #     sampled down.
      #     No project.godot → no-op pass, exactly like 5_compile. EVERY other
      #     way of not seeing (no report, no captures, missing PNGs, endpoint
      #     down, unparseable answer, a batch over budget) is a LOUD named
      #     failure rather than a pass: a vision check that cannot see and
      #     reports green is the precise defect this gate was built to catch.
      - id: "5_vision"
        step_type: "tool"
        tool_name: "godot_vision"
        timeout_seconds: 900
        tool_params:
          from_step: "5_compile"
          out_dir: "$STEP_DIR"
        # no transitions → auto-wired to 5_test's original target (5_knowledge)

  # ── CONTEXT ────────────────────────────────────────────────────────────────
  # 3. Let the final verifier read the gate's reports.
  - add_context: "@verifier_review"
    source: { step: "5_compile" }
  # 3a. …including the readability verdict. A verifier that reads only
  #     playtest_report.json reads 20/20 green over a screen no player could
  #     use, and signs the run off.
  - add_context: "@verifier_review"
    source: { step: "5_vision" }

  # 3b. And the PM — because the PM is who authors the FIX tasks. On a goal-loop
  #     iteration (5_review failed → back to "3") the PM is asked to plan repairs
  #     for a runtime failure whose only full account is playtest_report.json:
  #     per-scenario results, the assertion that failed, the captured node state,
  #     the frames. Without this the PM plans from the reviewer's prose summary
  #     of the report instead of the report.
  #     Live, jinyong-turn 2026-08-22: the PM called list(source="step:5_compile")
  #     and got "unknown source", then tried step:5 and found no playtest report
  #     there either — it was planning the turn-engine repair blind to the gate
  #     output that described the break.
  - add_context: "@pm"
    source: { step: "5_compile" }
  #     Same argument for 5_vision, and it bites harder: the readability
  #     failures ARE the task list ("no tile grid", "five names ellipsised"),
  #     and vision_report.json names the requirement each one broke. Without
  #     this the PM plans a UI repair from a one-line summary of what was
  #     unreadable.
  - add_context: "@pm"
    source: { step: "5_vision" }

  # ── PROMPT FRAGMENTS (add_template) ────────────────────────────────────────
  # 4. Godot conventions reach the architect/pm/implementer/verifier prompts ONLY
  #    when this addon is applied — the base templates stay engine-agnostic.
  #    The playtest_spec.yaml TDD contract is authored across two of them:
  #    architect declares the observable surface (scene/actions/nodes+vars +
  #    scenario skeletons); PM fills each scenario's assert thresholds; the
  #    implementer materialises the final spec into the repo verbatim; the
  #    godot_playtest gate reads it and evaluates the assertions.
  - add_template: "@architect"
    fragment: "game_harness/architect.md"
  - add_template: "@pm"
    fragment: "game_harness/pm.md"
  - add_template: "@implementer"
    fragment: "game_harness/implementer.md"
  - add_template: "@verifier_review"
    fragment: "game_harness/verifier.md"

  # ── DURABLE GAME DESIGN (design/) ──────────────────────────────────────────
  # 5. The design record that outlives a run. `step2_design.md` is per-run and
  #    disposable (it describes THIS run's change program); the game's actual
  #    systems, rules and content had no home in the repo at all — they lived in
  #    the meta_conversation brief, i.e. in the database. When the database went,
  #    every design decision ever made about the game went with it. Only the git
  #    repo survived. So the design record lives in the git repo.
  #
  #    Three channels, all in this addon:
  #      * gh_scaffold seeds the assets/design/ skeleton into a new repo
  #        (scaffold never clobbers, so an existing record is safe),
  #      * the architect and PM get it INLINE in their prompt — a contract they
  #        cannot forget to read, not a tool they might not call,
  #      * 5_design edits it after the run passes.
  - add_context: "@architect"
    source: { from: "repository", path: "design/", mode: "inline" }
  - add_context: "@pm"
    source: { from: "repository", path: "design/", mode: "inline" }

  # 6. The design keeper. Spliced onto 5_review's PASS edge — NOT at
  #    @post_verify_tests — because the record must describe what SHIPPED. At
  #    @post_verify_tests it would also run on goal-loop iterations that then
  #    fail and get thrown away, recording a design that never existed.
  #
  #    `output.mode: write` (same discipline as t_impl and novel_init's `design`)
  #    is the whole point: with `{from: repository}` as the baseline, the agent
  #    `edit`s the handful of design files this run actually changed and the rest
  #    are PHYSICALLY untouched. A content-mode slot would force a full rewrite of
  #    the document on every run — which does not scale past a small game, and
  #    quietly loses accumulated decisions the first time a model reorganises
  #    while regenerating.
  #
  #    Both transitions go to `done`, including the error branch: a failed design
  #    update must never sink an otherwise-green run. The cost is a stale record
  #    — visible in the run's step log, and recoverable, because it is in git.
  - insert_after: "@verifier_review"
    after_match: { from_file: "review_verdict.json", field: "passed", value: true }
    steps:
      - id: "5_design"
        step_type: "agent"
        agent_config: "game_designer"
        timeout_seconds: 600
        context:
          - source: { from: "repository", mode: "tool" }
          - source: { step: "2" }
          - source: { step: "5" }
          - source: { step: "5_compile" }
          # …and the readability verdict. The design keeper records what SHIPPED,
          # and "the buttons have no visual state at all" is a fact about the
          # shipped game exactly as much as a failed assertion is. Without this
          # the record would describe a build as delivered while the one gate
          # that looked at it said it was unreadable.
          - source: { step: "5_vision" }
        output:
          mode: "write"
        # No validation: a run that changed no design writes NOTHING, and that is
        # the correct outcome — a file_exists gate here would push the agent to
        # invent a change to satisfy it.
        lifecycle:
          on_deliver:
            - tool: "repo_apply"
              params:
                source_dir: "$STEP_DIR"
              on_failure: "skip"
        transitions:
          - to: "done"
            match: { _error: true }
          - to: "done"
