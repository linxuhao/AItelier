name: candidate_integrity
description: >
  Snapshot or verify the byte identity of the resolved candidate worktree around
  a report-only verifier. Requires engine-injected absolute roots, never follows
  repository symlinks, excludes only Git control metadata, and writes an immutable
  artifact report. A changed candidate or README is a hard error.
parameters:
  project_root:
    type: string
    description: "Absolute resolved candidate root ($PROJECT_ROOT)."
  out_dir:
    type: string
    description: "Absolute output directory ($STEP_DIR)."
  phase:
    type: string
    enum: [snapshot, verify]
  baseline_step:
    type: string
    description: "Sibling step containing candidate_snapshot.json; verify phase only."
    required: false
x-fallible: true
output:
  target: artifact
