[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aitelier"
version = "1.0.0"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # This storage migration spans host + engine. Exact-pin the reviewed public
    # release so an older engine cannot ignore the explicit output target.
    "skillflow-py==1.5.78",
    # coding_impl requires the native json_schema tool's full validator; its
    # import fallback checks only required fields and cannot enforce const.
    # 3.0 adds Draft 6/7; 3.0.2 fixes boolean-versus-number const comparisons.
    "jsonschema>=3.0.2",
    # The coding_impl focused_check tool invokes pytest before the full gate.
    # It cannot depend on a developer-only venv: the production image installs
    # this project with plain `pip install -e .`.
    "pytest>=8.0",
    # pytest.ini turns on `asyncio_mode = auto`, which is a PYTEST-ASYNCIO
    # switch. Undeclared, the image resolved a pytest with no plugin to honour
    # it and every `async def` test failed with pytest's own "async def
    # functions are not natively supported", while the host gate venv (which
    # happened to have the plugin) stayed green on the same tree.
    # No upper bound on pytest: pytest-asyncio's own metadata already bounds
    # the pytest it can load, and the divergence itself now has a check that
    # goes red (tests/unit/test_pytest_ini_switches_have_their_plugins.py), so
    # freezing the interpreter would buy nothing we have measured a need for.
    "pytest-asyncio>=1.0",
    "fastapi>=0.136",
    "typer>=0.24",
    "litellm>=1.85",
    # litellm's provider JSON path imports orjson at call time but no longer
    # pulls it transitively (litellm 1.92) — declare it so a rebuild never ships
    # a butler that 500s on the first LLM call with "No module named 'orjson'".
    "orjson>=3.10",
    "httpx>=0.28",
    "pydantic>=2.13",
    "apscheduler>=3.11",
    "tenacity>=9.1",
    # godot_vision ships every captured frame inline as base64 in the request
    # body. A 960x704 game frame is a ~900 KB PNG (the ink-wash background has
    # 62,937 distinct colours, so lossless re-compression buys 1.15x and nothing
    # more), and 4 frames per request is ~4.7 MB on the wire. Measured
    # 2026-08-26: 14 KB/s to the hosted judge = 5.5 minutes of upload PER
    # REQUEST, ~4.3 hours for a 47-scenario run, which is longer than the
    # interval between container recreates — so the gate could never finish.
    "pillow>=11.0",
    "rich>=15.0",
    "textual>=8.2",
    "prompt-toolkit>=3.0",
    "uvicorn>=0.44",
    "pyjwt[crypto]>=2.8",
    # MCP endpoint (api/mcp_router.py). Declared because the container runs a
    # plain `pip install -e .` — an undeclared import that happens to sit in
    # the host venv is not in the image.
    # Upper bound is load-bearing: mcp 2.x MOVED mcp.server.fastmcp, which
    # api/mcp_router.py imports. Unbounded, the image resolved 2.1.0 and the
    # backend crash-looped on ModuleNotFoundError while the host venv (1.28.1)
    # stayed green — the exact host/image split this dependency was declared
    # to close.
    "mcp>=1.28,<2",
]

[project.scripts]
aitelier = "cli.app:_entrypoint"

[tool.setuptools.packages.find]
include = ["cli*", "api*", "core*", "models*", "aitelier*"]
