# pytest.ini
[pytest]
testpaths = tests
asyncio_mode = auto
# Real-network integration tests (live SearXNG / pypi / httpbin) are
# non-deterministic — deselected by default so the suite is reproducible.
# Run them explicitly with:  pytest -m network
# Docker-dependent rows, if any return, are deselected by default exactly like
# the network tests: run them explicitly with  pytest -m docker  where that
# environment exists. As of 2026-11-09 none do — `pytest --collect-only -q -m
# docker tests/` selects zero rows and exits 5 — because the rows that carried
# the mark now install the entry executor themselves and run in the default
# shape. The mark stays registered for rows that genuinely need a daemon.
addopts = -m "not network and not docker and not baked_toolchain"
markers =
    network: test hits live external services (real URLs / SearXNG); opt-in.
    docker: needs the docker binary and a frozen clean Source; opt-in.
    baked_toolchain: needs binaries the image is expected to bake (/opt/aitelier-node,
        /opt/aitelier-eslint). They are absent from the shipped image today, so these
        tests cannot pass anywhere until that gap is closed; see the note on it.
filterwarnings =
    # 忽略来自 litellm 内部针对 event loop 的弃用警告
    ignore:There is no current event loop:DeprecationWarning:litellm.*
