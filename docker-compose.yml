# docker-compose.yml — AItelier backend + web UI in Docker.
#
#   docker compose up -d        # build (first run) + start
#   docker compose ps           # status
#   docker compose logs -f      # tail logs
#   docker compose down         # stop
#
# The CLI (`aitelier`) drives this automatically: it starts the backend if the
# container is down and reuses it if it is already running (see cli/server.py).
#
# State is the host's ~/.AItelier, mounted at the SAME absolute path inside the
# container (${HOME}/.AItelier) so DB + workspace paths match the host CLI.

services:
  aitelier:
    build:
      context: .
      args:
        # Derived from the invoking shell so paths/ownership match the host user.
        HOME_DIR: ${HOME}
        APP_UID: ${AITELIER_UID:-1000}
        APP_GID: ${AITELIER_GID:-1000}
    image: aitelier:latest
    container_name: aitelier
    # PID 1 = a minimal init (tini) that reaps orphaned grandchildren. The
    # run_tests tool shells out to pytest, which spawns git subprocesses; if a
    # run is killed/times out the git children get reparented to PID 1, and a
    # bare uvicorn PID 1 never wait()s on them → zombie pile-up → PID exhaustion.
    init: true
    # Run as the host user → files written into ~/.AItelier keep host ownership.
    user: "${AITELIER_UID:-1000}:${AITELIER_GID:-1000}"
    depends_on:
      zvec-grep:
        condition: service_healthy
    environment:
      # Path.home() resolves from HOME on POSIX → keep it == the host home dir.
      HOME: ${HOME}
      # Requests reach the container via the Docker bridge / Cloudflare tunnel,
      # never 127.0.0.1, so the app-level localhost guard must be relaxed.
      # Put Cloudflare Access (or equivalent auth) in front of the published port.
      AITELIER_ALLOW_EXTERNAL: "1"
      AITELIER_SECRETS_DIR: /run/aitelier-secrets
      AITELIER_GITHUB_TOKEN_FILE: /run/aitelier-secrets/GITHUB_TOKEN
      # Git auth for clone/push of GitHub repos. The credential helper feeds the
      # GITHUB_TOKEN secret (below) to github.com HTTPS remotes only — the token
      # stays in the secret file, only the helper *path* is in the environment.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "credential.helper"
      GIT_CONFIG_VALUE_0: "/app/docker/git-credential-helper.sh"
      # Godot projects: the godot_compile / godot_playtest tools POST the repo
      # path here for a license-free parse-check + headless play-test. Non-game
      # (Python/web) projects never call it.
      GODOT_BUILDER_URL: "http://godot-builder:8080"
      ZVEC_GREP_SERVER_URL: "http://zvec-grep:7998/mcp"
      # The readability gate (godot_vision) shows the frames the play-test
      # already rendered to a vision model and fails when the game is
      # unreadable despite green assertions. Reached over Tailscale, so the
      # host IP — not a compose service. Context length is the model's
      # max_model_len, and the tool derives from it how many frames fit per
      # call; it refuses to look at a subset rather than dropping frames.
      # The primary judge. It is legitimately absent much of the time (the
      # box is shared and gets restarted for other work), and that is what
      # the DeepSeek fallback in godot_vision/impl.py is for — a primary
      # that is simply not serving is NOT a reason to repoint this at
      # whatever else happens to be listening on that host. An experimental
      # vLLM on a neighbouring port is not the vision backend.
      # WHO judges now lives in model_routes.json under the internal model
      # `vision` (localqwen -> qwen plan -> deepseek pay-as-you-go); the tool
      # resolves it through llm_providers.json like every agent step does.
      # What stays here is the BUDGET, and it stays fixed on purpose: sizing
      # batches to whichever judge happened to answer would make the batch
      # layout — and so which frames are compared against each other — depend
      # on an infra accident.
      GODOT_VISION_CONTEXT_TOKENS: "12288"
      # Completion budget for the PRIMARY judge. Carved out of the
      # context above, so raising it shrinks the image budget: at 6144
      # there are still 5544 tokens for frames and a four-frame batch
      # costs 2652. Raised from 2048 on 2026-08-29 after the primary
      # starved twice in one day (it escalates once on its own, to
      # 4096, and starved at that too) — each time the gate went blind
      # and a human had to judge the frames by hand.
      GODOT_VISION_MAX_TOKENS: "6144"
    env_file:
      - .env
    volumes:
      # Live source: host repo shadows the baked-in copy (no rebuild on edits).
      - .:/app
      # API keys as FILES, not env vars → test/build subprocesses that inherit
      # os.environ never see them (same-uid code can read the files either way;
      # full isolation needs a separate sandbox). The WHOLE dir is mounted and
      # ai_router._read_secret() resolves them, so the set of key names is owned
      # by llm_providers.json alone — per-key enumeration here is what let this
      # file and the README drift apart (QWEN_API_KEY, 2026-08-27). Note for
      # self-hosted no-auth endpoints (localqwen): LiteLLM still wants SOME key,
      # so give those a placeholder file with any content.
      # The mount SOURCE follows the same env var the CLI provisions with —
      # one name, one meaning end to end. Before this, exporting
      # AITELIER_SECRETS_DIR=/data/secrets provisioned /data/secrets while the
      # container silently mounted the empty default dir (the recorded
      # AITELIER_MCP_URL two-meanings trap, re-created).
      - ${AITELIER_SECRETS_DIR:-${HOME}/.aitelier-secrets}:/run/aitelier-secrets:ro
      # The SPA bundle is baked into the image at /srv/web_dist (outside /app,
      # so this mount can't shadow it — served via AITELIER_WEB_DIST). A plain
      # `docker compose up -d --build` deploys frontend changes; no anonymous
      # volume, no --renew-anon-volumes.
      # Shared state at the identical absolute path the code expects.
      - ${HOME}/.AItelier:${HOME}/.AItelier
    networks:
      # Own private network, plus the gateway network cloudflared reaches us on.
      # `edge` is NOT declared external — see the networks: block at the bottom
      # for why that one missing word is what keeps a clean checkout working.
      - default
      - edge
    ports:
      # Loopback-only: the host CLI uses localhost:4444; the public path is via
      # cloudflared over the 'edge' network (aitelier:4444). Binding to 0.0.0.0
      # would let any LAN client reach the backend directly, bypassing Cloudflare.
      - "127.0.0.1:4444:4444"
    restart: unless-stopped
    # Both of these exist because this backend is reachable from the public
    # internet, where the callers are strangers and the cost of a request is
    # not something they have any reason to keep down.
    #
    # A memory ceiling. `repo/archive` deflates the whole working tree into an
    # in-memory BytesIO before it streams a byte, so one anonymous GET holds
    # ~12MB for as long as the client is slow to read it. With no limit set the
    # host simply runs out (14GB total, ~8GB free) and the kernel's OOM killer
    # picks the largest process — which is this one, mid-pipeline-run, and the
    # tokens already spent on the in-flight step die with it. A limit converts
    # that into a container restart on our own terms.
    mem_limit: 4g
    # A log ceiling. `json-file` with no options NEVER rotates, and every
    # anonymous request appends an access-log line. Docker keeps those under
    # /var/lib/docker on the ROOT filesystem — 91% full — while the roomy
    # volume is /home. Filling / takes down Docker and the host, not just this
    # container, which makes an unrotated log a worse outage than the traffic
    # that caused it.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4444/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Godot builder sidecar ──────────────────────────────────────────────────
  # License-free parse-check + headless play-test of generated Godot projects
  # (Godot 4 headless behind a tiny HTTP service). Reached only by game projects
  # at http://godot-builder:8080. ~250MB image (no editor, no account, no
  # license) — built lazily; skipped for non-game deployments that never start it.
  # zvec-grep sidecar — semantic + lexical code search for the agents
  # (aitelier/tools/semantic_search), reached at http://zvec-grep:7998/mcp on
  # the private network only (not on `edge`). Index a repo once:
  # The MCP surface is the AGENT toolset (search only): index/drop/status are
  # not reachable from inside aitelier, even by an agent with bash. The
  # entrypoint's indexer loop (docker/zvec-grep-entrypoint.sh) indexes every
  # new repo under ~/.AItelier/projects/* within a minute and keeps
  # `.zvec-grep/` out of git via .git/info/exclude. A repo elsewhere
  # (repo_type existing with a repo_path outside projects/) is indexed by hand:
  #   docker exec aitelier-zg zg index <abs repo path> --embedding local/potion-code-16m-v2 --mode server
  zvec-grep:
    build:
      context: .
      dockerfile: docker/zvec-grep.Dockerfile
    image: aitelier-zg:latest
    container_name: aitelier-zg
    user: "${AITELIER_UID:-1000}:${AITELIER_GID:-1000}"
    # Own network namespace on the private network: aitelier reaches it as
    # http://zvec-grep:7998/mcp (ZVEC_GREP_SERVER_URL; zvec-grep-proxy.js fronts
    # the loopback-only daemon, which refuses to listen anywhere else). It used to share
    # aitelier's namespace (network_mode: service:aitelier) so zg could bind
    # loopback — but then every `compose restart aitelier` tore the sidecar's
    # namespace away, compose does not restart dependents, and the daemon
    # came back dead (stale instance.lock + index lease). The agent toolset
    # is search-only, so being reachable from the private network is fine.
    networks:
      - default
    volumes:
      - ${HOME}/.AItelier:${HOME}/.AItelier
    restart: unless-stopped
    # sh is PID 1 in the entrypoint; it traps TERM and forwards it to zg so
    # the daemon unlinks its lock + leases. Give it time before the KILL.
    stop_grace_period: 20s
    healthcheck:
      # No curl in the node image; an empty POST through the proxy answers 400
      # when the daemon is up (anything <500), 502/refused when it is not.
      test: ["CMD", "node", "-e",
             "fetch('http://127.0.0.1:7998/mcp',{method:'POST'}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  godot-builder:
    build:
      context: .
      dockerfile: Dockerfile.godot
    image: aitelier-godot:latest
    container_name: aitelier-godot
    # Same host user → can read the host-owned workspace files it checks.
    user: "${AITELIER_UID:-1000}:${AITELIER_GID:-1000}"
    environment:
      PORT: "8080"
      # Writable HOME for Godot's import cache when run as an arbitrary host uid
      # (the image's /tmp/godot-home is 0777; keep it off the read-only mount).
      HOME: /tmp/godot-home
    volumes:
      # Read-only view of the workspace at the IDENTICAL absolute path the main
      # container uses, so a project_dir passed over HTTP resolves the same here.
      # Both /compile and /playtest copy the project to a container-local tmp dir
      # before importing/running, so the source stays read-only.
      - ${HOME}/.AItelier:${HOME}/.AItelier:ro
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Cloudflare ────────────────────────────────────────────────────────────
  # Publishing through an existing cloudflared connector is OPTIONAL and lives
  # named by AITELIER_EDGE_NETWORK — see the networks: block below.

networks:
  # The backend's own private network.
  default:
  # The network cloudflared reaches the backend on, selected BY NAME ONLY.
  #
  # Name an existing network (AITELIER_EDGE_NETWORK=cloudflare_edge on this
  # deployment — confirm with `docker network ls`, and confirm it is the one the
  # connector is on, because a name that matches nothing is CREATED, not
  # refused) and compose attaches to it; leave it unset and compose creates the
  # throwaway `aitelier_edge_unused` and a clean checkout still starts.
  # `external: true`
  # is deliberately ABSENT: it makes compose REFUSE TO RUN when the network is
  # missing, before a single container starts, and that is what forced this out
  # into an optional `-f` overlay in the first place.
  #
  # The overlay is gone because it cost an outage on 2026-08-25: a rebuild run
  # as a plain `docker compose up -d` (no -f) recreated the container without
  # the gateway network. The container stayed healthy, 127.0.0.1:4444 kept
  # answering 200, and the public path was simply gone with nothing saying so.
  # One name in .env, one file, no -f to forget.
  #
  # `compose down` does not remove a network it did not create, so pointing at
  # a shared network cannot take it away from whoever else is on it. The cost of
  # dropping `external:` is that a TYPO'd name silently creates a new empty
  # network instead of failing — check `docker inspect aitelier` if the public
  # path is dark while localhost answers.
  edge:
    name: ${AITELIER_EDGE_NETWORK:-aitelier_edge_unused}
