# configs/subagent.yaml
# GATED generalist sub-agent: a spawned worker does the task the driver hands it,
# then TWO gates check the result and loop it back until both pass (bounded):
#   1. an OBJECTIVE test gate (run_tests) — deterministic, can't be sweet-talked;
#   2. an adversarial RED reviewer — for scope/correctness the tests don't cover.
# This is the Green/Red pattern applied to a generic task — it lets even a cheap
# worker converge to a reviewed result, all in the spawned agents' own context
# (never the driver's).
#
# The test gate runs FIRST (cheap, deterministic): if the change breaks the
# suite, it loops straight back to work with the failing report — the reviewer,
# which has no way to execute code, never had to catch that. On a repo with no
# runnable tests run_tests reports passed=True (skip), so a test-less task is
# unaffected. The red gate is only as good as the reviewer: the review role is
# prompted to REFUTE, and the worker's context includes the last verdict AND the
# last test_report so it fixes the named problems. Bounded by max_loop on each
# loop-back edge; on the pass path (test green → review passes) the run ends.
# Needs skillflow-py >= 1.5.2 (max_loop on a tool-fed gate edge).

name: "subagent"
description: "Gated generalist worker: do a task, red-review + fix loop, until it passes"

x-aitelier:
  label: "Sub-agent (gated)"
  scheduler_owned: true           # spawned agents, context isolated
  seed_file: "task.md"
  output_step: "review"
  input_hint: >-
    seed_text = a self-contained task to carry out (implement X, refactor Y).
    Add against_project=<repo> to work in an existing repo. A spawned worker
    does it, then two gates loop it back with feedback until both pass (max 3
    tries each): an objective test gate (run_tests — skipped on a repo with no
    runnable tests) then an adversarial reviewer. The result is committed. Poll
    to completion; read the final verdict + summary. For a pure "make the tests
    pass" task with no design judgement needed, fix_tests is leaner (test gate
    only, no reviewer).

begin: "work"

end_conditions:
  combinator: or
  conditions:
    # Terminate at the loop-EXTERNAL `done` gate, reached only when the review
    # passes (review → done). node_reached must NOT be `review`: it's inside the
    # loop, so a stale `completed` review row from a prior (failed) iteration
    # would fire node_reached and end the run before the fixed work is reviewed
    # (the premature-firing trap proven in coding_impl). `done` is a gate (no
    # completed row), reached at most once. The never-passes loop is bounded by
    # max_loop:3 below.
    - type: node_reached
      node: "done"
      result: "completed"
    - type: node_reached
      node: "node_gate_incomplete"
      result: "failed"
    - type: max_total_steps
      limit: 60

steps:
  - id: "work"
    step_type: "agent"
    agent_config: "subagent_worker"
    timeout_seconds: 600
    context:
      - source: { from: "repository", mode: "tool" }
      - source: { config: "subagent", output: "task.md" }
      - source: { step: "test" }          # on loop-back: the failing test_report
      - source: { step: "review" }        # on loop-back: the reviewer's feedback
      - source: { tool: "dir_tree" }
    output:
      mode: write
      target: code
    transitions:
      - to: "test"

  # Objective gate — run the suite on the worker's committed change BEFORE the
  # LLM reviewer sees it. A test-breaking change loops straight back to work
  # (the reviewer can't execute code, so it never had to catch this). On a repo
  # with no runnable tests run_tests reports passed=True, so this is a no-op
  # there. Mirrors the fix_tests gate.
  - id: "test"
    step_type: "tool"
    tool_name: "run_tests"
    # The known-red baseline lives in the durable `state_dir` this capability injects.
    # Without it run_tests is handed none, no baseline is ever taken, and every
    # pre-existing red in the repo is reported as this round's — see configs/coding_impl.yaml.
    capability: "stateful"
    timeout_seconds: 1200
    tool_params:
      out_dir: "$STEP_DIR"
    transitions:
      # Order is load-bearing (the engine takes the first match). A measured red
      # keeps its fix loop even when a project was not measured, so the failing
      # edge comes first. Only then does an unmeasured project stop a green from
      # reaching the reviewer: a partial report with `passed: true` has no measured
      # red, and without the partial edge it would go on to review as green.
      #
      # THE COMPLETENESS VERDICT NOW COMES OFF `run_tests`' RETURN, AND THE
      # SUCCESS EDGE IS POSITIVE — it requires `node_gate_complete: true`, not
      # merely "not known to be incomplete". Measured fail-open this replaces: a
      # report that did not CONTAIN the key at all (an executor image older than
      # this config, a report written by another producer) matched neither the
      # partial edge nor the success edge as worded below, fell through to the
      # raw `passed: true` that used to sit here, and went on to review as a
      # green build with the node gate unmeasured. Now an absent key matches
      # NOTHING and the run dies on "No matching transition from 'test'".
      # See `configs/fix_tests.yaml` for the same change and the two measured
      # reasons `from_file` is not used for this field (`coding_impl.yaml:
      # 205-235`: the reader is step-bound, and a report parsing to a list raises
      # AttributeError inside the engine's `_flags_match`).
      #
      # The red edge stays on the file deliberately: a non-delivery return
      # (`written: None`, a storage failure) carries `passed: false` with no
      # report and no `node_gate_complete`, and matching it off the return would
      # charge implement laps to something no edit can fix.
      - to: "work"                         # tests red → fix, with the report
        match: { from_file: "test_report.json", field: "passed", value: false }
        max_loop: 3
      - to: "node_gate_incomplete"         # green, but a node project was not measured → not a success
        match: { field: "node_gate_complete", value: false }
      # Green AND said complete. BOTH terms: an EXHAUSTED `max_loop` edge is
      # skipped by the resolver, so once the three repair laps are spent the red
      # edge stops matching and the routing comes back through here — measured,
      # a success edge keyed only on `node_gate_complete: true` turned a suite
      # that never passes into `completed`
      # (tests/skillflow/test_gated_pipelines.py::test_subagent_test_never_green_fails_bounded).
      # The completeness term is what an absent key can never satisfy.
      - to: "review"                       # measured complete AND green → adversarial review
        match: { node_gate_complete: true, passed: true }

  - id: "review"
    step_type: "agent"
    agent_config: "subagent_reviewer"
    timeout_seconds: 300
    context:
      - source: { from: "repository", mode: "tool" }
      - source: { config: "subagent", output: "task.md" }
      - source: { step: "work" }
      - source: { tool: "dir_tree" }
    output:
      mode: "content"
      fixed:
        verdict: { file: "review_verdict.json", on_exists: "new", format: '{"passed": bool, "feedback": str, "findings": [str, ...]}' }
    validation:
      - files: ["review_verdict.json"]
        tool: "json_schema"
        inline_schema:
          type: object
          required: [passed]
          properties:
            passed: { type: boolean }
            feedback: { type: string }
    transitions:
      - to: "done"                          # passed → loop-external terminal
        match: { from_file: "review_verdict.json", field: "passed", value: true }
      - to: "work"                          # failed → fix, with the feedback
        match: { from_file: "review_verdict.json", field: "passed", value: false }
        max_loop: 3

  # Loop-external terminal — reached only after the review passes; the node the
  # end-condition fires on. Gate = no completed step row, so it fires at most once.
  - id: "done"
    step_type: "gate"
    transitions:
      - to: null

  # Terminal: a node project the run did not measure. Reached only from `test`
  # (edge above). Not a success, and not a review: the reviewer has no way to
  # measure what the gate did not. Declared in end_conditions so the run ends
  # here, as `failed`.
  - id: "node_gate_incomplete"
    step_type: "gate"
    transitions:
      - to: null
