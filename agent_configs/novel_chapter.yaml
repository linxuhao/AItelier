# agent_configs/novel_chapter.yaml — 章循环角色配置。
# 路由所有权：角色只选择稳定的内部别名；实际供应商、端点和 effort 属于部署方
# gitignored model_routes.json。novel 负责章纲/正文，novel_alt 负责去 AI 味与正文
# 评审，使生成者和文字判断者保持不同路由；flash 负责结构化对照与信息抽取。
# tracked model_routes.example.json 为干净 checkout 声明可运行的公开默认值。

novel_outliner:
  model: "novel"
  template: "novel_outline.md"
  # Web tools: pull current 梗/时事 or sample a "写得像《X》/像作者Y" style ref while
  # planning. Used ON DEMAND only (see template) — most chapters need zero searches.
  # web_search needs SEARXNG_URL set; unset → it fails soft and the outliner proceeds.
  tools: ["web_search", "web_fetch"]
  max_tool_turns: 40
  native_tool_calling: true
  fallback_to_json_mode: true
  thinking:
    enable: true

novel_outline_reviewer:
  model: "flash"
  template: "novel_outline_review.md"
  tools: []
  native_tool_calling: true
  fallback_to_json_mode: true
  thinking:
    enable: true

novel_writer:
  model: "novel"
  template: "novel_draft.md"
  tools: []
  max_tool_turns: 40   # full chapter prose (2000-4500字) in one write
  native_tool_calling: true
  fallback_to_json_mode: true
  thinking:
    enable: true

novel_humanizer:
  model: "novel_alt"
  template: "novel_humanize.md"
  tools: []
  max_tool_turns: 40   # rewrites full chapter prose in one write
  native_tool_calling: true
  fallback_to_json_mode: true
  thinking:
    enable: true

novel_chapter_reviewer:
  model: "novel_alt"
  template: "novel_draft_review.md"
  tools: []
  native_tool_calling: true
  fallback_to_json_mode: true
  thinking:
    enable: true

novel_humanize_reviewer:
  # A/B fidelity diff (did anything but the language change?) — a comparison
  # task, not creative judgment, so flash is the right tier. Red already judged
  # quality on the draft; this one must NOT re-litigate it.
  model: "flash"
  template: "novel_humanize_review.md"
  tools: []
  native_tool_calling: true
  fallback_to_json_mode: true
  thinking:
    enable: true

novel_finalizer:
  model: "flash"
  template: "novel_finalize.md"
  tools: []
  max_tool_turns: 40   # chapter_events.json can be a sizeable structured write
  native_tool_calling: true
  fallback_to_json_mode: true
  thinking:
    enable: true

novel_finalize_reviewer:
  # 分录 vs 正文的事实核对（虚报节点/漏记/数字/hint≠resolve）——对照审计而非
  # 创作判断，flash 档与 finalize 同级。这是分录入册前唯一的专业审查。
  model: "flash"
  template: "novel_finalize_review.md"
  tools: []
  native_tool_calling: true
  fallback_to_json_mode: true
  thinking:
    enable: true
