# agent_configs/coding_impl.yaml
# Spawned implementer for the offloaded coding_impl graph. A REAL spawned agent
# (unlike coding_task's placeholder roles): it does the work in its own
# ephemeral context, so nothing here lands in the butler's window. Mirrors DPE's
# task_implementer tooling (generic code mutation uses native apply_patch).

offload_implementer:
  model: "flash"
  temperature: 0.2
  template: "coding_impl.md"
  # Generic code editing uses the explicitly granted apply_patch tool. list_tree/test helpers as DPE.
  #
  # semantic_search, same as DPE's task_implementer: the repository reaches this
  # step as READ TOOLS, and skillflow's `read` returns at most 24,000 chars, so
  # a file above that can only be assembled by paging. The wuxia source has
  # passed that line — cultivation.gd is 149 KB (7 perfect reads), save_manager
  # .gd 70 KB, player_profile.gd 48 KB, and the contract READMEs the facets
  # migration produced run to 39 KB. Measured 2026-09-10 on four zero-delivery
  # runs: 33 reads over 7 distinct files, save_manager.gd read 21 times,
  # cultivation.gd 11 times, 0 writes, the whole 32-turn budget spent before
  # the first line of code. Retrieval is what that step was missing; its DPE
  # twin has had it since the zg sidecar landed, and the sidecar already
  # indexes every run worktree.
  tools: ["focused_check", "semantic_search", "list_tree", "test_write", "read_test_written", "apply_patch"]
  max_output_tokens: 32768
  # 200. Raised from 100 on 2026-09-21 (owner approved) after SIX rounds died
  # at this wall in one day: 100/100, 106/106, 108/108, 116/116 -- every number
  # inside [100, 100 + _MAX_TURN_GRANTS * _GRANT_TURNS_MAX] = [100, 116].
  # Measured on the round that died at 100/100 (attempt-8c8461af, State DAG
  # project `aitelier`): its 100 turns were 47 read + 33 apply_patch + 11 search
  # + 7 focused_check + 2 list_tree, with exactly one tool call per turn and no
  # idle turn. It had made 25 successful writes across 9 files and stood at 18
  # of its own 19 tests green. It was not looping; it ran out.
  # Known and NOT fixed by this number: 35 of those 47 reads re-read a file
  # already read (12 unique files; core/state_commands.py read 12 times), so a
  # larger budget may buy the same waste twice. That is a separate card.
  # The earlier note (2026-09-09 contract batch: written-at-31-of-32, 16 calls
  # grounding before the first write) is why the base is not small; it described
  # a 32-turn ceiling that no longer exists.
  max_tool_turns: 200
  native_tool_calling: true
  fallback_to_json_mode: true
  thinking:
    enable: true
