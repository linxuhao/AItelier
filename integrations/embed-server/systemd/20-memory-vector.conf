# aitelier-dsh-host.service.d/20-memory-vector.conf — turns on the steward's local
# vector search (design §3.8.2). Needs the aitelier-embed container running
# (integrations/embed-server/run.sh). Takes effect at the next DSH host restart.
[Service]
Environment=AITELIER_DSH_MEMORY_VECTOR_URL=http://127.0.0.1:18751
Environment=AITELIER_DSH_MEMORY_VECTOR_MODEL=bge-m3-q8_0
