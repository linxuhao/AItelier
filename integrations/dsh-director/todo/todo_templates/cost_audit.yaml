name: cost_audit
version: 1
description: >-
  Read-only cost audit of the project's checks and process: measure, then propose. Give this
  description to the child as the plan's goal: the child sees only the goal, the item title and
  the predicates. The child changes nothing but the one JSON report it writes during the step,
  and commits it (the delivery item that follows wants a commit past the base); it should not
  be the one who added the gates it audits. Run each measuring command once with
  timing (the commands are data, any language or runner; with none given, find the project's
  own checks, and a project with no tests times its build or export, if any, and reads from git
  history how often reviews or gates were repeated). Look for nested test runners that re-run
  work, expensive shared setup rebuilt per test, the same suite run twice in one check, tests
  that wait on real time or loop to a production-size limit, gates or abstractions with one
  user, and full review ceremony for changes only to tests, comments or unpublished docs. Judge
  "too slow" against the limits param. Report keys: measured_commands [{command, seconds,
  exit}], baseline {total_seconds, previous_total_seconds or null}, costliest [{item, seconds}]
  (the ten slowest tests, steps or gates), findings [{category:
  over_engineering|over_gating|over_testing|performance|ceremony, where, cost_seconds,
  evidence, proposed_change, still_guarded_by, risk: low|medium|high}] and recommendations. A
  finding that removes a test or gate names in still_guarded_by what keeps guarding its risk (a
  mutation another test still catches, a remaining test) or says it needs the owner's decision.
  The report is a proposal: nothing waits on it, and the owner decides what changes.
params:
  report_path:
    type: str
    default: cost-audit.json
    description: Workspace-relative path of the JSON report (keep it inside scope).
  measure_commands:
    type: list[str]
    description: >-
      The commands that run the project's checks, one whole command line each, for example
      "npm test", "go test ./...", "cargo test" or "make check". Unset: the child finds them.
  limits:
    type: str
    default: a single test under 10 s, the full check under 10 min
    description: >-
      The time limits the audit judges against: the project's own (from its agent instructions
      file or the owner's goal) or the default.
  look_at:
    type: list[str]
    default: ["**"]
    description: Globs of what the audit looks at (default the whole checkout).
  previous_report:
    type: str
    description: The last cost audit's report, whose baseline this one is compared with.
  scope:
    type: list[str]
    default: [cost-audit.json]
    description: Globs the delivery may touch; must match report_path.
items:
  - id: audit
    title: >-
      Read-only cost audit of ${look_at}: change nothing but ${report_path}, and commit it. Time each command
      once: ${measure_commands} (empty: find the project's own checks; no tests: its build or
      export). Limits: ${limits}. Previous report: ${previous_report} (empty: this audit sets
      the baseline). Every finding that removes a test or gate names in still_guarded_by what
      still catches its risk, or says the owner decides.
    predicates:
      - predicate: files_changed
        args: {paths: [$report_path]}
      - predicate: report_json
        args:
          path: $report_path
          require_keys: [measured_commands, baseline, costliest, findings, recommendations]
