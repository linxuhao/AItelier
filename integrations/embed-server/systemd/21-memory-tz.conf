# aitelier-dsh-host.service.d/21-memory-tz.conf — the owner's time zone for the
# steward's memory: dated lines, day groups and date words (design §3.8.1).
# Takes effect at the next DSH host restart. Without it the steward uses the
# host's own time zone; set it when the owner lives in another one. Replace the
# example with the owner's IANA zone name (an invalid name stops the memory).
[Service]
Environment=AITELIER_DSH_MEMORY_TZ=America/New_York
