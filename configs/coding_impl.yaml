# configs/coding_impl.yaml
# OFFLOADED implementation of an approved plan — scheduler-driven so the whole
# edit/test loop runs in a SPAWNED agent's ephemeral context, never touching
# the butler's window (the context-offload half of the hybrid coding flow:
# butler plans in runner mode, then hands the approved plan here).
#
# Seeded with the approved plan.md; runs against the project's real repo
# (repo_type=existing + repo_path, wired by start_config_run). The implement
# step reuses DPE's task_implementer machinery (generic code write mode →
# strict apply_patch, repo_apply commits); run_tests then verifies.

name: "coding_impl"
description: "Offloaded implementation: a spawned agent implements an approved plan"

x-aitelier:
  label: "Coding Implementation"
  scheduler_owned: true          # poller-driven → spawned agent → context isolated
  seed_file: "plan.md"
  output_step: "test"
  input_hint: >-
    seed_text = the APPROVED plan.md content (goal, numbered steps, verification).
    Start with against_project=<the project whose repo to implement into>. A
    spawned agent implements the plan, commits, and runs the tests in its own
    context — poll to completion, then report the summary + test_report. Use
    this to OFFLOAD implementation of an approved plan out of your context.

begin: "baseline"

end_conditions:
  combinator: or
  conditions:
    # True-green completion uses the dedicated `done` node, reached exclusively
    # when the tests pass (test_outcome → done). `done` sits OUTSIDE the implement↔test
    # loop, so it is entered at most once.
    #
    # This node MUST NOT be `test`: `test` is inside the loop, so on a
    # loop-back the graph advances INTO `test` again while a stale `completed`
    # `test` row from the prior iteration still exists — `node_reached: test`
    # would then fire and complete the run as SUCCESS *before the retried test
    # even runs*, reporting green on unverified code (the exact failure we are
    # fixing). `done` is a gate (no completed step row), so `require_completed`
    # is omitted.
    # The never-passes loop is bounded by `max_loop: 3` on test_outcome → implement
    # below (enforced on tool-step edges since skillflow-py 1.5.2): once the edge
    # is exhausted the run fails with CycleLimitExceeded.
    - type: node_reached
      node: "done"
      result: "completed"
    - type: node_reached
      node: "done_candidate_tests_failed"
      result: "completed"
    - type: node_reached
      node: "test_evidence_missing"
      result: "failed"
    - type: node_reached
      node: "test_gate_report_unattributable"
      result: "failed"
    # A round whose gate coverage was PROVISIONAL (`run_tests` says so itself:
    # `purpose: provisional_round_feedback`, `full_test_passed: false`) is not
    # full test evidence, so a green pytest leg over it may not conclude the
    # run. Named here as a FAILED terminal rather than parked like an absence:
    # `gate_evidence` answers this shape `partial` / `unresolved` (a release
    # needs verification, not a repair) and no re-run of the gate turns a
    # provisional declaration into a full one — see `test_evidence_provisional`.
    - type: node_reached
      node: "test_evidence_provisional"
      result: "failed"
    # Terminal: a GREEN round whose Node projects were NOT all measured (a
    # partial node gate). Declared `failed` so the run ends here naming the
    # partial gate instead of reading as completed — the third shipped config to
    # do this (configs/fix_tests.yaml:38-40 and configs/subagent.yaml:53-55).
    - type: node_reached
      node: "node_gate_incomplete"
      result: "failed"

steps:
  - id: "baseline"
    step_type: "tool"
    tool_name: "run_tests"
    capability: "stateful"
    timeout_seconds: 4200
    context:
      - source: { config: "coding_impl", output: "plan.md", required: true }
    tool_params:
      out_dir: "$STEP_DIR"
      prechange_capture: true
      # Full-suite measurement reported 2711.62s at 2 CPU / 2 GiB.
      # Keep full discovery; this budget covers only the pytest leg.
      pytest_wall_seconds: 3600
    transitions:
      - to: "implement"

  - id: "implement"
    step_type: "agent"
    agent_config: "offload_implementer"
    timeout_seconds: 600
    context:
      - source: { from: "repository", mode: "tool" }        # repo read tools
      # `required` is the RUNTIME backstop, and it is second, not first: the
      # poller now refuses to create a run for this config until the seed is
      # published (core/seed_publication.py), so a healthy launch never reaches
      # this. It fires only if something creates a run with no plan anyway —
      # and what actually stops it is EARLIER than the claim this comment used
      # to name: since coding_impl gained its `baseline` tool step, that step
      # refuses a plan-less run with a named terminal error ("coding_impl
      # baseline requires published plan.md") before any claim exists. The
      # `required` flag below is now the backstop behind that backstop:
      # ContextResolver still raises RequiredContextMissing at the first claim
      # if a future config reorders the steps, which the scheduler turns into a
      # terminal run with a named reason.
      #
      # Without it the source resolved to EMPTY and the step claimed cleanly:
      # that is how a plan-less agent got 95 s and a `repo_apply` on
      # 2026-09-05.
      - source: { config: "coding_impl", output: "plan.md", required: true }  # the approved plan
      # On a test-failure loop-back this carries the previous run's
      # test_report.json (failures[] + summary) so the agent fixes the actual
      # breakage instead of re-guessing. Empty on the first pass (test hasn't
      # run yet), like DPE's goal-loop feedback inputs.
      - source: { step: "test" }
      - source: { tool: "dir_tree" }
    output:
      mode: write
      target: code
    transitions:
      - to: "implement_evidence"

  # ── ADDITIVE OBSERVATION, NOT A GATE ───────────────────────────────────────
  # Owner instruction: migrate `coding_impl` first, run it for days, fix what it
  # reveals, and only then migrate the rest. So this step changes NOTHING about
  # how the run is decided. It reads the implement step's own delivery receipt
  # (`implement/code_changes.json`: base_commit, delivered commit, recorded
  # files) and holds the ACTUAL worktree against it with the shared predicate
  # library (`core/todo_runtime.py`): one `file_changed` per declared file,
  # compared to the BASE COMMIT's content of that same path, plus one cheap
  # `command_exit` on the delivered commit object.
  #
  # Its one edge goes to `test`, so `implement -> test -> test_outcome` runs
  # exactly as before: no transition, no `max_loop`, no end condition and no
  # `output_step` changed. A red observation cannot fail a passing run (there is
  # no failure edge to take), and a green one cannot release a red gate
  # (`test_outcome` still routes `all_passed: false` back to `implement`).
  #
  # Absence is recorded, not charged: no receipt / no git / a timeout becomes a
  # bounded DeferralLedger episode naming what it waits for
  # (`core/gate_deferral.py`), the same treatment an unmeasured gate gets one
  # step later. The verdict is promoted as `implement_evidence.json` into this
  # step's output dir, so it is readable with get_step_output.
  - id: "implement_evidence"
    step_type: "tool"
    tool_name: "implement_evidence"
    # Bounded: reading a receipt and a couple of blobs. A budget far below the
    # 4200 s gate steps on purpose — this step must never hold the run.
    timeout_seconds: 120
    tool_params:
      out_dir: "$STEP_DIR"
      # The implementer above; named here so another config can bind this tool
      # without editing it.
      declared_step: "implement"
    transitions:
      - to: "test"

  - id: "test"
    step_type: "tool"
    tool_name: "run_tests"
    # The known-red baseline is kept in the durable `state_dir` this capability
    # injects (~/.AItelier/pipeline_state/coding_impl/). WITHOUT this line the
    # tool is handed no state_dir, the baseline is never taken, and every
    # pre-existing red in the repo reads as this round's: run 024cfec6 burned
    # all three implement laps and died on `Cycle limit exceeded` over three
    # failures it did not introduce. The registration existed from the day the
    # capability shipped; no config had ever declared it.
    capability: "stateful"
    # Retain the overall step ceiling. The pytest leg declares its own wall;
    # Node and repository gates can also consume time within this step.
    #
    # 1200 was SHORTER THAN THE GATE IT TIMES for a Godot project, and this
    # raise is a margin, NOT a repair of an observed failure -- the difference
    # matters, so both halves are recorded.
    #
    # Measured 2026-09-13 on wuxia-commercial-batch-next: the project's own
    # run_tests.sh drives tools/godot_gate.py -> compile (~12 s) + the authored
    # 172-scenario play-test (~1995 s exclusive), i.e. the budget was smaller
    # than its own subject. PREDICTED consequence: a claim abandoned mid-render
    # while the sidecar still holds its render lock, so the report never lands
    # and the retry queues behind a run nobody awaits -- the shape godot_gate.py
    # documents at its own 1800->3600 correction.
    # OBSERVED, same day, run 6f75202d: the step ran ~2050 s past the 1200 s
    # budget and COMPLETED. No reclaim happened. So the budget is not enforced
    # as a hard mid-flight reclaim on this path, and the pathology above stayed
    # theoretical. Keep the larger ceiling (a budget below its subject is still
    # wrong on its face) but do not cite it as a fixed defect.
    # This ceiling does not guarantee a mixed Python/Node/Godot gate finishes.
    # An incomplete measurement remains non-passing.
    timeout_seconds: 4200
    tool_params:
      out_dir: "$STEP_DIR"
      prechange_from: "baseline"
      pytest_wall_seconds: 3600
    # A failed tool invocation must not consume a report from a prior attempt.
    #
    # THE ABSENCE EDGE LIVES ON THIS STEP, which OWNS `test_report.json`.
    # Round 5 put the same two lines on `test_evidence` and they never fired
    # once: the engine resolves a `from_file` match relative to THAT STEP's own
    # output dir, and `test_evidence` is a json_schema validator that writes no
    # file — every evaluation raised `FileNotFoundError: Output file not found:
    # test_report.json`, the engine recorded `transition file_reader failed`,
    # and the edge counted as unmatched. Measured on pole A: with the edge here
    # the run reaches `current_node: test_gate_absent` after ONE implement
    # cycle; on `test_evidence` the same pole spent four and died on
    # `Cycle limit exceeded`.
    #
    # THE ABSENCE EDGE IS ON THIS STEP, and it is a FLAG match, not a file read.
    # Two measurements decide that, both made on this tree:
    #
    #   1. `from_file` is resolved by the engine against the EVALUATING step's
    #      own output dir. Round 5 put the edge on `test_evidence` — a
    #      json_schema validator that writes no file — so every evaluation
    #      raised `FileNotFoundError: Output file not found: test_report.json`,
    #      the engine logged `transition file_reader failed`, and the edge
    #      counted as unmatched. That is the ONE root cause behind three
    #      separate round-5 verdicts: poles B and C spent 4 implement cycles
    #      and died on `Cycle limit exceeded` for a gate that never spoke.
    #   2. Moving the same `from_file` match HERE is NOT enough on its own. The
    #      engine's `_flags_match` does `data.get(field)` on whatever the file
    #      parses to, so a `test_report.json` parsing to a LIST raises
    #      `AttributeError: 'list' object has no attribute 'get'` and takes the
    #      resolver down instead of routing (measured:
    #      tests/skillflow/test_coding_impl_gate.py[report5]).
    #
    # So the flag travels on the TOOL'S OWN RETURN (`repo_gate_absent` is in
    # run_tests' dict, which the engine merges into this step's flags), needing
    # no file reader at all: no dependence on which step owns the artifact, and
    # no crash on a malformed one. That is the "change the report shape" branch
    # of the choice — the FILE still carries `repo_gate_absent` for
    # core/gate_deferral.py, the RETURN carries it for routing.
    #
    # Order: the `_error` edge first (a failed invocation may not consume a
    # prior attempt's report), then this one, then the written-evidence edge.
    transitions:
      - to: "test_evidence_missing"
        match: { _error: true }
      # A gate that produced NO VERDICT is not a red the implementer can fix.
      # Routing it down the `all_passed: false` edge spends one of the three
      # implement laps on a gate that never spoke, and once the lap budget runs
      # out the run dies on `Cycle limit exceeded` — which reads as "your code
      # failed". The absence instead parks the run at a loop-EXTERNAL gate
      # (`test_gate_absent`), so the run stays non-terminal and no implement
      # cycle is charged for it. The scheduler bounds how long that may last
      # and, past the ceiling, ends the run NAMING the absence
      # (core/gate_deferral.py).
      # Reds under the gate's ticket, and no report there is provably the
      # gate's (`run_tests` sets `repo_gate_unattributable`): the run ends on
      # its own terminal instead of charging the implementer or waiting.
      - to: "test_gate_report_unattributable"
        match: { field: "repo_gate_unattributable", value: true }
      - to: "test_gate_absent"
        match: { field: "repo_gate_absent", value: true }
      - to: "failed_candidate_evidence"
        match: { field: "retained_red_candidate", value: true }
      # A PROVISIONAL ROUND CANNOT CONCLUDE SUCCESS, whatever pytest said.
      #
      # `run_tests` stamps `purpose: provisional_round_feedback` and
      # `full_test_passed: false` on ITS OWN report whenever the repository
      # gate's coverage was provisional, and returns the same verdict
      # (`aitelier/tools/run_tests/impl.py`). Nothing in this graph read either
      # fact: the `test_evidence` schema below requires only
      # `passed`/`summary`/`failures`, so a provisional round whose PYTEST leg
      # was green passed every validator here and went `test_outcome` -> `done`
      # — the run concluded success on evidence its own report says is not full
      # test evidence (`gate_evidence.report_state` answers that shape
      # `partial`, `release_disposition` `unresolved`). The acquisition refuses
      # a provisional coverage as `unmeasured` today, so what this edge closes
      # is the CONFIG's half of it: the graph no longer depends on that upstream
      # refusal, and a report carrying the marker can never conclude the run.
      #
      # The match is on the producer's own RETURN (`full_test_passed`), not on
      # `test_report.json`: `from_file` is resolved against the EVALUATING
      # step's own output dir and the engine's `_flags_match` raises on a
      # report that parses to anything but an object — the same two reasons the
      # absence edge above is a flag match.
      #
      # BOTH terms are load-bearing, and the BARE-KEY form is deliberate:
      #   * `full_test_passed: false` is the producer's own statement that this
      #     round is not full evidence. A complete round returns it as None and
      #     carries no such key at all, and a non-delivery return (`written:
      #     None`) does not carry it either — so neither can match here.
      #   * `passed: true` keeps a MEASURED RED on its repair route. A
      #     provisional red carries `full_test_passed: false` as well, and
      #     `gate_evidence` answers it `failed` / `known_failure`: it is the
      #     implementer's to fix, so it must reach `test_outcome` and loop back
      #     to `implement`, never this terminal. Written as
      #     `{field: ..., value: ...}` this match would silently drop the
      #     `passed` term: `_flags_match` returns on `field`/`value` alone and
      #     never reads the rest of the dict.
      #
      # WHO ELSE READS THE FACTS THIS EDGE DECIDES ON (grep, 2026-11-06; every
      # `file:line` below re-checked at the commit that added the edge). The
      # inventory is HERE, in the artifact, not in a delivery message: it is
      # what tells the next person changing this edge which other readers move
      # with it. Re-grep before trusting a line number.
      #
      # `purpose` == `provisional_round_feedback` — the marker on the report:
      #   written by   run_tests/impl.py:3383 (stamped on the report; the return
      #                carries it at :3622), round_feedback.py:204,
      #                godot_playtest/impl.py:795; relayed by
      #                run_tests/impl.py:1725 from a gate manifest onto the
      #                retained coverage (:1723 reads the manifest's).
      #   read by      gate_coverage.py:39 `provisional_producer` (reads it at
      #                :49) and :123 `publication_scope_refusal` (:125);
      #                gate_evidence.py:320 `report_state` (:329), :359
      #                `release_disposition` (:459), :260
      #                `_provisional_red_is_measured` (:309), :614 `_audit_one`
      #                (:643);
      #                run_tests/impl.py:1727 (`_retained_coverage` refuses a
      #                provisional scope, so a provisional GATE is an ABSENCE
      #                there), :3377 (the stamping branch), :3475 and :3505
      #                (baseline pruning keeps every old gate red);
      #                round_feedback.py:220 (`run_feedback` refuses a scope
      #                whose purpose is not its own);
      #                godot_playtest/impl.py:770/:773/:775 (the `purpose` TOOL
      #                PARAMETER — it selects the feedback round);
      #                core/coding_impl_outcome.py:152 (a provisional round is
      #                not a passing pre-change measurement).
      #   gains/loses  `report_state` answers this marker `partial` and
      #                `release_disposition` `unresolved` because of it, and
      #                run_tests refuses the scope as full test evidence — so
      #                the marker stays on the report even though this edge
      #                reads the RETURN, not the file.
      #
      # `full_test_passed`:
      #   written by   run_tests/impl.py:3385 (report) and :3628 (return),
      #                round_feedback.py:204, godot_playtest/impl.py:795.
      #   read by      THIS edge, plus tests and prose only —
      #                docs/scoped-gate-coverage.md:93 and
      #                godot_playtest/tool.yaml:48. Nothing under core/, api/,
      #                web_api/ or cli/ reads it, so this edge is its only
      #                routing consumer.
      #
      # `gate_coverage`:
      #   written by   run_tests/impl.py:1465 (beside `gate_coverage_error` at
      #                :1467) and :3629, round_feedback.py:212,
      #                godot_playtest/impl.py:798; relayed from a gate manifest
      #                by run_tests/impl.py:1725.
      #   read by      run_tests/impl.py:1722 (the retained manifest), :3375
      #                (folding the gate's coverage into the report) and :3468 /
      #                :3501 (the baseline decisions) — every one of them also
      #                compares its `purpose` (:1727, :3377, :3475, :3505);
      #                gate_evidence.py:467-:468 `release_disposition` and
      #                :655-:657 `_audit_one`, both through
      #                `publication_scope_refusal`.
      #   (`scoped_gate.py` imports the two validators but writes no
      #   `gate_coverage` payload — checked with grep, not assumed.)
      #
      # PINNED BY `tests/unit/test_provisional_round_cannot_conclude_success.py`:
      # one parametrised test walks all four shapes the producer writes through
      # this edge, `gate_evidence` and the real graph, and asserts that the three
      # readings come off the SAME report. Change this edge and that table is
      # where the answer moves first.
      - to: "test_evidence_provisional"
        match: { full_test_passed: false, passed: true }
      # ── A PARTIAL NODE GATE MAY NOT CONCLUDE SUCCESS ──────────────────────
      # A pytest-GREEN round whose Node projects were not all measured carries
      # `node.unmeasured` / `node.skipped` in its report and
      # `node_gate_complete: false` on `run_tests`' RETURN — the producer writes
      # that boolean on every path out of the node block
      # (aitelier/tools/run_tests/impl.py:3337-3338:
      # `not (node.get("skipped") or node.get("unmeasured"))`). `passed` is
      # honestly true there: the projects that RAN passed. Without this edge a
      # return carrying `{passed: true, node_gate_complete: false}` reached
      # `test_evidence` -> `test_outcome` -> `done` — measured on the shape whose
      # report has `node.unmeasured` beside `node.skipped: false` — i.e. the run
      # concluded SUCCESS while its own report said the node gate was partial.
      # (With TODAY's producer that report also carries `node.skipped: true` and
      # is refused one step later, which is why the next paragraph reports the
      # measurement instead of claiming the short path was always open.)
      # The other two shipped configs already refuse it
      # (configs/fix_tests.yaml:112-113/:129, configs/subagent.yaml:124-125/:139);
      # this is the third, and it reuses their terminal's name.
      #
      # BOTH TERMS, AND WHY THIS IS NOT THE ONE-TERM EDGE THE OTHER TWO USE.
      # In fix_tests/subagent the measured-red edge comes FIRST (it reads the
      # report's `passed: false`), so their partial edge cannot capture a red.
      # HERE the red path is the `{passed: false, written: ...}` edge below:
      # red is a DELIVERED report that the evidence validators then decide
      # (`test_evidence` owns the measured-red acceptance; `test_outcome`'s
      # `passed: const true` is what stops it reaching `done` one step later).
      # An edge matching `node_gate_complete: false` alone would therefore sit in
      # FRONT of the repair path and send a measured red beside an unmeasured
      # project to a terminal — charging an absence for a red the implementer can
      # fix. `passed: true` is the term that keeps this refusal to the case it
      # names (green AND not fully measured), and it is what lets
      # `test_outcome -> implement` keep working for a measured red.
      #
      # MEASURED ON THIS BASE (2026-11-06), because it changes what this edge is
      # worth: with the REAL producer report, a partial green did NOT in fact
      # reach `done` — `test_evidence`'s inline schema requires
      # `node.skipped: {const: false}`, and `_aggregate_node_projects` sets
      # `skipped = bool(unmeasured)` (impl.py:1146), so a real partial
      # report was refused one step later as EVIDENCE MISSING. Two consequences,
      # both deliberate: (1) this edge makes the refusal explicit at the step
      # that owns the verdict, naming the partial gate, instead of relying on a
      # cross-field invariant inside ANOTHER step's shape check; (2) the guard
      # also covers the shape a hand-built or older producer writes
      # (`node.unmeasured` beside `skipped: false`), which does reach `done`
      # through `test_outcome`. What it does NOT do is rescue a partial RED:
      # that report is still refused by the same `node.skipped` const, and
      # widening `test_evidence` for a measured red is the pending
      # measured-red attempt's change (it keys on `returncode: 1`), not this
      # card's — see the test module's control (b2). Adding a second branch here
      # would collide with that attempt and is why this edge is a REFUSAL only.
      #
      # BOTH TERMS ARE FLAGS, NEVER `from_file`. The verdict travels on
      # `run_tests`' RETURN (`_node_gate_verdict`, impl.py:2934-2971), which the
      # engine merges into this step's flags. `from_file` is resolved against the
      # EVALUATING step's own output dir (skillflow core `_make_file_reader`:
      # `<config>/<step>/`), which is why the round-5 attempt on `test_evidence`
      # never matched, and a report parsing to a list raises AttributeError
      # inside `_flags_match` (see the comment above the `written` edge).
      #
      # CONSUMER INVENTORY — every reader of `node_gate_complete`,
      # `node["unmeasured"]` and `node["skipped"]`, grep'd in this tree:
      #   A `file:NNN` number is the position in the commit that wrote this
      #   inventory; the clause or symbol beside it is what the citation claims,
      #   so search for THAT — this file is edited by parallel branches and a
      #   merge moves every number below it.
      #   * impl.py `run_tests`, its Node block — the report's copy,
      #     `report["node_gate_complete"] = not (node.get("skipped") or
      #     node.get("unmeasured"))`, computed from `node["skipped"]` /
      #     `node["unmeasured"]`. GAINS: its `false` can no longer be carried into
      #     a success; nothing about what it writes moves.
      #   * impl.py:2934-2971 `_node_gate_verdict` — the RETURN's copy, and `True`
      #     when the report carries no key at all (a Python-only repository).
      #     GAINS its first routing reader in this config. That absent-key answer
      #     stays `True`, so a repository with no node section does not match the
      #     `false` edge above — and it IS what the narrowed `written` edge below
      #     requires: the return answers `true` for a repository with no node
      #     section, so its green round still reaches `test_evidence` (measured,
      #     control (c) in tests/unit/test_coding_impl_node_gate_partial.py). A
      #     return that simply OMITTED the key would now route nowhere. LOSES
      #     nothing else.
      #   * impl.py:3086 (upstream-blocked fail-fast return) and :3666 (main
      #     return) — the two paths that put the verdict on the flags. Unchanged;
      #     :3086's `passed: False` keeps that path off this edge.
      #   * impl.py:2868 `_report_write_failure` — deliberately OMITS the key
      #     (the docstring paragraph at :2877-2882 says so; the payload it returns
      #     is the dict at :2916-2930), so a non-delivery return cannot match this
      #     edge and still ends on `test_evidence_missing` (`written: None`).
      #   * impl.py:3371 — writes the flattened `node_unmeasured` read by the
      #     state vocabulary below. Unchanged.
      #   * impl.py:3346 — `unmeasured_projects = node.get("unmeasured") or []`:
      #     the list that makes `executed.node_gate_ran` false (:3348) and, outside
      #     the nothing-measured branch, becomes `node_unmeasured` (:3371). Unchanged.
      #   * impl.py:3350 — `if node.get("skipped") and not node.get("measured_dirs")`:
      #     the nothing-measured branch, which sets the whole-report `skipped`,
      #     `infrastructure_unavailable` and `evidence_state`. Unchanged.
      #   * impl.py:3347 — the same two node keys decide
      #     `executed.node_gate_ran`. Unchanged.
      #   * configs/fix_tests.yaml:113 / :129 and configs/subagent.yaml:125 /
      #     :139 — the same refusal and a POSITIVE success edge. Unchanged.
      #   * configs/coding_impl.yaml `test_evidence` inline_schema
      #     (:422-425) `node: {skipped: {const: false}}` — a config-side reader of
      #     `node["skipped"]`: a report whose node gate was skipped is refused as
      #     evidence. LOSES a case it used to be the only defence for (the
      #     partial green now stops here first); GAINS nothing. Left as it is on
      #     purpose: the whole-report `skipped` refusal next to it is a different
      #     field, and widening THIS clause for a measured red is the pending
      #     measured-red attempt's business.
      #   * configs/gen_coop_shell_ui60_20260907.yaml:124-127 — the SAME
      #     `node: {skipped: {const: false}}` clause, in a shipped GENERATED
      #     config (its own header still says coding_impl). A second config-side
      #     reader of `node.skipped`, named here because an inventory that listed
      #     only the hand-written graphs missed it. Unchanged and UNAFFECTED:
      #     that graph has no `node_gate_complete` edge at all, so its
      #     partial-green route is `test_evidence` -> `test_evidence_missing`
      #     both before and after this diff. GAINS/LOSES nothing.
      #   * aitelier/gate_evidence.py:323 `report_state` — reads the FLATTENED
      #     `node_unmeasured` and answers `partial` when a GREEN report carries
      #     one. It does not READ `node_gate_complete`: that name occurs once in
      #     the module, as prose in its own docstring (:488) describing this very
      #     refusal. GAINS, for the REAL producer's partial green: the graph now
      #     refuses it at the step that owns the verdict and names the partial
      #     gate (`node_gate_incomplete`), where before this edge it was parked
      #     one step later as evidence-missing (the `node.skipped` const; see D1
      #     in the test module). The shape that DID reach `done` before
      #     (hand-built or older producer: `node.unmeasured` beside
      #     `node.skipped: false`) is closed too. The real producer's report
      #     never reached `done`. LOSES nothing.
      #   * core/coding_impl_outcome.py:147-153 `measurement` — a reader of the
      #     NODE leg's `skipped` (and `passed`) that no literal `node["skipped"]`
      #     grep finds: it loops `for key in ("node", "repo_gate")`, takes
      #     `leg = report.get(key)`, and raises
      #     `ValueError("unsupported nonpassing leg")` when `leg.get("skipped")`
      #     is truthy or `leg.get("passed")` is not True. It measures a candidate's
      #     pre-change report (`finish_measurement` -> `measurement`, called from
      #     run_tests' prechange path at impl.py:3571, and `coding_impl`'s own
      #     `baseline` step sets `prechange_capture: true`), so a report whose node
      #     leg was skipped or nonpassing cannot become that baseline — the
      #     capture degrades to `prechange_unavailable`. GAINS/LOSES nothing: this
      #     edge changes which terminal a partial-green run reaches, not one byte
      #     of the report this reader parses.
      #   * core/gate_deferral.py:428 — reads `repo_gate_unmeasured`, a DIFFERENT
      #     key (the repository gate, not the node gate). Untouched.
      #   * NOT node readers, named so the next `skipped` sweep need not
      #     re-derive them: core/coding_impl_outcome.py:142-145 and :240-243 and
      #     core/release_gate_migration.py:373 read the WHOLE-REPORT `skipped` off
      #     test_report.json; core/tool_routes.py:152-159 counts skipped TEST
      #     CASES in a session; core/state_driver_guide.py:193 is prose about a
      #     `test` node's deliverable, and docs/repo-gate-unmeasured-protocol.md:48
      #     names `node.skipped` in prose.
      #   * and the configs that DO run run_tests while reading none of these
      #     three fields: configs/coding_impl.yaml:67-81 `baseline` (the prechange
      #     capture this diff does not touch), configs/dpe_default.yaml:906
      #     `5_test` (one unconditional edge; its verdict is folded later) and
      #     configs/addons/game_harness.yaml:475 `5_final_test` (routes on
      #     `release_evidence`). No `node_gate_complete` term is added to any of
      #     them here.
      # tests/unit/test_coding_impl_node_gate_partial.py drives this decision on
      # the real producer's return and pins the order below.
      - to: "node_gate_incomplete"
        match: { node_gate_complete: false, passed: true }
      # ── DELIVERY IS NOT A VERDICT: THE SUCCESS PATH REQUIRES THE COMPLETENESS
      #    STATEMENT POSITIVELY ────────────────────────────────────────────────
      # `written` alone fired for ANY return that named the report — including
      # one that carried no `node_gate_complete` at all (a stale producer, a run
      # spanning a deploy, a hand-made report). Everything after this edge
      # (`test_evidence` -> `test_outcome` -> `done`) concludes success on
      # `passed: true` alone, so the ABSENT verdict still concluded DONE.
      #
      # `node_gate_complete: true` is a bare-key FLAG term, not a `field`/`value`
      # pair, and the engine's direct form answers `key not in flags -> False`
      # (`_flags_match`): absent, null and `false` all fail it. A GREEN return
      # that does not state the verdict therefore falls through to the
      # unconditional `test_evidence_missing` (below), an end condition with
      # `result: failed` — the run ends naming the absence instead of reporting
      # success. Nor can this narrow the loop's bound: success is
      # `test_outcome`'s `passed: {const: true}`, and once the three repair laps
      # are spent that edge is skipped, so a never-passing suite still fails on
      # `No matching transition` rather than completing.
      #
      # WHY THE RED PATH IS A SEPARATE EDGE, and why it is not `written` alone.
      # One AND-matched edge cannot say "green requires the verdict" AND "red
      # keeps its route", because `_flags_match` has no disjunction. Routing a
      # red on `passed: false` is what preserves the MEASURED-red repair loop:
      # a pytest red beside a Node leg the producer could not provision carries
      # `node_gate_complete: false` (the node gate really was incomplete) and is
      # ACCEPTED by `test_evidence`'s second `anyOf` branch, which owns that
      # acceptance and its `storage_diagnosis` vetoes. MEASURED: with the
      # positive verdict as the ONLY `written` condition, that red stopped at
      # the absence terminal at this step instead, and
      # tests/unit/test_measured_red_repair_loop.py went red in three places
      # (`_route` expected `['test', 'test_evidence', 'test_outcome',
      # 'implement']`, observed `['test', 'test_evidence_missing']`). The red
      # edge is still keyed on the report being DELIVERED (`written`), so a
      # non-delivery red (`written: None`) does not reach the validators.
      #
      # WHY THE TWO OTHER CANDIDATE SITES CANNOT CARRY IT — both MEASURED on
      # this tree (2026-11-06), not preferences:
      #   1. THE INLINE SCHEMAS of `test_evidence` / `test_outcome` validate the
      #      FILE `$CONFIG_DIR/test/test_report.json`, and the producer writes
      #      `report["node_gate_complete"]` INSIDE `if node is not None:`
      #      (aitelier/tools/run_tests/impl.py:3327-3338), whose own comment says
      #      it is "Absent when there is no node section at all (a Python-only
      #      repository)". `_run_node_checks` returns None before running
      #      anything for such a repository (impl.py:1016-1018). Measured: the
      #      real producer's report for a repo with no package.json has no `node`
      #      key and no `node_gate_complete`
      #      (tests/unit/test_partial_gate_cannot_reach_done.py::
      #      test_python_only_repository_has_no_node_gate_complete). Requiring it
      #      in either schema would refuse every Python-only GREEN round.
      #   2. A TRANSITION SEES ONLY THE EVALUATING STEP'S OWN FLAGS. The engine
      #      resolves a tool step's edges with `step_flags = tool_result` — that
      #      step's return — and `test_evidence`/`test_outcome` are `json_schema`
      #      steps whose return is `{all_passed, _error}` (skillflow core
      #      `_complete_tool_step` -> `resolve_transition`). They never receive
      #      `test`'s RETURN, so a positive `node_gate_complete` match there can
      #      never fire: every green round would be sent to `implement` and burn
      #      the three laps. A `from_file` match there is worse still — it is
      #      resolved against the EVALUATING step's own output dir, and a
      #      validator writes no file (the round-5 measurement above).
      #
      # A NON-DELIVERY RETURN (`written: None`, `passed: false`, no verdict)
      # matches none of the decision edges and still ends on
      # `test_evidence_missing`, unchanged. Its step-FAILURE path is pinned by
      # tests/skillflow/test_coding_impl_gate.py::
      # test_failed_tool_return_cannot_consume_existing_passing_artifact; its
      # ROUTE by test_the_non_delivery_return_still_lands_on_test_evidence_missing
      # in tests/unit/test_coding_impl_node_gate_partial.py.
      # A DELIVERED RED: the evidence validators decide it (they own the
      # measured-red acceptance, and a partial red is still refused there).
      - to: "test_evidence"
        match: { passed: false, written: "test_report.json" }
      # A DELIVERED GREEN ROUND MUST STATE THE COMPLETENESS VERDICT.
      - to: "test_evidence"
        match: { node_gate_complete: true, written: "test_report.json" }
      - to: "test_evidence_missing"


  - id: "test_evidence"
    step_type: "tool"
    tool_name: "json_schema"
    tool_params:
      workspace_root: "$CONFIG_DIR/test"
      files: ["test_report.json"]
      # Validate the actual artifact before routing. Missing runners and zero
      # collected tests are not code defects for the implementer to repair.
      # jsonschema is a direct runtime dependency: the native tool fallback
      # cannot enforce these constraints when that package is absent.
      #
      # THIS GATE REFUSED A MEASURED RED, AND THAT IS THE DEFECT IT NOW FIXES.
      # `run_tests` marks the WHOLE report `skipped: true` +
      # `infrastructure_unavailable: true` whenever its Node leg could not be
      # measured (`aitelier/tools/run_tests/impl.py`, the node block: "NOTHING
      # was measured anywhere: the single-project absence"), while keeping the
      # pytest leg's own outcome beside it — `returncode: 1`, the `FAILED ...`
      # lines and the failure count. The old `skipped: { const: false }` +
      # `node.skipped: { const: false }` read that report as an ABSENCE, so a
      # genuine pytest red beside an unavailable Node leg died on
      # `test_evidence_missing` instead of reaching this pipeline's own repair
      # loop (`test_outcome -> implement`, max_loop 3).
      #
      # THE ABSENCE IS STILL AN ABSENCE. A leg that was not measured may not
      # charge the implementer: `measurement_not_taken` and `storage_unmeasured`
      # are the producer's own statements that its pytest session is not a
      # measurement at all (killed at its wall, no isolated executor, storage
      # exhausted mid-run), and they veto the second branch below even when the
      # raw returncode is 1. `no_tests_collected` stays refused at the top: a
      # suite that collected nothing has verified nothing.
      #
      # WHY THE SECOND BRANCH READS `returncode`: it is the one POSITIVE WITNESS
      # `run_tests` writes about ITS OWN pytest leg and never rewrites — 0 = the
      # session ran to the end and passed, 1 = it ran to the end and failed,
      # 5/None/-1 = nothing was collected / the harness killed it / no executor.
      # Only 1 is a red this report MEASURED. That is a fact the producer states,
      # not a predicate this file re-derives: no provisional-marker, baseline or
      # `passed_relative` reasoning is copied here (compare
      # `aitelier/gate_evidence.py:_provisional_red_is_measured`, which answers
      # the release question, not this one). `type: integer` is explicit because
      # JSON `true` compares equal to 1 in Python; a boolean is not a returncode.
      #
      # THE PRODUCER'S REPORT SHAPE WAS NOT CHANGED, deliberately. `skipped`,
      # `infrastructure_unavailable` and `node.skipped` are the whole-report
      # absence vocabulary that OTHER consumers read (the consumer map is the
      # module docstring of `tests/unit/test_measured_red_repair_loop.py`, and it
      # cites each reader by SYMBOL rather than by line number, because a merge
      # moves every number in this file): `gate_evidence` (`report_state`,
      # `release_disposition`, `audit_evidence`), `core/coding_impl_outcome`
      # (`measurement()` and `load_coding_outcome` refuse such a report), this
      # file's own `failed_candidate_evidence` step — reached by the `test`
      # step's `retained_red_candidate` transition and validating
      # `skipped: {const: false}` — and
      # `configs/gen_coop_shell_ui60_20260907.yaml`; and the three EXECUTABLE
      # `node.skipped` consumers inside `run_tests` ITSELF — the function, in the
      # Node block that follows `_run_node_checks`, NOT `_aggregate_node_projects`,
      # which only BUILDS the node dict (`"skipped": bool(unmeasured)`,
      # `"passed": all(r["passed"] for r in measured)`, `"unmeasured": ...`) and
      # writes no `node_gate_complete` key at all:
      #   - `report["node_gate_complete"] = not (node.get("skipped") or
      #     node.get("unmeasured"))` — the completeness flag, the key this step
      #     routes on;
      #   - `executed.node_gate_ran = (not node.get("skipped") and not
      #     unmeasured_projects)` — execution bookkeeping (the line above it,
      #     `unmeasured_projects = node.get("unmeasured") or []`, only reads that
      #     list);
      #   - `if node.get("skipped") and not node.get("measured_dirs")` — the
      #     nothing-measured branch, which sets `skipped` /
      #     `infrastructure_unavailable` / `evidence_state` on the report;
      # `run_tests._node_gate_verdict`, a DIFFERENT reader: it reads
      # `node_gate_complete`, not `node.skipped`; the `release_evidence`
      # consumers in `core/release_gate_migration.py` and
      # `configs/addons/game_harness.yaml`, and `run_tests._apply_baseline`
      # (reads `storage_unmeasured`). Dropping the flag there would silently
      # redefine an absence for every one of them to fix one route; widening this
      # gate touches exactly one consumer, and leaves every other reader of an
      # absence with the input it already has.
      #
      # PROTECTED BOUNDARIES — all four checked, none weakened by this widening:
      #   (a) ACCEPTANCE CRITERIA: only the ROUTE an absence-beside-a-measured-red
      #       takes changes. No report that was not an acceptance becomes one:
      #       `test_outcome`'s `passed: {const: true}` still gates `done`, the
      #       first `anyOf` branch is the shipped predicate verbatim, and no end
      #       condition or `max_loop` in this file changed.
      #   (b) THE EVIDENCE FORMAT: no producer byte moved. `run_tests` writes the
      #       same keys with the same values; the schema admits a second SHAPE,
      #       and adds no field, so every consumer's input above is unchanged.
      #   (c) THE NON-AUTHOR REVIEW CONTROL: neither this file nor the test module
      #       removes or relaxes a review or verification step; the change is a
      #       comment-only map plus a test fixture that now deep-copies (it can
      #       only catch more), and no assertion was loosened. Acceptance still
      #       comes from a non-author review of the delivered commit.
      #   (d) THE PRIVACY / PUBLICATION BOUNDARY: nothing is published by this
      #       change and the publication gate is untouched — the
      #       `publication_scope_refusal` branch of `release_disposition`, the
      #       `provisional_round_feedback` handling and
      #       `configs/addons/game_harness.yaml`'s release edges are as they were.
      inline_schema:
        type: object
        required: [passed, summary, failures]
        properties:
          passed: { type: boolean }
          summary: { type: string, minLength: 1 }
          failures: { type: array, items: { type: string } }
          no_tests_collected: { const: false }
        anyOf:
          # A report with no unmeasured leg at all: unchanged, the shipped shape.
          - properties:
              skipped: { const: false }
              node:
                type: object
                properties:
                  skipped: { const: false }
          # The EXCEPTIONAL shape, and nothing broader: a MEASURED pytest red
          # beside a Node leg the producer could not measure. Every key in
          # `required` is one `run_tests` writes on that path
          # (aitelier/tools/run_tests/impl.py: the pytest verdict where
          # `report["returncode"] = done.returncode` is set, and the
          # single-project whole-report absence in the node block, where
          # `skipped`, `infrastructure_unavailable` and `evidence_state` are set
          # beside `node.skipped: true`). `required` is also what makes the
          # branch ASK for the witness at all: `properties` constrains only a
          # key that is PRESENT, so a `passed: false` report stating no verdict
          # would otherwise satisfy it (measured on
          # `tests/skillflow/test_coding_impl_gate.py`, which requires that report
          # to stay an absence).
          #
          # The `not` clause forbids the producer's own "this session measured
          # nothing" statements by their PRESENCE: `measurement_not_taken` is
          # written only as `true` and never as `false`, and `storage_unmeasured`
          # is written only when storage was proved exhausted, as `true`. A
          # `storage_diagnosis` that reports exhaustion is refused whatever its
          # flags say, and the node section must be present and must carry
          # `skipped: true`: an absence with no node section is not this shape.
          #
          # `type: string` AND `minLength: 1` ON `state` ARE NOT DECORATION: they
          # are what close the defect a non-author review measured on the first
          # version of this branch. `not: {enum: [...]}` alone is satisfied by a
          # value that says NOTHING — null, false, 0, "", [] and {} all
          # validated — so a report that never diagnosed storage was read as
          # "storage was measured and is fine", which is the very class of
          # defect this branch exists to refuse (an unmeasured thing must not be
          # read as a measured one). The type closes null / false / 0 / [] / {},
          # and `minLength: 1` closes the empty STRING, which a type constraint
          # alone still admits (measured on the controls in
          # `tests/unit/test_measured_red_repair_loop.py`: `state: ""` passed
          # with `type: string` alone). The producer writes `state` as one of
          # five non-empty strings (`diagnose_storage`: exhausted_preflight,
          # exhausted_during_run, ambiguous, clean, unknown).
          #
          # THE TOLERANCE THAT REMAINS, stated so no reader has to infer it: a
          # non-empty STRING state this config does not know — `ambiguous`,
          # `unknown`, or one a later producer adds — is still ACCEPTED. Only
          # the two exhausted states mean storage cost the measurement, so only
          # those are excluded; a state must not be refused merely because a
          # vocabulary nobody updated has not heard of it.
          #
          # `node.passed` is pinned to a boolean because the REAL producer
          # always writes one there: `_aggregate_node_projects` /
          # `_run_node_project` set it to `True` / `False` / `all(...)` on every
          # path out, and the report reaching this branch carries the
          # aggregate's boolean. A non-boolean is a hand-made section, not a
          # measurement (a review measured `node: {skipped: true, passed:
          # "banana"}` being accepted here).
          #
          # `passed` IS ALSO REQUIRED, and that is a measurement, not a guess: a
          # non-author review measured that DELETING `node.passed` from this
          # report still validated, because only `skipped` was required inside
          # `node` - i.e. a section that states no verdict was read as a verdict.
          # Every producer path that writes a node section writes the boolean:
          # `_aggregate_node_projects`'s dict literal (`"passed": all(r["passed"]
          # for r in measured)`, plus `passed=True` in the `node.update` on its
          # nothing-measured path) and `_run_node_project`'s initial
          # `{"passed": True, ...}`, which is overwritten with `all(...)` over its
          # checks (and with `False` when the `node_fetch` install fails). TWO
          # paths write NO node section, not one: the storage-preflight refusal
          # (`node = None if storage_preflight_refused else ...`) AND a repository
          # that declares no node project at all — `_run_node_checks` returns
          # `None` before running anything when `_find_node_projects` finds
          # neither a project nor an absence (`if not projects and not absent:
          # return None`), which is a Python-only repository. Both are absences;
          # neither carries a `node`, so neither can match this branch either way.
          # A control in `tests/unit/test_measured_red_repair_loop.py` deletes the
          # key from the real report and requires `test_evidence_missing`, and
          # another asserts the plain-green absence of a report with no node
          # section reaches `done`.
          - required: [passed, returncode, skipped, infrastructure_unavailable,
                       evidence_state, node, storage_diagnosis]
            properties:
              passed: { const: false }
              returncode: { type: integer, const: 1 }
              skipped: { const: true }
              infrastructure_unavailable: { const: true }
              evidence_state: { const: infrastructure_unavailable }
              node:
                type: object
                required: [skipped, passed]
                properties:
                  skipped: { const: true }
                  passed: { type: boolean }
              storage_diagnosis:
                type: object
                required: [state]
                properties:
                  # `type` closes null/false/0/[]/{}; `minLength` closes the
                  # empty string (a string that states nothing); the enum
                  # exclusion closes the two states that mean storage cost the
                  # measurement. Any other NON-EMPTY string is accepted on
                  # purpose — see the tolerance above.
                  state: { type: string, minLength: 1,
                           not: { enum: [exhausted_preflight, exhausted_during_run] } }
            not:
              anyOf:
                - required: [measurement_not_taken]
                - required: [storage_unmeasured]
    transitions:
      - to: "test_evidence_missing"
        match: { _error: true }
      - to: "test_outcome"
        match: { all_passed: true }
      - to: "test_evidence_missing"

  - id: "test_outcome"
    step_type: "tool"
    tool_name: "json_schema"
    tool_params:
      workspace_root: "$CONFIG_DIR/test"
      files: ["test_report.json"]
      inline_schema:
        type: object
        required: [passed]
        properties:
          passed: { const: true }
    transitions:
      - to: "test_evidence_missing"
        match: { _error: true }
      - to: "done"
        match: { all_passed: true }
      - to: "implement"
        match: { all_passed: false }
        # Initial test plus three repair attempts; never complete on exhaustion.
        max_loop: 3

  - id: "test_evidence_missing"
    step_type: "gate"
    transitions:
      - to: null

  # Terminal: the tests were green and `run_tests` said the round's repository
  # gate coverage was PROVISIONAL — its own report carries
  # `purpose: provisional_round_feedback` and `full_test_passed: false`, i.e.
  # it is not full test evidence, so the run may not conclude `done` on it.
  # `gate_evidence` answers this shape `partial` and `release_disposition`
  # `unresolved`, which is a release that needs VERIFICATION, not a repair:
  # there is nothing here for the implementer to fix, and a re-run of the gate
  # cannot turn a provisional declaration into a full one, so this is neither a
  # loop-back nor a park. It is a named terminal (see the end_conditions above),
  # so reaching it fails the run saying which shape it stopped at, instead of
  # reporting success on evidence the report itself disowns.
  - id: "test_evidence_provisional"
    step_type: "gate"
    transitions:
      - to: null

  # Terminal: the repository gate's ticket held reds and its own report
  # could not be identified among them (see `run_tests`,
  # `repo_gate.report_attribution`). The reds and where each was read are in
  # `test_report.json`.
  - id: "test_gate_report_unattributable"
    step_type: "gate"
    transitions:
      - to: null

  # Loop-EXTERNAL gate for a gate step that produced no verdict. Reached only
  # by a `test` report that says the repository gate did not run; it is NOT in
  # `end_conditions`, so reaching it neither completes nor fails the run — it
  # parks a still-running run while the scheduler accounts for the absence.
  # The scheduler holds the run here for one wait per silent report
  # (core/gate_deferral.py); when the wait runs out the run advances, and the
  # ONLY edge out re-runs `test` to re-acquire the verdict. `implement` is not
  # reachable from here. The wall-clock ceiling of one episode ends the run
  # naming the absence. This edge's max_loop counts traversals over the whole
  # run, so it can be spent first (a wait shorter than ceiling/100, or laps
  # from several episodes); the scheduler then ends the run with the same
  # absence sentence before the engine refuses the traversal
  # (core/gate_deferral.py:absence_laps_spent).
  - id: "test_gate_absent"
    step_type: "gate"
    transitions:
      - to: "test"
        max_loop: 100

  # Terminal no-op gate: reached only after the tests pass. Its sole purpose is
  # to be the loop-external node the end-condition fires on (see end_conditions).
  - id: "done"
    step_type: "gate"
    transitions:
      - to: null

  # Terminal: a GREEN round whose Node projects were NOT all measured. Reached
  # only from `test` (edge above, `{node_gate_complete: false, passed: true}`) and
  # declared `failed` in end_conditions, so the run ends here naming the partial
  # gate rather than reading as completed. Same id and same shape as
  # configs/fix_tests.yaml:154 and configs/subagent.yaml:190, so all three shipped
  # configs answer "a partial node gate" the same way. It has no outgoing edge:
  # `implement` is not reachable from here — a repository that did not measure
  # all of its own projects is a verdict no code edit can fix.
  - id: "node_gate_incomplete"
    step_type: "gate"
    transitions:
      - to: null

  # Execution stopped with a retained FAILED candidate; no test/release acceptance.
  - id: failed_candidate_evidence
    step_type: tool
    tool_name: json_schema
    tool_params:
      workspace_root: $CONFIG_DIR/test
      files:
      - test_report.json
      inline_schema:
        type: object
        required:
        - passed
        - summary
        - failures
        - coding_outcome
        properties:
          passed:
            const: false
          summary:
            type: string
            minLength: 1
          failures:
            type: array
            minItems: 1
            items:
              type: string
          skipped:
            const: false
          no_tests_collected:
            const: false
          coding_outcome:
            type: object
            required:
            - schema
            - disposition
            - tests_passed
            - release_passed
            - cause_attribution
            - reason
            - measured
            - comparable
            - baseline_artifact_sha256
            - run_id
            - project_id
            - config_name
            - config_digest
            - base_sha
            - base_tree
            - candidate_sha
            - candidate_tree
            - config_version
            - unresolved_failures
            - new_observed_failures
            properties:
              schema:
                const: coding-outcome/1
              disposition:
                const: candidate_tests_failed
              tests_passed:
                const: false
              release_passed:
                const: false
              cause_attribution:
                const: undetermined
              reason:
                const: repeated_prechange_observations
              measured:
                const: true
              comparable:
                const: true
              baseline_artifact_sha256:
                type: string
                minLength: 1
              run_id:
                type: string
                minLength: 1
              project_id:
                type: string
                minLength: 1
              config_name:
                type: string
                minLength: 1
              config_digest:
                type: string
                minLength: 1
              base_sha:
                type: string
                minLength: 1
              base_tree:
                type: string
                minLength: 1
              candidate_sha:
                type: string
                minLength: 1
              candidate_tree:
                type: string
                minLength: 1
              config_version:
                type: integer
                minimum: 1
              unresolved_failures:
                type: array
                minItems: 1
                items:
                  type: string
              new_observed_failures:
                type: array
                maxItems: 0
    transitions:
    - to: test_evidence_missing
      match:
        _error: true
    - to: done_candidate_tests_failed
      match:
        all_passed: true
    - to: test_evidence_missing
  - id: done_candidate_tests_failed
    step_type: gate
    transitions:
    - to: null
