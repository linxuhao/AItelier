# configs/dpe_default.yaml — v2 graph config
# All agents (research, architect, PM, tasks, final verify) are explicit nodes.
# Reviewers are separate nodes with loop-back transitions on fail.
# Tool nodes (repo_apply, repo_validate) handle code integration.

name: "dpe_default_v2"
description: "AItelier DPE: Research → Architect → PM → Task Loop → Verify"

# ── Addon anchors (skillflow.compose) ───────────────────────────────────────
# This base graph is ENGINE-AGNOSTIC — no game/Unity/Godot steps or prompts. It
# just publishes named extension points (anchors). Addons bind to THIS base by
# name (their `base:` field) and splice in at these anchors; compose the runnable
# combo with `run(base, [addons])` or a boot-registered alias (e.g. the
# game_harness addon → `dpe_game`). See core/addon_registry.py. Games route to
# the composed config; non-game runs use this clean base.
anchors:
  post_repo_setup: "git_sync_pre"  # right after the repo exists (early scaffold)
  architect: "2"                   # the architect agent
  pm: "3"                          # the PM/planner agent
  implementer: "t_impl"            # the per-task implementer agent
  post_verify_tests: "5_test"      # the edge out of the deterministic test gate
  verifier_review: "5_review"      # the final verifier/reviewer

# Host (AItelier) metadata — read by core/config_registry.py, ignored by skillflow.
x-aitelier:
  label: "DPE Pipeline"
  scheduler_owned: true           # driven by the polling scheduler
  has_task_loop: true             # PM produces a task manifest → per-task loop
  seed_file: "project_brief.md"
  output_step: "5"
  preamble_steps: ["1", "2"]      # SOTA + architecture: project-global stable
                                  # docs hoisted into the shared system preamble
  labels:                         # step_id → dashboard label (source of truth)
    git_sync_pre: "Sync Repo"
    "1": "Researcher"
    "1_review": "Research Review"
    "2": "Architect"
    "2_review": "Architecture Review"
    "3": "PM"
    "3_review": "PM Review"
    "3_budget": "Step Budget"
    task_loop: "Task Loop"
    t_plan: "Task Planner"
    t_plan_review: "Plan Review"
    t_impl: "Implementer"
    t_impl_review: "Impl Review"
    "5": "Final Verifier"
    "5_test": "Final Tests"
    "5_knowledge": "Knowledge Sync"
    "5_review": "Final Review"

begin: "git_sync_pre"

end_conditions:
  combinator: or
  conditions:
    # Terminate at the loop-EXTERNAL `done` gate, reached ONLY when the final
    # verifier passes (5_review passed:true → done). node_reached must NOT be
    # `5_review`: it's inside the goal loop, so once it completes ONCE (even
    # with passed:false, which loops back to "3"), its `completed` row latches
    # node_reached and the run terminates on the NEXT loop iteration before
    # 5_review re-evaluates the fixed code — shipping a still-failing gate
    # (proven live: a game with playtest passed:false shipped as completed).
    # `done` is a gate (no completed step row), reached at most once, only on a
    # real pass. A never-passing loop is bounded by max_loop (5_review→3) and
    # max_total_steps below — both end the run as FAILED, never completed.
    - type: node_reached
      node: "done"
      result: "completed"
    - type: max_total_steps
      limit: 200
    # No wall-clock run cap: AItelier is single-instance and human-in-the-loop,
    # so a run may sit paused on a checkpoint indefinitely. max_run_duration_seconds
    # counted approval-wait time (started_at is stamped once and never adjusted for
    # paused state), so a run approved after a long wait failed instantly on resume.
    # Runaways are already bounded by max_total_steps + per-step timeout_seconds +
    # the scheduler's hung-step detection.
    - type: flag_match
      flag:
        fatal_error: true

steps:
  # ─── Pre-flight: git sync ───
  - id: "git_sync_pre"
    step_type: "tool"
    tool_name: "git_sync_pre"
    tool_params:
      project_root: "$PROJECT_ROOT"
    transitions:
      - to: "1"
        match: { synced: true }

  # ─── Research ───
  - id: "1"
    step_type: "agent"
    agent_config: "researcher"
    timeout_seconds: 300
    context:
      - source: { from: "repository", mode: "tool" }
      # Cross-run memory: distilled, review-verified knowledge left by prior DPE
      # runs on THIS repo (git-ignored, absent on the first run). Carries design
      # rationale + known pitfalls so we build on past wisdom without re-deriving
      # it. Treat its "known issues" as things to avoid; verify any file/symbol it
      # names still exists before relying on it (it reflects a past run's state).
      - source: { from: "repository", path: ".aitelier/knowledge.md", mode: "tool" }
      - source: { config: "meta_conversation", step: "finalize", output: "step1_goals.json", required: true }
      # Review loop-back inputs (both empty on the first pass). sota has no
      # repo_apply, so its prior draft lives only in the step artifact dir —
      # unreachable as an `edit` baseline — meaning a reject can only REWRITE, not
      # surgically edit. Injecting the prior draft + the reviewer's verdict turns
      # that blind rewrite into an INFORMED one: the researcher keeps what was
      # right and rewrites only what 1_review flagged, instead of re-deriving the
      # whole SOTA from scratch (and possibly regressing the parts that passed).
      - source: { step: "1" }
      - source: { step: "1_review" }
      - source: { tool: "dir_tree" }
    output:
      mode: "content"
      fixed:
        sota: "step1_sota.md"
    validation:
      - files: ["step1_sota.md"]
        tool: "file_exists"
    checkpoint: true
    checkpoint_label: "SOTA / Codebase Analysis Review"
    transitions:
      - to: "1_review"
        match: { from: "checkpoint", value: "approved" }

  - id: "1_review"
    step_type: "agent"
    agent_config: "researcher_reviewer"
    timeout_seconds: 180
    context:
      - source: { from: "repository", mode: "tool" }
      - source: { step: "1" }
      # …and what the USER demanded about that output at its checkpoint.
      #
      # Without this the reviewer enforces a hard gate ("every blocking issue
      # in the previous feedback must have a NEW repair task") while being blind
      # to the one message that can retire a blocking issue. The two then
      # deadlock, and the deadlock burns the plan loop until the run dies.
      #
      # Live, jinyong-encounter 2026-08-23: two of 5_review's three blocking
      # issues were gate defects fixed OUTSIDE the repo (a unit gate looking for
      # a binary that is not in the container; a play-test report that existed
      # but had been truncated out of the prompt). The user rejected the plan at
      # the checkpoint and said, with reasons, to delete the task for one of
      # them. The PM complied. 3_review then failed the run for a plan that
      # "only covers ONE of the three hard-gate failures" — enforcing the rule
      # against an instruction it could not see. `3_review -> 3` hit 3/3 and the
      # run ended one repair short, with `5_review -> 3` still at 2 of 4.
      #
      # skillflow's own note on this source says it plainly: reject feedback is
      # otherwise injected ONLY into the rejected step's re-run, so the reviewer
      # stays blind to what the user demanded. novel_chapter/novel_init already
      # wire it onto their reviewers; the DPE reviewers never did.
      - source: { feedback_of: "1" }
    output:
      mode: "content"
      fixed:
        verdict: { file: "review_verdict.json", on_exists: "new", format: '{"passed": bool, "feedback": str, "suggestions": [str, ...]}' }
    validation:
      - files: ["review_verdict.json"]
        tool: "json_schema"
        inline_schema:
          type: object
          required: [passed]
          properties:
            passed: { type: boolean }
            feedback: { type: string }
            suggestions: { type: array, items: { type: string } }
    transitions:
      - to: "2"
        match: { from_file: "review_verdict.json", field: "passed", value: true }
      - to: "1"
        match: { from_file: "review_verdict.json", field: "passed", value: false }
        max_loop: 3

  # ─── Architect ───
  - id: "2"
    step_type: "agent"
    agent_config: "architect"
    timeout_seconds: 300
    context:
      - source: { from: "repository", mode: "tool" }
      - source: { step: "1" }
      - source: { step: "2_review" }
      # 1_review 的建议只有走这一条才到得了架构师。拒绝时它作为 feedback 注入
      # step 1 自己的重跑;**通过**时(实测 15/15 全通过)它就写在 review_verdict.json
      # 里没有任何读者 —— 一个从不拒绝的评审于是等于一个零产出的步骤。
      # 不在 preamble_steps 里,所以这条标签("Step 1_review")不会被 drop。
      - source: { step: "1_review" }
      - source: { tool: "dir_tree" }
    output:
      mode: "content"
      fixed:
        design: "step2_design.md"
        linter_manifest: "linter_manifest.json"
    validation:
      - files: ["step2_design.md"]
        tool: "file_exists"
    lifecycle:
      on_deliver:
        tool: "repo_apply"
        params:
          source_dir: "$STEP_DIR"
        on_failure: "skip"
    checkpoint: true
    checkpoint_label: "Architecture Review"
    transitions:
      - to: "2_review"
        match: { from: "checkpoint", value: "approved" }

  - id: "2_review"
    step_type: "agent"
    agent_config: "architect_reviewer"
    timeout_seconds: 180
    context:
      - source: { from: "repository", mode: "tool" }
      - source: { step: "2" }
      # …and what the USER demanded about that output at its checkpoint.
      #
      # Without this the reviewer enforces a hard gate ("every blocking issue
      # in the previous feedback must have a NEW repair task") while being blind
      # to the one message that can retire a blocking issue. The two then
      # deadlock, and the deadlock burns the plan loop until the run dies.
      #
      # Live, jinyong-encounter 2026-08-23: two of 5_review's three blocking
      # issues were gate defects fixed OUTSIDE the repo (a unit gate looking for
      # a binary that is not in the container; a play-test report that existed
      # but had been truncated out of the prompt). The user rejected the plan at
      # the checkpoint and said, with reasons, to delete the task for one of
      # them. The PM complied. 3_review then failed the run for a plan that
      # "only covers ONE of the three hard-gate failures" — enforcing the rule
      # against an instruction it could not see. `3_review -> 3` hit 3/3 and the
      # run ended one repair short, with `5_review -> 3` still at 2 of 4.
      #
      # skillflow's own note on this source says it plainly: reject feedback is
      # otherwise injected ONLY into the rejected step's re-run, so the reviewer
      # stays blind to what the user demanded. novel_chapter/novel_init already
      # wire it onto their reviewers; the DPE reviewers never did.
      - source: { feedback_of: "2" }
    output:
      mode: "content"
      fixed:
        verdict: { file: "review_verdict.json", on_exists: "new", format: '{"passed": bool, "feedback": str, "suggestions": [str, ...]}' }
    validation:
      - files: ["review_verdict.json"]
        tool: "json_schema"
        inline_schema:
          type: object
          required: [passed]
          properties:
            passed: { type: boolean }
            feedback: { type: string }
    transitions:
      - to: "3"
        match: { from_file: "review_verdict.json", field: "passed", value: true }
      - to: "2"
        match: { from_file: "review_verdict.json", field: "passed", value: false }
        max_loop: 3

  # ─── PM ───
  - id: "3"
    step_type: "agent"
    agent_config: "pm"
    timeout_seconds: 300
    max_retries: 3
    max_tool_turns: 20
    context:
      - source: { from: "repository", mode: "tool" }
      - source: { step: "1" }
      - source: { step: "2" }
      - source: { step: "3_review" }
      # 同 step 2 那条:2_review 通过时(实测 15/15)它的建议没有任何读者。架构评审
      # 对 PM 说的话只有走这一条才到得了 PM。
      - source: { step: "2_review" }
      # Goal-loop inputs (empty on the first pass; present when 5_review loops
      # back here): PM's own prior manifest, the final verifier output, the
      # review verdict (the actual pass/fail feedback the PM must address), and
      # test failures. Without 5_review the PM can't see WHAT failed, so it can't
      # author a targeted fix-task — it just re-lists completed tasks (skipped).
      - source: { step: "3" }
      - source: { step: "5" }
      - source: { step: "5_review" }
      - source: { step: "5_test" }
      # What this pipeline can grant a task. Without it the PM either declares
      # nothing (and the implementer is under-granted) or invents a name (which
      # the validation below rejects) — the same failure `forge_palette` exists
      # to prevent for tools and models.
      - source: { tool: "capability_palette" }
      - source: { tool: "dir_tree" }
    output:
      mode: "content"
      # Promotion REPLACES this step's directory, and a re-planned PM re-emits
      # only the cards it changed — the reasonable reading of a briefing that
      # describes staging and step output as layered for READING and says
      # nothing about the destructive write. Live 2026-08-26: a re-plan wrote 2
      # of 9 cards and promotion deleted the other 8 while the manifest still
      # named them. carry_forward (skillflow >=1.5.44) seeds staging from this
      # step's own promoted output, so an untouched card survives and dropping
      # one becomes an explicit `delete_task_card` call.
      carry_forward: true
      fixed:
        tasks_manifest: { file: "tasks_manifest.json", format: '{"execution_order": [[str, ...], ...]}' }
        task_card: { file: "tasks/*.json", format: '{"id": str, "description": "ONE-LINE summary (max 80 chars)", "detailed_requirements": str, "artifact_requirement": str, "dependencies": [str, ...], "task_type": str, "interface_contract": str, "capabilities": "[str, ...] — OPTIONAL; extra tools this task needs, chosen ONLY from capability_palette. Omit when the task needs none."}' }
    validation:
      - files: ["tasks_manifest.json"]
        tool: "file_exists"
      # …and the manifest must agree with the cards. This step is
      # output.mode=content: promotion rmtree's the step dir and renames staging
      # over it, so a card not re-written this run is DELETED — while the agent's
      # prompt describes staging and step output as LAYERED for reading and says
      # nothing about the destructive write. A rejected agent therefore re-emits
      # only what it changed, which is the reasonable reading of what it was told.
      # Live 2026-08-26 (jinyong-hud): a re-plan wrote 2 of 9 cards, promotion
      # deleted the other 8 (git-confirmed), `file_exists` passed, and the break
      # would have surfaced only when the task loop reached the first missing
      # card — by then the cards were gone from the step dir.
      - files: ["tasks_manifest.json"]
        tool: "tasks_manifest_complete"
      # A capability name the pipeline does not offer is refused when t_impl is
      # claimed — silently, since a missing grant looks to the agent like a world
      # where that work is impossible. Caught here instead, at the card, on the
      # planner's own retry budget. Same rule shape as forge_registry_check's
      # role_model_known, one namespace over.
      - files: ["tasks/*.json"]
        tool: "capability_declarations_known"
    # SF-4: removed json_schema validation — LLM-generated JSON format varies;
    # strict schema causes infinite retry loops when validation fails on each
    # attempt. The two checks above are shape-free: one file must exist, and the
    # manifest must not name a card that is not there.
    checkpoint: true
    checkpoint_label: "Review Task Breakdown"
    transitions:
      - to: "3_budget"
        match: { from: "checkpoint", value: "approved" }
      - to: "task_loop"
        match: { _error: true }

  # ─── Step-budget gate (deterministic, no LLM) ───
  # The PM's list has to be executable by the ENGINE, not just sensible to a
  # reader, and that is arithmetic: 4 steps per task + the linear chain, against
  # `max_total_steps` above. Nothing checked it. On the `boltons` benchmark the
  # PM listed 33 tasks (145 steps); the 5_review goal loop appended 21 fix tasks
  # → 54 tasks / 227 steps against a 200 cap, and the run was killed by the cap
  # with every completed task discarded. It could not have finished with
  # unlimited time — the failure was countable the moment the manifest existed.
  #
  # The gate can only REJECT. `max_total_steps` is read from the registered
  # GRAPH (skillflow core.py: `resolver.graph.end_conditions`), never from the
  # run row — `create_run` copies per-node config and edge counts and not the
  # end conditions — so there is no per-run budget to raise. Rewriting the graph
  # would move the cap for every other run of this config.
  #
  # It sits BEFORE `3_review`, not between it and `task_loop`, because an inline
  # tool step routes with `_complete_tool_step`, which sets current_node and
  # returns it WITHOUT resolving a loop node (only advance_run's own paths do
  # that). A tool edge pointing straight at `task_loop` therefore hands the loop
  # id to the next claim, and it gets claimed as an agent step. Every edge out of
  # this gate targets an agent step; the loop is still entered from `3_review`,
  # exactly as before. It also means the arithmetic is checked before the
  # reviewer spends a step reading a list the engine cannot execute.
  - id: "3_budget"
    step_type: "tool"
    tool_name: "task_budget_check"
    tool_params:
      out_dir: "$STEP_DIR"
    transitions:
      - to: "3_review"
        match: { within_budget: true }
      # Back to the PM with the numbers. `feedback: true` puts the tool's
      # `reason` — "your N tasks need R steps, the budget is M, cut to K" — in
      # the PM's MUST-ADDRESS banner, which is the only place it is sure to be
      # read (the PM's re-run context does not include this step).
      - to: "3"
        match: { within_budget: false }
        feedback: true
        max_loop: 2
      # Retries spent and the list still overshoots: proceed rather than fail the
      # run here. That is exactly today's behaviour — partial work, then the cap —
      # and it beats delivering nothing at all. The bounded rounds above are the
      # fix; this edge is the floor under it.
      - to: "3_review"

  - id: "3_review"
    step_type: "agent"
    agent_config: "pm_reviewer"
    timeout_seconds: 180
    context:
      - source: { from: "repository", mode: "tool" }
      - source: { step: "3" }
      # …and what the USER demanded about that output at its checkpoint.
      #
      # Without this the reviewer enforces a hard gate ("every blocking issue
      # in the previous feedback must have a NEW repair task") while being blind
      # to the one message that can retire a blocking issue. The two then
      # deadlock, and the deadlock burns the plan loop until the run dies.
      #
      # Live, jinyong-encounter 2026-08-23: two of 5_review's three blocking
      # issues were gate defects fixed OUTSIDE the repo (a unit gate looking for
      # a binary that is not in the container; a play-test report that existed
      # but had been truncated out of the prompt). The user rejected the plan at
      # the checkpoint and said, with reasons, to delete the task for one of
      # them. The PM complied. 3_review then failed the run for a plan that
      # "only covers ONE of the three hard-gate failures" — enforcing the rule
      # against an instruction it could not see. `3_review -> 3` hit 3/3 and the
      # run ended one repair short, with `5_review -> 3` still at 2 of 4.
      #
      # skillflow's own note on this source says it plainly: reject feedback is
      # otherwise injected ONLY into the rejected step's re-run, so the reviewer
      # stays blind to what the user demanded. novel_chapter/novel_init already
      # wire it onto their reviewers; the DPE reviewers never did.
      - source: { feedback_of: "3" }
      # Goal-loop: the verifier's verdict the PM was supposed to fix. Lets the
      # reviewer check each reported issue has a NEW fix-task (empty first pass).
      - source: { step: "5_review" }
    output:
      mode: "content"
      fixed:
        verdict: { file: "review_verdict.json", on_exists: "new", format: '{"passed": bool, "feedback": str, "suggestions": [str, ...]}' }
    validation:
      - files: ["review_verdict.json"]
        tool: "json_schema"
        inline_schema:
          type: object
          required: [passed]
          properties:
            passed: { type: boolean }
            feedback: { type: string }
    transitions:
      - to: "task_loop"
        match: { from_file: "review_verdict.json", field: "passed", value: true }
      - to: "3"
        match: { from_file: "review_verdict.json", field: "passed", value: false }
        max_loop: 3

  # ─── Task Loop ───
  - id: "task_loop"
    step_type: "loop"
    loop:
      source:
        step: "3"
        file: "tasks_manifest.json"
        field: "execution_order"
      item_as: "current_task"
      max_iterations: 200
    transitions:
      - to: "t_plan"
        max_loop: 200
      - to: "5"

  # ─── Task Plan ───
  - id: "t_plan"
    step_type: "agent"
    agent_config: "task_planner"
    # Bound a stuck/conflicting loop-body claim so it times out cleanly instead
    # of churning (defense-in-depth for the loop-progression fix).
    timeout_seconds: 300
    context:
      # The current task being planned — resolved from the task_loop item
      # (current_task) so each iteration is scoped to its own task card.
      - source: { from: "repository", mode: "tool" }
      - source: { step: "3", file: "tasks/$current_task.json" }
      # Bare on purpose — `output:` would relabel this past
      # drop_preamble_steps and duplicate the preamble. See t_impl_review.
      # `mode:` is INERT here while preamble_steps carries this step —
      # the whole entry is dropped, so nothing is left to slice. Kept as
      # the declared intent if the preamble ever stops carrying it.
      - source: { step: "1", mode: "summary" }
      # `mode:` is INERT here while preamble_steps carries this step —
      # the whole entry is dropped, so nothing is left to slice. Kept as
      # the declared intent if the preamble ever stops carrying it.
      - source: { step: "2", mode: "interfaces" }
      - source: { step: "t_plan_review" }
      # Self prior (empty on the first pass). t_plan already sees the reviewer's
      # verdict, but without its OWN prior plan a reject re-authors task_plan.md
      # from scratch — so parts the reviewer never objected to can silently
      # change (a mini whack-a-mole on the plan doc). The plan isn't repo_applied,
      # so this self-context is the only way to carry it forward; the planner then
      # revises just what t_plan_review flagged. (t_impl already does this.)
      - source: { step: "t_plan" }
      - source: { tool: "dir_tree" }
    output:
      mode: "content"
      fixed:
        plan: "task_plan.md"
        subtask_manifest: { file: "subtasks_manifest.json", format: '{"subtasks": [subtask, ...], "execution_order": [[str, ...], ...]}' }
        subtask_card: { file: "subtasks/*.json", format: '{"id": str, "description": str, "dependencies": [str, ...], "artifact_requirement": str, "interface_contract": str}' }
        research_notes: { file: "research_notes.md", format: "Literal external references the implementer needs but cannot look up (it has no web access and no shell — only read/list_tree/create/edit on the repo): exact API signatures, import paths, config keys, and version-specific gotchas for any third-party/unfamiliar library this task uses. Use web_fetch on the official docs and record the verbatim signatures — NOT prose summaries. These notes must be SELF-CONTAINED: never defer to a link ('canonical source at <URL>', 'see the repo for the rest') — whatever the implementer needs literally, paste literally here. Signatures yes, implementation bodies no: the implementer writes the bodies from the behavioural contract, so never state or imply that matching an upstream source byte-for-byte is the acceptance bar. If the task only uses the standard library or already-known APIs, write a single line: 'No external references needed.'" }
    # A planner that promotes NOTHING used to complete green: `_step_commit`
    # returns {"passed": true, "files": []} for an empty staging dir, and the
    # engine's zero-file warning only fires for `output.mode: write` — this step
    # is `content`, so it got neither flag nor log line. t_plan_review then
    # reviewed an empty workspace, fell back to reviewing the repository,
    # rejected for an unrelated reason, and burned two of its three replan
    # retries. `output.fixed` is NOT a contract (it only generates the write
    # tools), so validation is the only thing that makes the slot mandatory.
    # Only task_plan.md: it is the sole slot the template's "输出" section
    # actually mandates, and the only one t_plan_review and t_impl both depend
    # on. The manifest/cards are optional by the planner's own prompt, and
    # research_notes.md is never asked for in the output section — gating on it
    # would fail otherwise-good plans on a slot nobody instructed the agent to
    # write.
    validation:
      - files: ["task_plan.md"]
        tool: "file_exists"
    transitions:
      - to: "t_plan_review"
      # Validation exhaustion goes through _fail_step_in_tx(retryable=False),
      # which needs an `_error` edge or it fails the RUN — throwing away every
      # task the loop already finished, the same dead end c9ad09d fixed for the
      # two loop reviewers. After 3 retries with $._validation_error in the
      # prompt, give up on the PLAN and let t_impl work from the task card +
      # repo (its t_plan context source is not `required`). t_impl_review, 5 and
      # 5_review still stand between that and `done`. NOT t_plan_review: that
      # would re-enact the original bug of reviewing an empty plan.
      - to: "t_impl"
        match: { _error: true }

  - id: "t_plan_review"
    step_type: "agent"
    agent_config: "task_planner_reviewer"
    context:
      - source: { from: "repository", mode: "tool" }
      - source: { step: "t_plan" }
    output:
      mode: "content"
      fixed:
        verdict: { file: "review_verdict.json", on_exists: "new", format: '{"passed": bool, "feedback": str, "suggestions": [str, ...]}' }
    # Same shape the other four reviewers validate. json_schema, not file_exists:
    # both edges below read `passed` out of this file, so a verdict whose
    # `passed` is missing or not a bool is exactly as unroutable as no verdict at
    # all — this schema validates precisely what the routing needs and nothing
    # more. It is NOT the strict-schema failure the comment at step "3" warns
    # about: that one gated a nested manifest whose LLM formatting genuinely
    # varies, whereas one boolean has no format latitude, and the retries here
    # are bounded by max_retries and then escape via the `_error` edge, so no
    # infinite retry loop is reachable. A validation retry re-asks THIS reviewer
    # with $._validation_error in the prompt, which is a better first response to
    # a missing verdict than spending the routing fallback below.
    validation:
      - files: ["review_verdict.json"]
        tool: "json_schema"
        inline_schema:
          type: object
          required: [passed]
          properties:
            passed: { type: boolean }
            feedback: { type: string }
    transitions:
      - to: "t_impl"
        match: { from_file: "review_verdict.json", field: "passed", value: true }
      - to: "t_plan"
        match: { from_file: "review_verdict.json", field: "passed", value: false }
        max_loop: 3
      # Same dead end as t_impl_review below (see the long note there): an
      # absent/unparseable verdict, or a `passed` that is neither true nor false,
      # matches NEITHER edge and kills the run mid-task-loop. Re-run the reviewer
      # first — the plan under review is unchanged, so nothing is discarded —
      # bounded so a systematically broken reviewer can't spin.
      - to: "t_plan_review"
        max_loop: 2
      # Then proceed with the plan UNREVIEWED rather than discard every task the
      # loop already built: t_impl_review and the project-level gate still stand
      # between this plan and `done`.
      - to: "t_impl"
      # The routing fallbacks above only fire once the step COMPLETES. With the
      # validation block added, a verdict-less reviewer no longer completes — it
      # retries and then hits _fail_step_in_tx(retryable=False), which without an
      # `_error` edge kills the run. Land it on the same escape so validation
      # cannot re-open the dead end c9ad09d closed.
      - to: "t_impl"
        match: { _error: true }

  # ─── Task Implement → Review ───
  # Lifecycle hooks:
  #   after_validate → step_commit (built-in default, tmp→step_dir)
  #   on_deliver     → repo_apply (step_dir→project repo)
  #   after_deliver  → lint (project checks, per-extension backends)
  - id: "t_impl"
    step_type: "agent"
    agent_config: "task_implementer"
    # Per-TASK toolset. The PM writes `capabilities: [...]` on a task card; the
    # framework grants those tools and injects each capability's briefing, and
    # nothing else carries them. Measured before this existed: the two asset
    # tools rode every implementer turn of every DPE run and were called zero
    # times in 6,996 tool calls.
    capability: { from_item: "capabilities", card: "3/tasks/$current_task.json" }
    # Bound a stuck/conflicting loop-body claim so it times out cleanly instead
    # of churning (defense-in-depth for the loop-progression fix).
    timeout_seconds: 300
    context:
      - source: { from: "repository", mode: "tool" }
      - source: { step: "3", file: "tasks/$current_task.json" }
      # Bare on purpose — `output:` would relabel this past
      # drop_preamble_steps and duplicate the preamble. See t_impl_review.
      # `mode:` is INERT here while preamble_steps carries this step —
      # the whole entry is dropped, so nothing is left to slice. Kept as
      # the declared intent if the preamble ever stops carrying it.
      - source: { step: "2", mode: "interfaces" }
      - source: { step: "t_plan" }
      # 计划评审通过时说的话,以前到不了执行者。t_plan_review 是全流程判决最多的
      # 评审(177 次判决 / 162 次通过 / 平均 2.6 条建议),而 t_impl 的 context 里
      # 没有它 —— 实测 317 份 t_impl prompt 里 "Step t_plan_review" 出现 0 次,
      # 同期 "Step t_plan" 出现 295 次,所以这不是标签写法问题,是真的没接。
      # "计划可以,但注意 X" 里的 X 于是从未到达写代码的那个 agent。
      - source: { step: "t_plan_review" }
      - source: { step: "t_impl" }
      - source: { step: "t_impl_review" }
      - source: { tool: "dir_tree" }
    output:
      mode: "write"
    # The importability gate. `lint` dispatches .py to the `ruff` backend, which
    # the host replaces with a check-only one (api/dependencies.py:
    # _ruff_check_only, `--select E9,F63,F7,F82`) — syntax errors, and F821
    # undefined-name, which is the ONE static check that sees the defect class
    # that zeroes a whole repo: a name used but never imported. A retry re-asks
    # THIS implementer with the ruff findings in its prompt, so the loop that
    # fixes it is the one that wrote it.
    # NL2Repo sweep 2026-08-18, task `fastapi-users`: a missing TypeVar
    # import (`AP` in authentication/strategy/db/strategy.py) made the package
    # unimportable and zeroed all 556 tests. Five tasks / ~3200 tests lost the
    # same way.
    #
    # It was already declared here — and it never ran. `workspace_root:
    # "$STEP_DIR"` is passed through VERBATIM: StepValidator resolves no
    # variables (only the on_deliver tool-hook path does, see the note below), so
    # `lint` rglob'd a directory literally named `$STEP_DIR`, matched zero files,
    # and returned `{all_passed: true, results: []}` — a vacuous pass. 36 lint
    # calls in that run, every one of them a no-op. Omitting the key is what makes
    # it work: StepValidator defaults workspace_root to the step's staging dir,
    # which is exactly the tree this step just wrote.
    #
    # manifest_path is omitted too, so the built-in default (.py → ruff) applies.
    # The architect's linter_manifest.json is LLM-authored and `lint` returns
    # passed=True for a backend name it does not recognise — one invented linter
    # name would switch this gate off again, silently, exactly as $STEP_DIR did.
    # Which checker guards importability is not the architect's to choose.
    validation:
      - files: ["*.py"]
        tool: "lint"
      # The same gate for GDScript. `lint` cannot serve it: its file glob is the
      # first filter, so *.py never sees a .gd file, and routing .gd through the
      # architect's linter_manifest.json would put the gate under LLM control —
      # lint returns passed=True for a backend name it does not recognise, so one
      # typo switches it off in silence, exactly as $STEP_DIR did above.
      # gdscript_check shells `godot --check-only --script` per file through the
      # sidecar: no project import, cheap enough to run every task, and it passes
      # trivially for the projects that have no .gd at all.
      # jinyong-play, task 1: a get_move_range() BFS loop shipped with tab depths
      # 3/4/5/7 and a duplicated guard — a parse error that reached the repo
      # because nothing mechanical looked at a .gd file until 5_compile, six
      # tasks later. The reviewer caught it by counting tabs.
      - files: ["*.gd"]
        tool: "gdscript_check"
    lifecycle:
      # on_deliver is a SEQUENCE of repo-mutating tool hooks, run in order with
      # full variable resolution (needs skillflow-py >= 1.4.1). repo_apply
      # adds/updates the step's files (ignoring the deletions manifest, so it
      # never reaches the repo); repo_delete then reads _deletions.json from
      # $STEP_DIR and git-rm's + commits the files the agent queued via
      # delete_file. No-op when nothing was queued.
      # (repo_delete cannot live in after_deliver: that path runs through
      # StepValidator, which neither resolves $STEP_DIR nor unwraps `params`.)
      on_deliver:
        - tool: "repo_apply"
          params:
            source_dir: "$STEP_DIR"
            ignore: ["_deletions.json"]
          on_failure: "retry"
          max_retries: 3
        - tool: "repo_delete"
          params:
            source_dir: "$STEP_DIR"
          # retry (not warn): a commit failure rolls back the staged git rm's and
          # keeps the manifest, so an in-place retry re-attempts from a clean tree
          # instead of advancing with a half-applied, uncommitted deletion.
          on_failure: "retry"
          max_retries: 2
      after_deliver:
        # Lint the post-apply, post-deletion tree. Same $STEP_DIR no-op as the
        # validation block above: dropping the key lets skillflow supply the
        # after_deliver root, which for this hook IS the project repo — so this
        # is the whole-tree pass, catching a name that a LATER task broke in an
        # EARLIER task's file (which the staging-scoped validation cannot see).
        #
        # warn, not retry: skillflow only honours per-spec `on_failure` for the
        # value "warn" — a check-list hook resolves its hook-level policy to
        # "fail" (core.py: `hook_spec.get(...) if isinstance(hook_spec, dict)`,
        # and this spec is a list), so `retry` here was never retry. It would be
        # `_handle_lifecycle_failure` → retryable=False, with no feedback turn:
        # one undefined name left anywhere in the repo would hard-fail the
        # after_deliver of every REMAINING task, on a defect that task did not
        # write and is never told about. The fatal gate is the validation block
        # above, which does re-ask the implementer with the ruff output in its
        # prompt; repo-wide drift is reported here.
        - tool: "lint"
          files: ["**/*.py"]
          on_failure: "warn"
        - tool: "lint"
          files: ["**/*.js", "**/*.html", "**/*.css"]
          manifest_path: "linter_manifest.json"
          on_failure: "warn"
    transitions:
      - to: "t_impl_review"
      # Validation exhaustion goes through _fail_step_in_tx(retryable=False),
      # which without an `_error` edge fails the RUN — discarding every task the
      # loop already finished (the dead end c9ad09d closed for the two loop
      # reviewers). t_impl had no validation that could actually fail until the
      # gate above was un-broken, so it had no such edge either. After the retry
      # budget is spent with the ruff findings in the prompt, hand the code to
      # the reviewer rather than throwing the run away: t_impl_review reads the
      # repository, and its reject edge comes back here for another attempt.
      - to: "t_impl_review"
        match: { _error: true }

  - id: "t_impl_review"
    step_type: "agent"
    agent_config: "task_implementer_reviewer"
    context:
      - source: { from: "repository", mode: "tool" }
      # KEEP THIS BARE. `output:` here is not an improvement — it is a
      # REGRESSION, and the earlier version of this comment argued for it from
      # the wrong artifact. Both halves, so neither gets re-"fixed":
      #
      # 1. `mode:` really is inert without `output:` — skillflow applies mode
      #    only on the named-single-file branch (context.py
      #    :_resolve_step_output); the bare form takes the "concatenate every
      #    file in the step dir" branch, which never looks at mode. True, and
      #    irrelevant here, because of (2).
      # 2. This config sets `x-aitelier.preamble_steps: ["1", "2"]` (line 31),
      #    so step 1 + step 2 are
      #    hoisted into the byte-identical shared SYSTEM preamble, and
      #    `PromptAssembler.drop_preamble_steps` removes their resolved_context
      #    copies from the user message. That drop matches the exact label
      #    `"Step 2"`. Naming the file relabels the source
      #    `"Step 2 — step2_design.md"`, which no longer matches — so the drop
      #    stops firing and the slice is ADDED back on top of the preamble.
      #
      # Verified on live prompts (trace `prompt`/`user_prompt`, 2026-08-26):
      # t_impl and t_plan carry the design in `system` only, `"Step 2"` absent
      # from `user` — dropped, as designed. This step, with the named form, had
      # it in BOTH: `system` carried the full doc AND `user` carried an
      # 8,311-char interfaces extract of the same doc, complete with a
      # "TRUNCATED … Anything past this point is NOT shown" marker about text
      # that was sitting in its own system message. ~2.8k wasted tokens every
      # turn, and a marker actively lying to the reviewer.
      #
      # The 40,798-char "40.4% of this step's context" figure that justified
      # the change was read from `skillflow_steps.inputs_json`, which is the
      # PRE-drop resolved context — not what reaches the model. Measure the
      # traced prompt, not the inputs, before touching a context source in a
      # config that declares preamble_steps.
      # `mode:` is INERT here while preamble_steps carries this step —
      # the whole entry is dropped, so nothing is left to slice. Kept as
      # the declared intent if the preamble ever stops carrying it.
      - source: { step: "2", mode: "interfaces" }
      - source: { step: "t_plan" }
      - source: { step: "t_impl" }
      - source: { tool: "dir_tree" }
    output:
      mode: "content"
      fixed:
        verdict: { file: "review_verdict.json", on_exists: "new", format: '{"passed": bool, "feedback": str, "suggestions": [str, ...]}' }
    # See t_plan_review for why json_schema on just `passed`: it validates
    # exactly what the two edges below read, so an unroutable verdict is caught
    # and re-asked on this step's own retry budget instead of consuming the
    # routing fallback. The live failure documented below — reviewer burns ten
    # turns reasoning, never calls create_verdict, step commits "0 file(s)" — is
    # now a validation failure the reviewer is told about, not a silent green.
    validation:
      - files: ["review_verdict.json"]
        tool: "json_schema"
        inline_schema:
          type: object
          required: [passed]
          properties:
            passed: { type: boolean }
            feedback: { type: string }
    transitions:
      - to: "task_loop"
        match: { from_file: "review_verdict.json", field: "passed", value: true }
      - to: "t_impl"
        match: { from_file: "review_verdict.json", field: "passed", value: false }
        max_loop: 3
      # ── Unroutable verdict: bounded reviewer retry, then forward ───────────
      # Both edges above read `passed` out of review_verdict.json. When the file
      # is absent or unparseable, or `passed` is not a bool, NEITHER matches and
      # the run DIES — "No matching transition from 't_impl_review' with flags
      # {}" — discarding every task the loop had already finished. Live, in the
      # 104-task benchmark sweep (project nl2repo-asteval, task core_astutils):
      # the reviewer spent all ten of its tool turns emitting reasoning at
      # max_output_tokens 4096, never called `create_verdict`, and the step
      # committed "0 file(s)" with empty flags. A harness dead end scored as a
      # model failure.
      #
      # 1) Re-run the REVIEWER, not the implementer. An empty/garbled verdict is
      #    a transient LLM failure; the code under review is unchanged, and
      #    bouncing to t_impl would re-write work nobody objected to. max_loop
      #    bounds it, and the loop resets body edge counts per item, so the
      #    budget is per task and a broken reviewer cannot spin.
      - to: "t_impl_review"
        max_loop: 2
      # 2) Give up on THIS review and move on. `task_loop` credits the current
      #    item and dispatches the next, so this edge can only make progress —
      #    unlike an `_error:` edge, which re-enters the loop WITHOUT crediting
      #    and would re-run the same item forever. Skipping one task's review
      #    beats losing the run: 5 → 5_test → 5_review (goal-looping back to the
      #    PM) still has to pass before anything ships. This also rescues the
      #    reject edge's own dead end — once its max_loop is spent, every edge
      #    used to be exhausted and the run died with CycleLimitExceeded.
      - to: "task_loop"
      # 3) Both edges above need the step to COMPLETE. Validation exhaustion
      #    never completes it — it ends in _fail_step_in_tx(retryable=False),
      #    which fails the RUN unless an `_error` edge says otherwise. Same
      #    escape, so adding validation cannot cost us the rescue above.
      - to: "task_loop"
        match: { _error: true }

  # ─── Final Verify ───
  - id: "5"
    step_type: "agent"
    agent_config: "final_verifier"
    context:
      - source: { from: "repository", mode: "tool" }
      - source: { step: "1" }
      - source: { step: "2" }
      - source: { step: "5_review" }
      # Goals delivered by skillflow context from the meta run's surviving copy
      # (DPE step-1 promotion wipes any copy placed in dpe_default_v2/1/).
      - source: { config: "meta_conversation", step: "finalize", output: "step1_goals.json", required: true }
      - source: { tool: "dir_tree" }
    output:
      mode: "content"
      fixed:
        report: { file: "final/verify_report.json", format: '{"all_goals_met": bool, "verified_subtasks": [str, ...], "issues": [str, ...], "ready_for_deploy": bool}' }
        readme: { file: "README.md", format: 'Markdown 项目交付文档：项目简介、安装步骤、运行方法、关键接口/API 端点——反映仓库交付时的真实最终状态' }
    # The verifier owns project documentation AND runs LAST (after every task is
    # implemented + verified), so the README reflects the repo's actual final
    # state. README.md is a DECLARED content-mode output: it is written via the
    # engine-generated write tool (create_readme) whose target path is bound to
    # $STEP_DIR by the engine — the agent never supplies a path — and delivered
    # into the resolved project repo by the on_deliver repo_apply below.
    # (The retired readme_* custom tools resolved an agent-supplied project_root
    # against the process CWD, which in the container is the AItelier source repo
    # bind-mounted at /app, and clobbered AItelier's own README. repo_apply
    # resolves the real code path, so it can only ever target the project repo.)
    lifecycle:
      on_deliver:
        tool: "repo_apply"
        params:
          source_dir: "$STEP_DIR"
          # Only README.md ships to the delivered repo — keep the verdict out.
          ignore: ["verify_report.json", "final/*"]
        on_failure: "skip"
    transitions:
      - to: "5_test"

  # ─── Run unit tests (deterministic gate, AFTER the verifier) ───
  # Runs pytest over the consolidated repo and writes test_report.json. Always
  # succeeds as a step; the outcome is captured for 5_review to fold into its
  # verdict, so the verifier's semantic issues AND test failures loop back to PM
  # together in one change-set.
  - id: "5_test"
    step_type: "tool"
    tool_name: "run_tests"
    # Claim timeout: must exceed run_tests' worst case (venv + pip + project
    # deps + the 180s pytest wall ≈ 900s) so a slow-but-alive run isn't
    # reclaimed mid-flight by a concurrent driver — only a dead claim recovers.
    timeout_seconds: 1200
    tool_params:
      out_dir: "$STEP_DIR"
    transitions:
      # Engine-agnostic base: goes straight to knowledge. The `game_harness`
      # addon splices the compile/play-test gate (5_compile) in HERE, on this
      # edge (anchor: post_verify_tests), for game projects.
      - to: "5_knowledge"

  # ─── Cross-run knowledge transfer (deterministic, NEVER fails) ───
  # Distills this run's review-verified knowledge (approved architecture +
  # what the final verifier confirmed works + the issues it flagged) into a
  # git-IGNORED `<repo>/.aitelier/knowledge.md`, so the NEXT DPE run on the same
  # repo starts with the prior run's wisdom. Not committed (added to
  # .git/info/exclude), safe to `rm` if stale. Runs on every final-verify pass
  # (incl. goal-loop iterations); each rewrites this project's own section.
  - id: "5_knowledge"
    step_type: "tool"
    tool_name: "knowledge_sync"
    timeout_seconds: 300
    tool_params:
      out_dir: "$STEP_DIR"
    transitions:
      - to: "5_review"

  - id: "5_review"
    step_type: "agent"
    agent_config: "final_verifier_reviewer"
    context:
      - source: { from: "repository", mode: "tool" }
      # Which of the round's tasks actually produced an implementation. A loop
      # item can reach its own reviewer with an EMPTY t_impl — live on
      # jinyong-hud 2026-08-27, one arrived with no t_plan and no t_impl row at
      # all — and that reviewer then reviews the REPOSITORY (every other card's
      # work) and passes it. dpe_default already carries that lesson one step
      # earlier, in t_plan's validation comment; the per-item guard cannot fire
      # for a step that never ran, so the ROUND-level gate is where it is
      # catchable. Reported as evidence, not enforced as a rule: whether a
      # missing card sinks the round is the reviewer's call, and a round is not
      # allowed to end green without that fact in front of it.
      - source: { tool: "loop_items_implemented" }
      - source: { step: "5" }
      - source: { step: "5_test" }
      # { step: "5_compile" } is added by the game_harness addon (add_context),
      # so the base reviewer stays engine-agnostic.
    output:
      mode: "content"
      fixed:
        verdict: { file: "review_verdict.json", on_exists: "new", format: '{"passed": bool, "feedback": str, "suggestions": [str, ...]}' }
    validation:
      - files: ["review_verdict.json"]
        tool: "json_schema"
        inline_schema:
          type: object
          required: [passed]
          properties:
            passed: { type: boolean }
            feedback: { type: string }
    transitions:
      - to: "git_push_post"    # passed → push, then the loop-external terminal gate (the run's ONLY
                      # completed-terminal; see end_conditions note above)
        match: { from_file: "review_verdict.json", field: "passed", value: true }
      # ── GOAL-LOOP (configurable) ───────────────────────────────────────────
      # When final verification fails, loop back and re-do the project WITH the
      # verifier's feedback (goal-seeking retry), instead of just re-running the
      # verifier on unchanged code. Skillflow re-runs the whole subgraph from the
      # target down to here. Tune to taste:
      #   to:        loop target — "3" (PM: re-plan tasks + re-implement, DEFAULT;
      #              keeps research+architecture, fixes missing/buggy features),
      #              "2" (Architect: redesign — more thorough, more expensive,
      #              use when misses are structural),
      #              "1" (Researcher: rarely the cause of a goal miss).
      #   max_loop:  max goal-loop iterations before the run ends as failed.
      #   feedback:  injects the final verifier's reasons into the target step.
      # To DISABLE the goal-loop: set `to: "5"` (re-verify only) or delete this edge.
      - to: "3"
        match: { from_file: "review_verdict.json", field: "passed", value: false }
        # 4, not 2. The cap exists to stop a run that cannot converge from
        # burning forever — it should not cut off one that plainly IS
        # converging. Three consecutive dpe_game runs died here while doing
        # exactly that: the readability gate went 5-of-6 red, then 3-of-6, then
        # 1-of-6 across them, and each run was finished by hand afterwards.
        # jinyong-spine is the clearest case: 24 of 24 tasks done and the
        # tutorial-to-ending spine passing 12/12, ended `failed` because a
        # single `Array[Dictionary]()` typo needed one more repair pass than
        # the cap allowed. At 2 the budget is "implement once, repair once",
        # which a 20-plus-task run spends before it has seen its own gates.
        max_loop: 4

  # Loop-external terminal — reached only after the final verifier passes; the
  # node the end-condition fires on. Gate = no completed step row, so it fires
  # at most once and can't latch from a prior failed loop iteration. The
  # game_harness addon's anchors resolve against the steps above; `done` is the
  # graph's terminal and is not an anchor.
  # A finished round ends up on its remote branch — the same thing the
  # dashboard's push button does, at the pipeline's only clean exit.
  #
  # It SKIPS, successfully, whenever there is nothing to push to: no git repo,
  # no remote, a detached HEAD, or a branch the remote already has. Those are
  # normal states for a local-only project (and for every `repo_mode: none`
  # config), and a green run must not be held up by them — the mirror image of
  # `git_sync_pre`, which skips on exactly the same conditions at the top.
  #
  # A real push failure (auth, non-fast-forward, network) is reported in the
  # step output and the trace as `action: "error"`, and the run still completes:
  # `repo_apply` committed this round's work locally task by task, long before
  # here. Failing the run would not undo a commit — it would only replace
  # "passed, but the push failed" with "failed", which is less true and hides
  # the round that did pass. The single unconditional edge is deliberate.
  - id: "git_push_post"
    step_type: "tool"
    tool_name: "git_push_post"
    # A push failure is an outcome here, not a step failure — the paragraph
    # above is the argument. Says so explicitly, because skillflow now FAILS a
    # tool step whose result carries an `error` unless the node opts out.
    tool_error: "route"
    timeout_seconds: 180
    tool_params:
      project_root: "$PROJECT_ROOT"
    transitions:
      - to: "done"

  - id: "done"
    step_type: "gate"
    transitions:
      - to: null
