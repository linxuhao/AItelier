# agent_configs/dpe_default.yaml
# LLM call parameters indexed by role name (referenced from graph step.agent_config).
# Context, output, and validation are in the GRAPH config, NOT here.
# max_output_tokens: LLM completion max tokens (default 8192, increase for high-output steps)
# native_tool_calling: true = use native function calling instead of JSON-mode dispatch
# fallback_to_json_mode: true = auto fallback to JSON mode if native fails
#
# thinking.effort on the *_reviewer roles is NOT a cost knob — it is what keeps
# the review from silently not happening. DeepSeek bills reasoning inside
# max_output_tokens (completion_tokens includes reasoning_tokens; there is no
# separate budget parameter — budget_tokens / thinking.max_tokens /
# max_reasoning_tokens are all accepted and ignored), and with no effort set the
# server defaults to ~high. Measured on deepseek-v4-flash with a reviewer-shaped
# prompt at the old 4096 cap: default effort truncated 5/8 turns to
# finish_reason=length with zero text and zero tool_calls — the create_verdict
# call the reviewer exists to make was never emitted, and the step read as a
# clean no-op. At effort "low" the same prompt truncated 0/8 and every run still
# found the planted defect, so detection quality was bounded by truncation, not
# by reasoning depth. 8192 then covers the tail: reviewer reasoning in the run
# traces reaches ~18k chars (~6k tokens) at p99, which does not fit under 4096.

researcher:
  model: "deepseek/deepseek-v4-flash"
  temperature: 0.2
  template: "step1_5_researcher.md"
  tools: ["web_search", "web_fetch", "list_tree"]
  max_output_tokens: 16384
  native_tool_calling: true
  fallback_to_json_mode: true
  thinking:
    enable: true
    effort: "max"

researcher_reviewer:
  model: "deepseek/deepseek-v4-flash"
  temperature: 0.1
  template: "step1_5_researcher_red.md"
  tools: ["list_tree"]
  max_output_tokens: 8192
  native_tool_calling: true
  fallback_to_json_mode: true
  thinking:
    enable: true
    effort: "low"

