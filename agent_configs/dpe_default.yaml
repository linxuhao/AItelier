task_planner:
  model: "flash"
  temperature: 0.2
  template: "task_plan.md"
  tools: ["web_search", "web_fetch", "list_tree"]
  # 16384, back down from the 32768 that was meant to cure an observed starve.
  # It cured it by making every plan longer instead: on the `boltons` benchmark
  # t_plan emitted 1.2 MB of markdown for 1.0 MB of delivered Python and took
  # 141 minutes — 39% of the whole run — re-specifying what step 2 and the task
  # card already said. A bigger sheet of paper buys a longer essay, not a better
  # plan.
  #
  # Starting small is safe ONLY because the cap now grows on demand: a turn that
  # is truncated with neither text nor a tool call is a STARVE, and
  # core/dpe_pipeline.py:_run_native_step detects it and calls
  # AIGateway.escalate_output_cap(), which DOUBLES this cap (clamped at
  # OUTPUT_CAP_CEILING = 65536) before the retry. The raised cap rides on the
  # gateway that get_native_agent() builds once per step, so a planner that
  # genuinely needs 32768 gets there on its own, on the one task that needed it,
  # instead of every task paying for it up front.
  max_output_tokens: 16384
  # 6, down from 10. On `boltons` the planner spent 312 turns over 42 executions
  # (7.4/execution) of which most bought nothing: 51 of its 91 web_fetch calls
  # repeated a URL it had already fetched, and 86% of all reads in the run
  # re-read a path already read — so the non-redundant exploration in a typical
  # execution is ~2 turns. 6 leaves those 2 plus one write turn per output slot.
  # It is not a hard ceiling either: ask_more_turns is in every native step's
  # tool schema and extends the budget on request, so a task that really needs
  # more asks for it. Never RAISE this: instances that hit the old 10-turn
  # ceiling produced complete 4-slot output 24% of the time vs 54% for shorter
  # ones — more turns correlates with WORSE output.
  max_tool_turns: 6
  native_tool_calling: true
  fallback_to_json_mode: true
  thinking:
    enable: true

task_planner_reviewer:
  model: "flash"
  temperature: 0.1
  template: "task_plan_red.md"
  tools: ["list_tree"]
  max_output_tokens: 8192
  native_tool_calling: true
  fallback_to_json_mode: true
  thinking:
    enable: true
    effort: "low"

task_implementer:
  model: "flash"
  temperature: 0.2
  template: "task_implementer.md"
  # No "write": create/edit are derived from the step's output.mode (write).
  # Surgical create/edit prevents whole-file rewrites silently dropping unread code.
  # gen_image_asset/gen_audio_asset are NOT here any more: they are the
  # `game_assets` capability (offered by the game_harness addon, declared per
  # TASK CARD by the PM). They used to be granted to every DPE implementer,
  # game or not — measured across 22 workspaces and 6,996 tool calls: zero uses,
  # 55% of this step's 13.0 KB tool-schema budget, re-sent on all 3,527 turns.
  # Their discipline moved with them, into the capability's briefing.
  # godot_playtest_scenario is NOT here: it lives on the game_harness addon's
  # `add_tools: "@implementer"` channel, so the Godot probe reaches the
  # implementer on game runs only. It was parked here between 2026-08-24 and
  # skillflow-py 1.5.39 because add_tools was half-wired — the name reached the
  # claim-time TOOL SCHEMAS but never the execution allowlist, so the agent was
  # shown the tool and then refused when it called it. 1.5.39 merges
  # extra_tools into the allowlist (skillflow a3eaff2), so the grant is whole
  # and the addon owns it again.
  tools: ["list_tree", "test_write", "read_test_written", "delete_file",
          "capabilities_available"]
  # Stays at 32768 — deliberately BELOW core.ai_router.OUTPUT_CAP_CEILING (65536)
  # so a starved turn still has one doubling left. Raising it to the ceiling
  # would trade a real safety net for nothing: measured on jinyong-turn's
  # combat_engine, 2026-08-22, attempt 2 ran AT 65536 and still returned empty
  # text with zero tool calls, while attempt 3 ran at the same 65536 and
  # succeeded using 37,661. Same cap, opposite outcomes — the cap is not what
  # discriminates. Reasoning is billed inside it (DeepSeek exposes no separate
  # reasoning budget), so what actually starves a turn is how long the model
  # deliberates, and the fix for that lives in the prompt: see the
  # "兄弟任务还没落地时，照架构契约写" directive in templates/task_implementer.md,
  # which removes the specific thing those 242k reasoning chars were spent on.
  max_output_tokens: 32768
  # 15 → 24. Now that the implementer can MEASURE (godot_playtest_scenario runs
  # one scenario in ~50s against its own staged edits), a task card is no longer
  # "read the source, write the fix" — it is write → probe → read observed →
  # adjust → probe again. Each probe is a turn, and a play-test probe answers
  # with a page of assertions, so the loop is turn-hungry in a way the old
  # read-and-write flow never was.
  #
  # 15 was not enough for the shape it produces. Live, jinyong-winnable
  # 2026-08-24, card `repin_dot_timing`: the implementer rewrote the scenario
  # into a temporary all-placeholder version (`current_round == -1`,
  # `phase == "NEVER"`) to force the harness to print the values it needed — a
  # correct technique — then hit turn 15 before it could write the REAL
  # scenario back. The final-turn nudge ("your very next action MUST be a
  # write") then made it deliver the scaffolding. Three attempts, the same
  # ending each time, and repo_apply committed the placeholder scenario into
  # the game repo three times.
  max_tool_turns: 24
  native_tool_calling: true
  fallback_to_json_mode: true
  # effort "low", 2026-08-25. With no effort set the server defaults to ~high,
  # and this role is the single biggest line on the bill: 47.8% of all tokens
  # across the trace history, 79.7% of its own output being reasoning (5.44M
  # reasoning tokens). DeepSeek exposes only low/high/max — `medium` and
  # `xhigh` are silently MAPPED to high (api-docs.deepseek.com/guides/
  # thinking_mode), so there is no middle setting to hedge with.
  #
  # Measured by replaying this step's real prompt (row 1431,
  # `scenario_contract_wiring`) against a git worktree pinned to the commit
  # BEFORE the task landed, writes captured in a sandbox: 3 runs at low and 1
  # at high all delivered the SAME three files as the real commit
  # (create playtest/event_travel_effects.yaml, edit playtest/_common.yaml,
  # extend tests/test_playtest_contract_smoke.py), same turn counts, no
  # truncation — while low spent 712-1,885 reasoning tokens against high's
  # 5,647. Small n, and the Godot probe was stubbed in the replay, so this is
  # a bet, not a proof: compare the next live runs' traces before trusting it.
  # 4c7d8aa pinned this to low once before and e71036b removed it, but that
  # revert's stated reasoning is entirely about max_output_tokens — the effort
  # pin was never independently disproven.
  thinking:
    enable: true
    effort: "low"

task_implementer_reviewer:
  model: "flash"
  temperature: 0.1
  template: "task_implementer_red.md"
  tools: ["list_tree"]
  max_output_tokens: 8192
  native_tool_calling: true
  fallback_to_json_mode: true
  thinking:
    enable: true
    effort: "low"


final_verifier:
  model: "glm"
  temperature: 0.2
  template: "step5_verifier.md"
  # README.md is a declared content-mode output (see node "5" in dpe_default.yaml):
  # the verifier writes it via the engine-generated create_readme write tool and it
  # is delivered by the step's on_deliver repo_apply. No custom readme_* tools — the
  # repository is read-only for the verifier (via `from: repository` context + list_tree).
  tools: ["list_tree"]
  max_output_tokens: 16384
  max_tool_turns: 100
  native_tool_calling: true
  # Was false: native exhaustion then hard-failed the whole run. Enable JSON
  # fallback so the final verifier degrades gracefully like every other step.
  fallback_to_json_mode: true
  thinking:
    enable: true

final_verifier_reviewer:
  model: "flash"
  temperature: 0.1
  template: "step5_verifier_red.md"
  tools: ["list_tree"]
  max_output_tokens: 8192
  native_tool_calling: true
  fallback_to_json_mode: true
  thinking:
    enable: true
    effort: "low"
