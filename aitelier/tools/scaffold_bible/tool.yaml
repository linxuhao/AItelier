name: scaffold_bible
description: >
  Terminal tool of the novel_init graph. Reads the bible files the design step
  already wrote INTO THE CODE REPO — novel/bible/{overview.md, compass.md,
  characters.yaml, threads.yaml, arcs.yaml} — and normalizes them into the
  runtime layout: splits characters.yaml into per-character files (then DELETES
  characters.yaml), fills mechanical defaults, creates chapters/, rebuilds
  state/index.yaml, commits exactly the normalized novel tree and tags that
  commit `novel-genesis` as the reconcile baseline. Git discovery uses
  `git rev-parse`, so normal checkouts and linked worktrees are both supported.
  Completion is returned only after `git show` can read the tagged baseline.
  A commit/tag failure raises with the first Git error and leaves a private
  recovery record in the worktree gitdir; retrying this same tool resumes the
  freeze without regenerating or losing the bible. Pure transform, no LLM. Fails loud when
  overview.md / compass.md / characters.yaml are missing or invalid, when an arc
  has no plot nodes, when the exact target is not a Git worktree root, or when a
  completed index/genesis already exists (runs once per novel). Never overwrites
  an existing genesis tag. Returns {scaffolded, characters, threads, arcs,
  committed, genesis_tagged, commit, recovered}. There is no bible_seed.json input.
parameters:
  project_root:
    type: string
    description: "Project code repo root (auto-injected). Novel tree is scaffolded here."
    required: false
  workspace_root:
    type: string
    description: "Skillflow workspace root (auto-injected); fallback root when project_root is empty (tests)."
    required: false
  seed_step_dir:
    type: string
    description: "IGNORED. Kept only so callers that still pass it do not break; the bible is read from the repo, never from a seed file."
    required: false
