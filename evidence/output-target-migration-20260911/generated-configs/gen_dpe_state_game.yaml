begin: state_seed
capabilities:
- game_assets
description: Full dpe_game with deterministic State-contract seed preparation; original stages, reviews, checkpoints and game gates retained.
end_conditions:
  combinator: or
  conditions:
  - node: done
    type: node_reached
  - limit: 300
    type: max_total_steps
  - flag:
      fatal_error: true
    type: flag_match
