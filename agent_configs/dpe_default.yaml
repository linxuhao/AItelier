    effort: "low"


final_verifier:
  model: "deepseek/deepseek-v4-pro"
  temperature: 0.2
  template: "step5_verifier.md"
  # README.md is a declared content-mode output (see node "5" in dpe_default.yaml):
  # the verifier writes it via the engine-generated create_readme write tool and it
  # is delivered by the step's on_deliver repo_apply. No custom readme_* tools — the
  # repository is read-only for the verifier (via `from: repository` context + list_tree).
  tools: ["list_tree"]
  max_output_tokens: 16384
  max_tool_turns: 100
  native_tool_calling: true
  # Was false: native exhaustion then hard-failed the whole run. Enable JSON
  # fallback so the final verifier degrades gracefully like every other step.
  fallback_to_json_mode: true
  thinking:
    enable: true

final_verifier_reviewer:
  model: "deepseek/deepseek-v4-flash"
  temperature: 0.1
  template: "step5_verifier_red.md"
  tools: ["list_tree"]
  max_output_tokens: 8192
  native_tool_calling: true
  fallback_to_json_mode: true
  thinking:
    enable: true
    effort: "low"
