name: tasks_manifest_complete
description: >
  Validation: every task named in tasks_manifest.json must have a card on disk,
  and every card must be named in the manifest. Step 3 is `output.mode: content`
  — promotion REPLACES the whole step directory — so an agent that re-emits only
  the cards it changed silently deletes the rest, while the manifest keeps
  naming them. Nothing caught that: the step validated `file_exists` on the
  manifest alone. Live, 2026-08-26: a re-plan wrote 2 of 9 cards, promotion
  deleted the other 8 (git-confirmed), validation passed, and the break would
  not have surfaced until the task loop reached the first missing card — by
  which time the deleted cards were gone from the step dir.
parameters:
  step_dir:
    type: string
    description: "Directory holding tasks_manifest.json and tasks/ (auto-injected as the step's staging dir)."
    required: false
  out_dir:
    type: string
    description: "Fallback when step_dir is not injected."
    required: false
