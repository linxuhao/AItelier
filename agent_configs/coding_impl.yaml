# agent_configs/coding_impl.yaml
# Spawned implementer for the offloaded coding_impl graph. A REAL spawned agent
# (unlike coding_task's placeholder roles): it does the work in its own
# ephemeral context, so nothing here lands in the butler's window. Mirrors DPE's
# task_implementer tooling (write mode auto-derives surgical create/edit).

offload_implementer:
  model: "flash"
  temperature: 0.2
  template: "coding_impl.md"
  # create/edit derived from output.mode: write. list_tree/test helpers as DPE.
  tools: ["list_tree", "test_write", "read_test_written", "repo_remove_file"]
  max_output_tokens: 32768
  # 32, not 20. The 2026-09-09 parallel contract batch: one implementer had
  # every file written at turn 31 of a 32-turn extended budget and died
  # verifying its own work; another spent 16 tool calls grounding before
  # its first write and was still writing at 20. A contract artifact is a
  # 30-turn shape; 20 was a coding-task budget. Extension to 48 stays
  # available through ask_more_turns for the outliers.
  max_tool_turns: 32
  native_tool_calling: true
  fallback_to_json_mode: true
  thinking:
    enable: true
