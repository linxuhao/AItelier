name: gen_audio_asset
description: >
  Generate a REAL sound asset and write it into this step's staging dir, so the game
  ships audio instead of silence. Two kinds, and the choice matters:
  kind="sfx" synthesises a game effect procedurally (sfxr-style) from one of the
  presets jump/coin/hit/explosion/powerup/laser/select/hurt — instant,
  deterministic, and the right tool for a short transient; kind="bgm" generates a
  background music bed from a prompt (caps at 47s, mono, and gives NO seamless
  loop point, so do not promise a perfect loop); kind="voice" speaks one line of
  NPC dialogue in a CAST voice. Use "voice" rather than raw text-to-speech for
  anything a character says more than once: timbre there is a function of the
  text, not of the seed, so the same character's lines come back as different
  people. Casting the actor once from `voice` records a reference clip and every
  later line is spoken against it; casting is idempotent, so a re-run keeps the
  voice already in the repo. Returns {written, source_url} or {written:[], error}.
  Written into the step's staging dir ($STEP_TMP_DIR) whenever one exists — it
  reaches the repo through promotion + repo_apply; only a tool node with no
  staging dir writes straight into the repo working tree.
parameters:
  dest:
    type: string
    description: "Repo-relative destination path, e.g. assets/sfx/flap.wav"
    required: true
  kind:
    type: string
    description: "'sfx' (default, procedural effect), 'bgm' (generated music bed) or 'voice' (one cast NPC line)"
    required: false
  preset:
    type: string
    description: "REQUIRED for kind='sfx' (error otherwise): jump | coin | hit | explosion | powerup | laser | select | hurt"
    required: false
  prompt:
    type: string
    description: "kind='bgm' only: the music to generate. English works best"
    required: false
  duration:
    type: number
    description: "kind='bgm' only: seconds, capped at 47 (default 20)"
    required: false
  seed:
    type: integer
    description: "Fixes the result so a re-run reproduces the same asset"
    required: false
  project_root:
    type: string
    description: "Path to the project repo (auto-injected by the engine)"
    required: false
  out_dir:
    type: string
    description: "Step output dir (auto-injected)"
    required: false
  actor:
    type: string
    description: "kind='voice' only: the character speaking. First use casts them from `voice`; later uses reuse that timbre"
    required: false
  voice:
    type: string
    description: "kind='voice' only, NEW actor: natural-language description of the voice — age, gender, timbre, pace, temperament. English works best. e.g. 'An elderly Chinese man, gravelly chest voice, commanding'"
    required: false
  text:
    type: string
    description: "kind='voice' only (required with `actor`): the line to speak. Passed through untruncated — keep it to one line (~200 characters) so the clip stays short"
    required: false
  speaking_rate:
    type: number
    description: "kind='voice' only: speed multiplier (optional)"
    required: false
