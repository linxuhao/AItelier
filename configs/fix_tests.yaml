# configs/fix_tests.yaml
# OBJECTIVE-gated fix loop: run the test suite; if it fails, a spawned agent
# edits code to fix it and the suite runs again, looping until green or 3 tries.
# The gate is `run_tests` — a deterministic check that can't be sweet-talked, so
# this is more reliable (and cheaper) than an LLM reviewer for anything with a
# real test suite. Needs skillflow-py >= 1.5.2 (max_loop on a tool-fed gate).

name: "fix_tests"
description: "Run the tests; if failing, fix code and loop until green (bounded)"

x-aitelier:
  label: "Fix Failing Tests"
  scheduler_owned: true
  seed_file: "task.md"
  output_step: "test"
  input_hint: >-
    seed_text = optional hint (or "make the test suite pass"). Add
    against_project=<repo>. A spawned agent runs the tests and, if any fail,
    edits code to fix them, re-running until green or 3 attempts. Objective gate
    (run_tests) — no LLM reviewer. Poll to completion; the test step's
    test_report shows the final result.

begin: "fix"

end_conditions:
  combinator: or
  conditions:
    # Terminate at the loop-EXTERNAL `done` gate, reached only when tests pass
    # (test → done). node_reached must NOT be `test`: `test` is inside the loop,
    # so on a loop-back a stale `completed` test row from the prior iteration
    # would fire node_reached and report GREEN before the retried test runs
    # (proven in coding_impl). `done` is a gate (no completed row), reached at
    # most once. The never-passes loop is bounded by max_loop:3 below (fails
    # with CycleLimitExceeded once exhausted).
    - type: node_reached
      node: "done"
      result: "completed"
    - type: node_reached
      node: "node_gate_incomplete"
      result: "failed"
    - type: max_total_steps
      limit: 40

steps:
  - id: "fix"
    step_type: "agent"
    agent_config: "fix_worker"
    timeout_seconds: 600
    context:
      - source: { from: "repository", mode: "tool" }
      - source: { config: "fix_tests", output: "task.md" }
      - source: { step: "test" }          # on loop-back: the failing test_report
      - source: { tool: "dir_tree" }
    output:
      mode: write
      target: code
    transitions:
      - to: "test"

  - id: "test"
    step_type: "tool"
    tool_name: "run_tests"
    # The known-red baseline lives in the durable `state_dir` this capability injects.
    # Without it run_tests is handed none, no baseline is ever taken, and every
    # pre-existing red in the repo is reported as this round's — see configs/coding_impl.yaml.
    capability: "stateful"
    timeout_seconds: 1200
    tool_params:
      out_dir: "$STEP_DIR"
    transitions:
      # Order is load-bearing (the engine takes the first match). A measured red
      # keeps its fix loop even when a project was not measured, so the failing
      # edge comes first. Only then does an unmeasured project stop a green from
      # reaching `done`: a partial report with `passed: true` has no measured red,
      # and without the partial edge it would conclude success while a project
      # never ran.
      #
      # THE COMPLETENESS VERDICT NOW COMES OFF `run_tests`' RETURN, AND THE
      # SUCCESS EDGE IS POSITIVE. That is the whole change: a success edge that
      # matches `passed: true` accepts "not known to be incomplete", while this
      # one requires someone to have SAID the node gate was measured in full.
      # Measured fail-open this replaces: a report that did not contain the key
      # at all (an executor image older than this config, or a report written by
      # another producer) matched no edge that could have stopped it and fell
      # through to the raw `passed: true` that used to sit here, concluding
      # success with the node gate unmeasured. Now an absent key matches NOTHING
      # and the run dies on "No matching transition from 'test'", which is a
      # failure, not a success.
      #
      # `from_file` is gone from this field for the two measured reasons recorded
      # in `configs/coding_impl.yaml:205-235`: the reader is resolved against the
      # EVALUATING step's own output dir (so it only ever worked on this step),
      # and a report that parses to a list raises AttributeError inside the
      # engine's `_flags_match` instead of routing. `run_tests` puts
      # `node_gate_complete` on its return for every report it writes; the FILE
      # keeps it too, for `aitelier/gate_evidence.py` and the tests.
      #
      # The red edge still reads the file, and it stays on the file on purpose:
      # a non-delivery return (`written: None`, a storage failure) carries
      # `passed: false` WITH no report and deliberately no `node_gate_complete`,
      # and matching `passed` off the return would charge three implement laps to
      # something no edit can fix. As an unmatched edge it ends the run at once,
      # naming the reason.
      - to: "fix"                         # tests fail → fix, with the report
        match: { from_file: "test_report.json", field: "passed", value: false }
        max_loop: 3
      - to: "node_gate_incomplete"        # green, but a node project was not measured → not a success
        match: { field: "node_gate_complete", value: false }
      # Green AND said complete. BOTH conditions, not just the completeness one:
      # an EXHAUSTED `max_loop` edge is skipped by the resolver (`continue`), so
      # once the three repair laps are spent the red edge stops matching and
      # comes back through here — measured: a success edge keyed only on
      # `node_gate_complete: true` turned a suite that never passes into
      # `completed` (tests/skillflow/test_gated_pipelines.py::
      # test_fix_tests_never_passing_fails_bounded). Matching `passed` as a flag
      # here is what keeps that run on its bound (`Cycle limit exceeded`), and
      # the completeness term is what stops an absent key from ever arriving.
      - to: "done"                        # measured complete AND green → loop-external terminal
        match: { node_gate_complete: true, passed: true }

  # Loop-external terminal — reached only when the test step says the node gate
  # was measured in full AND the suite is green; the node the end-condition fires
  # on (see the comment on end_conditions). Gate = no completed step row, so it
  # fires at most once.
  - id: "done"
    step_type: "gate"
    transitions:
      - to: null

  # Terminal: a node project the run did not measure. Reached only from `test`
  # (edge above). It is NOT a success and NOT a fix-loop: a repository that did not
  # measure all of its own projects is a verdict nobody can act on by editing code.
  # Declared in end_conditions so the run ends here, as `failed`, rather than
  # parking or reading as completed.
  - id: "node_gate_incomplete"
    step_type: "gate"
    transitions:
      - to: null
