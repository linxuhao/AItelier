name: semantic_search
description: >
  Find the RIGHT LINES without reading the whole file: hybrid semantic +
  lexical search over the indexed repository (zvec-grep sidecar). Returns
  ranked, source-linked snippets grouped by file with line numbers — at most
  `limit` items (default 8, max 50), NOT an exhaustive occurrence list.
  Reach for this FIRST, before `read`, whenever a file is large or you are not
  certain which file holds the thing: one query hands you `path:start-end` and
  you then read only that range. Reading a 57 KB script to find one function
  costs several turns, and after the next few turns the text is no longer in
  front of you; a query costs one. It also answers what no pattern can —
  "where is X decided", "what runs after Y" — because it matches meaning, not
  spelling.
  `search` is the right tool for an exact identifier, a quotation, a regex, or
  when you need EVERY occurrence: it is exhaustive where this is ranked.
  The host prepares the exact run worktree and bounds the readiness wait.
  When preparation or semantic search is unavailable, the same call returns
  labelled literal-source results (`mode: literal_fallback`, `degraded: true`).
  These are not semantic rankings or an exhaustive occurrence list. If the
  root cannot be safely read while a lifecycle operation owns it, the call
  reports `mode: unavailable` without reading another checkout. Never interpret
  degradation or an empty bounded fallback as proof that something does not exist.
parameters:
  query:
    type: string
    description: "Natural-language or mixed query (what the code does, a concept, a relationship)."
    required: true
  limit:
    type: integer
    description: "Max ranked items (default 8, max 50)."
    required: false
  globs:
    type: array
    description: "Optional path rules, e.g. [\"scripts/**\", \"!scripts/generated/**\"]."
    required: false
  fts:
    type: array
    description: "Optional exact identifiers to anchor the ranking (ranked, not exhaustive)."
    required: false
