# configs/addons/game_harness.yaml — Godot game-harness addon overlay.
#
# Injected into the engine-agnostic DPE base (dpe_default.yaml) at registration
# time via skillflow.compose (see api/dependencies.py). Keeps game/engine
# concerns OUT of the base pipeline: to target a different engine (a web
# harness, a mobile harness) you write a sibling addon and swap the base's
# `overlays:` list — you never fork the DPE graph.
#
# What it adds: a deterministic Godot gate after the test gate that
#   1. parse-checks every GDScript + scene in the repo (import), then
#   2. if that passed, headless-play-tests the main scene, capturing runtime
#      errors (with res:// file+line) AND a live snapshot of scene-tree state,
#   3. then LOOKS at the frames step 2 rendered and fails when the game is
#      unreadable even though every behaviour assertion passed.
# All three land in compile_report.json / playtest_report.json /
# vision_report.json, folded into 5_review so parse, runtime and readability
# failures loop back through the goal-loop. No-ops (passes) for non-Godot
# projects, so applying it unconditionally is safe.

name: "game_harness"
# Base binding: this addon targets dpe_default_v2's anchors, so it is specific to
# that base (not generic). `alias` names the blessed base+THIS-addon combo, which
# core/addon_registry.py registers at boot as a runnable config. Multi-addon runs
# (run(base, [game_harness, ...])) get an emergent name instead.
base: "dpe_default_v2"
alias: "dpe_game"
description: "Godot compile + headless play-test gate for game projects."
whenToUse: "Building a Godot game — adds the parse gate + runtime play-test that captures errors and live scene state."

# Capabilities this addon OFFERS to the composed graph (unioned with the base's
# list at compose time, never replacing it). A PM may declare only what its
# pipeline offers, and the engine refuses anything else at claim time — so this
# line is what makes `capabilities: ["game_assets"]` legal on a task card of a
# game run, and illegal everywhere else.
capabilities: ["game_assets"]

overlay:
  # ── STEPS + TOOLS ──────────────────────────────────────────────────────────
  # 1. Mechanical (tool) channel: scaffold a Godot .gitignore into the repo right
  #    after it's created — guaranteed, doesn't depend on the LLM. Asset lives at
  #    configs/addons/game_harness/assets/dot_gitignore.
  - insert_after: "@post_repo_setup"
    steps:
      - id: "gh_scaffold"
        step_type: "tool"
        tool_name: "scaffold"
        timeout_seconds: 60
        tool_params:
          addon: "game_harness"

  # 2. Splice the Godot compile + headless play-test gate onto the edge out of
  #    the test gate.
  - insert_after: "@post_verify_tests"
    steps:
      - id: "5_compile"
        step_type: "tool"
        tool_name: "godot_compile"
        # 3900, not 300. The 300 was fiction: measured claim->complete for this
        # step is 515-1171s (jinyong-menu/oneaction/buttons, 2026-08-24/25), so
        # every single run blew through it and nothing was killed. A declared
        # limit that nothing enforces reads like a guard and guards nothing —
        # worse, it invites "the gate is slow, tighten the timeout" when the
        # real budget lives in post_playtest (3600s) plus the sidecar's 120s
        # per scenario. Keep this just above that so the outer number can never
        # be the one that fires first.
        timeout_seconds: 3900
        tool_params:
          out_dir: "$STEP_DIR"
        # No transitions: a step LIST wires sequentially, so this falls through
        # to 5_vision below, and 5_vision inherits 5_test's original target.

      # 2b. THE READABILITY GATE. 5_compile asserts STATE; this asserts that
      #     a player can SEE the state. jinyong-turn, 2026-08-22: scenario
      #     `two_phase_skill_unlock_and_hp_gate` passed 20/20 asserting
      #     `SkillButton5..8.disabled == true/false` — and in the frames that
      #     same run rendered, all eight buttons were pixel-identical across
      #     three rounds and two actor changes, no tile grid was visible in a
      #     tactical GRID game, five name labels were truncated to ellipses,
      #     and the health bars were unrecognisable as health bars. Every
      #     assertion was green. The play-test gate structurally cannot catch
      #     this: it reads the scene tree, not the pixels. So this step reads
      #     5_compile's OWN captures[] + frames/*.png — no extra playthrough,
      #     no extra render — and puts them in front of a vision model.
      #     The checklist is the game's own design record
      #     (design/30_presentation.md § 可读性硬要求), which also fixes the
      #     split: GEOMETRY (does the health bar follow its actor, do two rects
      #     intersect) stays in playtest_spec.yaml where numbers judge numbers,
      #     because the model scores a measured 0/2 on single-frame spatial
      #     questions; only RECOGNISABILITY and CROSS-FRAME DIFFERENTIAL
      #     questions come here, where it scores 3/3 and tracked a changing
      #     actor across four frames correctly. Frames go one scenario per
      #     call, chronologically, batched to the model's context — never
      #     sampled down.
      #     No project.godot → no-op pass, exactly like 5_compile. EVERY other
      #     way of not seeing (no report, no captures, missing PNGs, endpoint
      #     down, unparseable answer, a batch over budget) is a LOUD named
      #     failure rather than a pass: a vision check that cannot see and
      #     reports green is the precise defect this gate was built to catch.
      - id: "5_vision"
        step_type: "tool"
        tool_name: "godot_vision"
        timeout_seconds: 900
        tool_params:
          from_step: "5_compile"
          out_dir: "$STEP_DIR"
        # ── BLIND IS NOT FAILED ────────────────────────────────────────────
        # The gate has two ways to say `passed: false` and they call for
        # opposite responses:
        #     blind=false   the game IS unreadable   → go back and fix it
        #     blind=true    NOBODY LOOKED            → find someone who can
        # Both used to fall through to 5_review, which routes a readability
        # failure back to the PM. That is right for the first and a trap for
        # the second: no amount of re-planning makes an unreachable judge
        # answer, so the loop just burns until `Cycle limit exceeded`.
        #
        # Live, 2026-08-26: the judge dropped mid-run after 4 of 47 scenarios
        # (all at full HP). The PM was handed that as the readability verdict
        # and planned a health-bar rewrite on it — citing an injured-frame
        # answer no model had ever produced — and the round died on the cycle
        # limit hours later, having never once looked at an injured frame.
        #
        # So blind now ends at a checkpoint. A person (or an agent that can
        # actually see images) looks at the frames and decides. Approval is the
        # verdict: skillflow's approve carries no payload while reject carries
        # feedback, which maps exactly onto what a gate says —
        #     approve  "I looked. All six questions are fine."
        #     reject   "I looked. Here is what is wrong."  → back to the PM
        # There is deliberately no "proceed without looking": a gate that can
        # be waved through is the precise defect this gate exists to catch.
        transitions:
          - to: "5_vision_human"
            match: { from_file: "vision_report.json", field: "blind", value: true }
          - to: "5_knowledge"

      # The checkpoint modal surfaces the CHECKPOINT step's OWN dir, so restage
      # the gate's report into it — otherwise the reviewer is asked to judge a
      # gate whose output they cannot see. The frames themselves stay where they
      # are (188 PNGs, ~169 MB); the report names them, and the file browser
      # reaches them.
      - id: "5_vision_human"
        step_type: "tool"
        tool_name: "restage"
        tool_params:
          from_steps: ["5_vision"]
          # restage refuses to guess: without this it raises "out_dir not
          # resolved (expected $STEP_DIR)" and the step crashes. Every tool node
          # in this addon passes it; this one was written without it and took
          # the whole run down the first time the blind branch was ever reached.
          out_dir: "$STEP_DIR"
        checkpoint: true
        checkpoint_label: "可读性闸门没能看 —— 请看帧,按六问裁决"
        checkpoint_reject_to: "3"
        transitions:
          - to: "5_vision_judged"
            match: { from: "checkpoint", value: "approved" }

      # Runs only after approval — a tool cannot write its own checkpoint's
      # outcome, because a step's tool runs BEFORE that step pauses.
      - id: "5_vision_judged"
        step_type: "tool"
        tool_name: "vision_human_pass"
        # NO `tool_error: "route"` — the engine default (fail the step and the
        # run on a truthy `error`) is what this step wants. Every error it can
        # return means the human verdict was NOT recorded: no vision_report.json,
        # an unreadable one, a report that is not blind, or roots that were never
        # injected. Carrying on would send 5_review a report still saying the
        # judge could not see, which is the exact "waved through without
        # evidence" shape this gate exists to prevent.
        tool_params:
          vision_step: "5_vision"
          out_dir: "$STEP_DIR"
        transitions:
          - to: "5_knowledge"

  # ── CONTEXT ────────────────────────────────────────────────────────────────
  # 3. Let the final verifier read the gate's reports.
  # ── WHY THESE THREE ARE FILE-SCOPED, not `{step: "5_compile"}` ────────────
  #     Because a whole-step source inlines the step DIRECTORY, and this step's
  #     directory holds the 100+ PNGs the readability gate photographs. skillflow
  #     rglob's them and reads each as UTF-8-with-replacement (~56MB of binary),
  #     then the prompt assembler cuts the block at MAX_CONTEXT_LINES. Sorted
  #     order is compile_report.json, frames/*.png, playtest_report.json — so the
  #     file that gets cut is ALWAYS the play-test report.
  #     Live, jinyong-encounter 2026-08-23: 5_review blocked the run on
  #     "playtest gate NOT RUN — playtest_report.json ABSENT" while that file sat
  #     on disk at 98KB / 3526 lines with `passed: true` and 23 scenarios
  #     evaluated; the PM then planned the next round around a gate it believed
  #     had never run. Naming the files keeps the binary out and puts the
  #     play-test verdict where every reader can actually see it. The full JSON
  #     stays reachable through the step's read tool (`mode: both`).
  - add_context: "@verifier_review"
    source: { step: "5_compile", output: "compile_report.json" }
  - add_context: "@verifier_review"
    source: { step: "5_compile", output: "playtest_summary.md" }
  # 3a. …including the readability verdict. A verifier that reads only
  #     playtest_report.json reads 20/20 green over a screen no player could
  #     use, and signs the run off.
  - add_context: "@verifier_review"
    source: { step: "5_vision" }

  # 3b. And the PM — because the PM is who authors the FIX tasks. On a goal-loop
  #     iteration (5_review failed → back to "3") the PM is asked to plan repairs
  #     for a runtime failure whose only full account is playtest_report.json:
  #     per-scenario results, the assertion that failed, the captured node state,
  #     the frames. Without this the PM plans from the reviewer's prose summary
  #     of the report instead of the report.
  #     Live, jinyong-turn 2026-08-22: the PM called list(source="step:5_compile")
  #     and got "unknown source", then tried step:5 and found no playtest report
  #     there either — it was planning the turn-engine repair blind to the gate
  #     output that described the break.
  - add_context: "@pm"
    source: { step: "5_compile", output: "compile_report.json" }
  - add_context: "@pm"
    source: { step: "5_compile", output: "playtest_summary.md" }
  #     Same argument for 5_vision, and it bites harder: the readability
  #     failures ARE the task list ("no tile grid", "five names ellipsised"),
  #     and vision_report.json names the requirement each one broke. Without
  #     this the PM plans a UI repair from a one-line summary of what was
  #     unreadable.
  - add_context: "@pm"
    source: { step: "5_vision" }

  # 3c. And the two agents that actually WRITE the fix. On a goal-loop iteration
  #     the PM turns the gate output into task cards, but a card is prose ABOUT
  #     the failure — "scenario X is 6/12" — not the failure. The planner and the
  #     implementer need the failing assertion itself: the expression, the value
  #     the harness actually read, the frame it read it at. Without it they can
  #     only re-derive the runtime behaviour by reading the source, and a wrong
  #     guess costs a whole task slot.
  #     Live, jinyong-usable 2026-08-23: the implementer for
  #     `fix_enemy_turn_execution` wrote its justification as "playtest_report.json
  #     absent from this workspace — static-code diagnosis is branch (b)…" and
  #     re-timed three sample frames from the tween budget documented in the
  #     source, because the report that records what the harness actually saw at
  #     those frames was not in its context. It happened to reason correctly;
  #     it had no way to check.
  #     File-scoped for the same reason as 3a/3b — the step directory carries
  #     ~56MB of PNGs and a whole-step source truncates the report away.
  - add_context: "t_plan"
    source: { step: "5_compile", output: "playtest_summary.md" }
  - add_context: "t_impl"
    source: { step: "5_compile", output: "playtest_summary.md" }

  # ── PROMPT FRAGMENTS (add_template) ────────────────────────────────────────
  # 4. Godot conventions reach the architect/pm/implementer/verifier prompts ONLY
  #    when this addon is applied — the base templates stay engine-agnostic.
  #    The playtest_spec.yaml TDD contract is authored across two of them:
  #    architect declares the observable surface (scene/actions/nodes+vars +
  #    scenario skeletons); PM fills each scenario's assert thresholds; the
  #    implementer materialises the final spec into the repo verbatim; the
  #    godot_playtest gate reads it and evaluates the assertions.
  - add_template: "@architect"
    fragment: "game_harness/architect.md"
  - add_template: "@pm"
    fragment: "game_harness/pm.md"
  - add_template: "@implementer"
    fragment: "game_harness/implementer.md"

  # ── TOOLSET (add_tools) ────────────────────────────────────────────────────
  # The single-scenario Godot probe, granted to the implementer on GAME runs
  # only. It answers "is the scenario I was sent to repair green yet?" in ~50s
  # against the step's own staged edits, instead of ending the step and waiting
  # ~12 minutes for the full 26-scenario gate at 5_compile.
  #
  # This lived on the shared task_implementer role between 2026-08-24 and
  # skillflow-py 1.5.39, because add_tools was half-wired: compose parked the
  # name in config.extra_tools, claim time merged it into the tool SCHEMAS, and
  # the execution allowlist never read it — so the agent was offered the tool
  # and then refused when it called it. Fixed in skillflow a3eaff2 / 1.5.39.
  - add_tools: "@implementer"
    tools: ["godot_playtest_scenario"]
  - add_template: "@verifier_review"
    fragment: "game_harness/verifier.md"

  # ── DURABLE GAME DESIGN (design/) ──────────────────────────────────────────
  # 5. The design record that outlives a run. `step2_design.md` is per-run and
  #    disposable (it describes THIS run's change program); the game's actual
  #    systems, rules and content had no home in the repo at all — they lived in
  #    the meta_conversation brief, i.e. in the database. When the database went,
  #    every design decision ever made about the game went with it. Only the git
  #    repo survived. So the design record lives in the git repo.
  #
  #    Three channels, all in this addon:
  #      * gh_scaffold seeds the assets/design/ skeleton into a new repo
  #        (scaffold never clobbers, so an existing record is safe),
  #      * the architect and PM get it INLINE in their prompt — a contract they
  #        cannot forget to read, not a tool they might not call,
  #      * 5_design edits it after the run passes.
  - add_context: "@architect"
    source: { from: "repository", path: "design/", mode: "inline" }
  - add_context: "@pm"
    source: { from: "repository", path: "design/", mode: "inline" }

  # 6. The design keeper. Runs AFTER the gates and BEFORE the final review.
  #
  #    It used to sit on 5_review's PASS edge, so the record described only what
  #    SHIPPED — sound, but it had two costs that only showed up once the record
  #    grew teeth:
  #
  #    (a) NOBODY EVER READ IT. 5_design wrote design/ and went straight to
  #        `done`, downstream of the last reviewer. The one artifact that
  #        outlives every run was the one artifact no gate ever checked.
  #    (b) CLOSING A BACKLOG ROW WAS IMPOSSIBLE. design/40_ux_backlog.md rule 2
  #        wants a GATE RESULT before a row may be marked CLOSED, and the gate
  #        results (5_test / 5_compile / 5_vision) only exist after the task
  #        loop. Live 2026-08-26: an in-loop `backlog_closure` task hunted for
  #        `playtest_summary.md` at a repo-relative path, found instead a
  #        `final/verify_report.json` left over from the PREVIOUS round, and
  #        correctly refused to close on it — three rounds of work with no way
  #        to reach the one state the round was asked for.
  #
  #    Moving it here fixes both with no new step and no new context: 5_design
  #    already receives compile_report / playtest_summary / 5_vision / step 5,
  #    and consumes nothing 5_review produces, so it moves freely. The reviewer
  #    now sees the finished round — including every CLOSED row — and can judge
  #    whether the cited evidence actually bears on the row it closes. That is a
  #    judgement no regex over a hand-written markdown table can make.
  #
  #    The cost this trades away: the record is now written before the verdict,
  #    so a goal-loop iteration rewrites it. `mode: write` makes that harmless —
  #    the same surgical edits land again; nothing accumulates or is lost.
  #
  #    `output.mode: write` (same discipline as t_impl and novel_init's `design`)
  #    is the whole point: with `{from: repository}` as the baseline, the agent
  #    `edit`s the handful of design files this run actually changed and the rest
  #    are PHYSICALLY untouched. A content-mode slot would force a full rewrite of
  #    the document on every run — which does not scale past a small game, and
  #    quietly loses accumulated decisions the first time a model reorganises
  #    while regenerating.
  #
  #    Both transitions go to `done`, including the error branch: a failed design
  #    update must never sink an otherwise-green run. The cost is a stale record
  #    — visible in the run's step log, and recoverable, because it is in git.
  - insert_after: "5_knowledge"
    steps:
      - id: "5_design"
        step_type: "agent"
        agent_config: "game_designer"
        timeout_seconds: 600
        context:
          - source: { from: "repository", mode: "tool" }
          - source: { step: "2" }
          - source: { step: "5" }
          - source: { step: "5_compile", output: "compile_report.json" }
          - source: { step: "5_compile", output: "playtest_summary.md" }
          # …and the readability verdict. The design keeper records what SHIPPED,
          # and "the buttons have no visual state at all" is a fact about the
          # shipped game exactly as much as a failed assertion is. Without this
          # the record would describe a build as delivered while the one gate
          # that looked at it said it was unreadable.
          - source: { step: "5_vision" }
        output:
          mode: "write"
        # No validation: a run that changed no design writes NOTHING, and that is
        # the correct outcome — a file_exists gate here would push the agent to
        # invent a change to satisfy it.
        lifecycle:
          on_deliver:
            - tool: "repo_apply"
              params:
                source_dir: "$STEP_DIR"
              on_failure: "skip"
        # Both edges go to the REVIEWER now, not to `done`. The error branch
        # included: a failed design update must never sink an otherwise-green
        # run, and it must not skip the review either — a round whose record
        # could not be written is exactly the round a reviewer should see.
        transitions:
          - to: "5_review"
            match: { _error: true }
          - to: "5_review"
